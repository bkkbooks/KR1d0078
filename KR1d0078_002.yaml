body:
  text: 三禮圖集注卷二宋聶崇義撰褘衣音翬揄狄音搖翟闕狄音翟鞠衣展衣展又作袒褖衣純衣纁衻宵衣音綃墨車厭翟車金飾諸末笲橋內司服掌王后之六服褘衣揄狄闕狄鞠衣展衣褖衣此上六服皆以素沙為裏使之張顯但婦人之服不殊裳上下連則此素沙亦上下連也王之吉服有韋辨皮辨玄端三等裳服與后鞠衣以下三服同但王祭服有六后祭服唯有三翟耳何者天地山川社稷之等后夫人皆不與故三服而已必知外神后夫人不與者案內宰云祭祀祼獻則贊天地無祼唯宗廟有內宗外宗佐后皆云宗廟不云外神故知后於外神不與以其婦人無外事故也若然哀公問孔子云以為天地社稷主者彼見夫婦一體而言也又案後鄭云六服備於此者以諸經傳言婦人之服多矣文皆不備其六服唯此文為備鄭言此者亦欲推次六服之色故也是以一云闕翟赤褕翟青褘衣玄者以王后六服其色無文故須推次其色言推次以鞠衣象鞠塵其色黃褖衣與男子褖衣同其色黑二者為本以五行之色從下向上以次推之水色既黑褖衣象之黑矣水生於金褖衣上有袒衣則袒衣象之金色白金生於土土色黃鞠衣象之黃矣土生於火火色赤鞠衣上有闕翟則闕翟象之赤矣火生於木木色青闕翟上有褕翟象之青矣五行之色已盡六色唯有天色玄褘衣最在上象天色玄是自下推次其色然也三翟唯褘言衣者褘衣是六服之首故以衣目之也案漢志皇后謁廟服紺上皂下蠶上青下縹皆深衣制徐廣曰即單衣也隱領袖緣以絛假結步搖簪珥上太皇太后皇太后首飾云翦氂蔮結簪珥耳當垂珠也簪以玳瑁為揥長一尺端為華勝上為鳳凰爵以翡翠為毛羽下有白珠垂黃金鑷左右一橫簪之以安蔮結諸簪珥皆同制其揥有等級焉下云夫人魚須揥鄘風以象骨為揥是其等級與揥又作摘音竹革反步搖以黃金為山題貫白珠為桂枝相繆一爵九華熊虎赤羆天祿辟邪南山豐大特六獸詩所謂副笄六珈者也爵獸皆以翡翠為毛羽金題白珠璫繞以翡翠為華云副若今步搖釋名曰皇后副其上有垂珠步則搖也續漢志云乘輿黃赤綬四采黃赤縹紺淳黃圭長二丈九尺九寸五分五百首太皇太后皇太后其綬皆與乘輿同蔡雍獨斷曰皇后赤綬後漢鄧皇后賜馮貴人赤綬又加賜步搖環佩各一具凡先合單紡為一絲四絲為一扶五扶為一首五首成文文采淳為一圭首多者絲細少者絲粗廣尺六寸案周禮追師掌后首服為副編次名制有三等雖代有沿革稽諸典禮參於舊圖以意求之則古今之法髣佛而見矣其委貌形制古屨舄各於六服之下圖而解之褘衣翬雉衣也其色玄後鄭以為素質五采刻為翬雉之形五色畫之綴衣上以為文章后從王祭先王則服上公二王後魯夫人助君祭宗廟皆服之首飾亦副周禮追師掌王后之首服為副注云副者后夫人之首飾編髮為之笄衡笄也珈笄飾之最盛者所以別尊卑也後鄭云副之言覆也所以覆首為之飾珈之言加也今步搖上飾也古之制所有未聞孔疏云王后之衡笄皆以玉為之唯祭服有衡垂於副之兩傍當耳其下以五色紞懸玉瑱若編次則無衡其笄言珈者以玉飾笄后夫人首服尤尊者此別及衡笄以珈唯后夫人有之卿大夫已下則無故云別尊卑也又云珈之言加者以珈字從玉由副既笄而加此飾故謂之珈漢之步搖如周副之象故可以相類也古今之制不必盡同故古制得有未聞者以言六珈必飾之有六但所施不可考據此言六則侯伯夫人為六王后雖多少無文以侯伯夫人推之宜十二今但圖六則餘法可知又屨人注云玄舄為上褘衣之舄也凡舄與裳同色此與衣同色者以婦人尚専一德無所兼故連衣裳不異其色故云玄舄為上褘衣之舄也既玄舄配褘衣則青舄配揄翟赤舄配闕翟又云鞠衣以下皆屨者六服之三翟既以三舄配之則下文命夫命婦唯言屨不言舄故知鞠衣已下皆屨也又云舄屨有絇有繶有純飾也者言繶是牙底相接之縫綴黃絛於其中絇謂屨頭以黃絛為鼻絇拘也取拘持為行戒使人低目不妄視也純謂以黃絛為口緣凡舄之飾如繢次玄舄黃絇繶純者玄黃天地色相對為繢次之飾也赤絇繶純者王黑舄之飾也赤黑南北相對亦繢次之飾也黑絇繶純者王赤舄之飾也青絇繶純者王白舄之飾也青白東西對方亦繢次之飾也后之赤舄亦黑飾后之青舄亦白飾也若然爵辨纁屨黑絇繶純黑與纁南北相對用繢次為屨飾者尊祭服也凡屨之飾如繡次此約皮辨白屨黑絇繶純為飾白與黑西北次方為繡次之飾又后黃屨白絇繶純白屨黑絇繶純黑屨青絇繶純此三者鞠衣已下之屨也然則屨舄王有三等后有六等也上公以下夫人得服褘衣者亦玄舄也後鄭讀揄狄為搖翟雉名青質五采故刻繒為揄翟之形而五采畫之綴於衣上以為文章然則揄翟之衣其色青后從王祭先公則服之首飾佩綬與褘衣同青舄白絇繶純侯伯夫人助君祭宗廟亦服之首飾亦副案褘揄二翟皆刻繒為雉形又以五采畫之綴於衣此亦刻繒為雉形不以五色畫之故云闕翟其衣色赤俱刻赤色之繒為雉形間以文綴於衣上後鄭云今世有圭衣蓋三翟之遺俗也鄭君見漢時有圭衣刻為圭形綴於衣上是由周禮有三翟別刻繒為雉形綴於衣上漢俗尚有故云三翟之遺俗也首飾佩綬一如二翟赤舄黑絇繶純其子男夫人從君祭宗廟亦皆服之鞠衣者后告桑之服也案後鄭云鞠衣黃桑之服色如鞠塵象桑葉始生月令三月薦鞠衣於先帝告桑事又彼注云先帝太昊之屬知非天帝者以其言先不言上故知非天春時唯祭太昊之屬薦鞠衣於神坐為蠶求福也以蠶功既大總祭五方帝於明堂故云之屬以該之又孔賈疏云以季春將蠶后服之告先帝養蠶之服鞠者草名華色黃故季秋之月云菊有黃華是鞠衣黃也又云鞠塵不為麴者古字通用也又云象桑葉始生者以其桑葉始生則養蠶故服色象之其首服用編後鄭云謂編列髮為之其遺象若今假紒矣其佩綬如三翟黃屨白絇繶純屨之與舄形制大同惟襌底為異耳故屨人注云復下曰舄襌下曰屨復重也下謂底也然則襌底者名屨重底者名舄孤之妻從夫助君祭宗廟亦皆服之但紞用三采瑱用美石為異三采素青黃也知然者齊風著直居切詩云俟我於著乎而充耳以素乎而後鄭云我嫁者自謂也待我於著謂從君子出至於著我視君子則以素為充耳謂懸瑱之紞為素色下又云充耳以青充耳以黃據人臣三色妻亦然也又云尚之以瓊華尚飾也瓊美石華石色故知人臣用美石也彼毛以素為象瑱鄭不從者必若素是象瑱下文何得更云瓊英之事乎故鄭以素青黃皆為紞色也或曰鞠衣以下后紞亦三采展衣色白后以禮見王及賔客之服佩綬如上上首服亦編白屨黑絇繶純後鄭云展當為袒者案喪大記云世婦袒衣袒之言亶也亶誠也案詩鄘風君子偕老及此文皆作展並是正經鄭必讀為袒者以袒從衣而有衣義爾雅亶展雖同訓為誠展者言之誠亶者行之誠貴行賤言袒字以亶為聲有行誠之義故從袒也此亦卿大夫之妻從夫助君祭宗廟得服之案祭義曰君牽牲夫人奠盎君獻尸夫人薦豆卿大夫相君命婦相夫人是也褖衣色黑后接御見王之時則服褖衣及次案追師注云次者次第髮長短為之所謂髲髢也賈疏云所謂少牢主婦髲鬄即此次也鬄髢同音地彼注云古者或剔賤者刑者之髮而為之案魯哀公十七年説衛莊公自城上見已氏之妻髮美使髠之以為吕薑髢杜云吕薑莊公夫人髢髲也以此言之是取他髮為髢也則有不用他髮為髢自成紒者故鄘風君子偕老詩曰鬒髮如雲不屑髢也傳云鬒黑髮也如雲言長美屑潔也箋云髢髲也不潔髲者不用髲為善也是不用他髮為髲同合已髮潔為紒者也漢志説大手紒蓋謂此也其佩綬如上而黑屨白絇繶純士妻從夫助祭亦服之婦人褖衣之黑始因男子之玄端亦名褖衣知者案士冠禮陳服于房爵辨服皮辨服玄端服至於士喪禮陳襲事于房亦云爵辨服皮辨服褖衣此褖衣當玄端處所以變言之者冠時玄端衣裳別及死而襲玄端連衣裳與婦人褖衣同故雖男子玄端亦名褖衣也又見子羔襲用褖衣纁衻鄭注士昏禮云衻亦緣也褖衣纁緣是婦人嫁時之服亦非常衣也今子羔襲之故譏用婦服但纁衻與玄衣相對之物則男子褖衣黑矣男子褖衣既黑則婦人褖衣黑可知矣纁衻當嫁之女所服也士昏禮云女次純衣纁衻立于房中南面注云次首飾今之髲也周禮追師掌為副編次純衣絲衣也此衣亦玄色衻緣也衻之為言任也以纁緣其絲衣象隂氣上任於陽也取交接有依之義凡婦人不常施衻之衣盛昏禮為此服耳喪大記曰復不以衻明非常衣也詩武王女下嫁齊侯之子車服不繫其夫下王后一等乘厭翟服褕翟加纁衻首飾亦副此師姆母所著之衣也士昏禮云姆纚笄宵衣在其右注云姆婦人年五十無子而出不復嫁能以婦道教人者若今時乳母矣纚韜髮纚也笄今時簪也纚亦廣終幅長六尺宵讀為素衣朱綃之綃魯詩以綃為綺屬姆亦玄衣即褖衣也以綃為領因以為名且相別耳姆在女右當詔以婦禮賈公彥釋曰婦人年五十隂道絶無子出之此七出之一也然就七出之中餘六出是無德行不堪教人者故取無子而出不復嫁能以婦道教人者留以為姆既使教女因從女向夫家也纚亦如冠韜髮又纚以繒廣終幅長六尺以韜髮而紒之姆所異於女有纚有次姆則有纚無次宵讀為詩素衣朱綃之綃案詩唐風云素衣朱繡鄭箋破繡為綃此注據彼箋破字之義故直云素衣朱綃以為證也姆亦玄衣以綃為領因以為名者此衣雖言綃衣以亦與純衣同是褖衣用綃為領故因得名綃衣也且相別耳謂上文女曰純衣此姆曰宵衣雖同是褖衣而純衣宵衣名相別也姆在女右當詔以婦禮者案禮記少儀云贊幣自左詔辭自右地道尊右之義故姆在女右也古駕四馬輈上曲句衡輈轅也衡軛也轅從軫已前稍曲而上至衡輈居衡上向下句之衡居輈下如屋之梁然詩所謂梁輈也先以驂馬內轡繫於軾又有遊環貫驂馬之外轡遊移前郤在服馬之背以止驂馬之外出又服馬之外各以一條皮上繫於衡後繫於軫在服馬脅謂之脅驅以止驂馬之內入二服夾轅其頸負軛兩驂在旁施靷助之是於隂版之前隂版掩軌也以皮為靷前約驂馬之胸內繫於隂版外繫於軸以引之然則此車衡長六尺六寸止容二服而已兩驂頸不當衡故別為一靷以約馬胸引車軸也又以韅在馬背拘持二靷案士昏禮壻乘墨車士棧車大夫墨車壻是士子得乘墨車者攝盛故也大夫已上革鞔而漆之士棧車亦漆之但無革鞔與大夫為異耳鞔音莫干反考工記曰棧車欲弇音掩飾車欲侈然則大夫以上皆革鞔以飾其輿又有漆飾故得飾車之名士卑車雖有漆無革飾不得名墨車及飾車也故唯以棧車為名耳若然自卿以上更有異飾而名玉金象以五采畫轂而約謂之夏唯用五采畫轂無者謂之夏縵又有此五等之車案巾車云玉路以祀金路同姓以封象路異姓以封革路以封四衛木路以封蕃國孤夏卿夏縵大夫墨車士棧車庶人役車木路有革鞔無漆飾故名木路役車謂方箱可載任器以供役者也今士乘大夫墨車為攝盛則大夫當乘卿之夏縵卿乘孤之夏以上木路質而無飾不可使孤乘之但禮窮則同故孤還乘夏亦尊之義也若然庶人當乘士之棧車與則諸侯天子之尊不假攝盛依巾車自乘本車矣玉路非祭祀不可乘以親迎當乘金路矣以攝盛言之士冠與父同則昏禮亦同是尊適子皆與父同庶子宜降一等也下設轡執御皆同此然新圖此畫墨車二乘一是今法一是古法太子詹事尹拙議今車云當是目驗所見不堪垂法刪去可也工部尚書竇儀議云臣儀詳新圖所畫皆約三禮正文且於諸制之中不畫歷代沿革唯此駕部車之法遍見今世所宜以兹不倫致其異議未若惜畫蛇之餘力明馭馬之古規今已刪去今車乃從儀議男子立乘其車有蓋無帷裳婦人坐乘有蓋有帷裳案士昏禮説壻乘墨車下云婦車亦如之有裧注云亦如之者車同等裧車裳帷幃通周禮謂之容車有容則有蓋衛氓詩云淇水湯湯漸車帷裳童容也孔義云帷裳一名童容故巾車云重翟厭翟安車皆有容蓋先鄭云容謂幨車裧與襜同又或作襜皆昌廉反山東謂之帷裳或云童容即氓詩云漸車帷裳是山東名帷裳也以其帷障車之傍如裳以為容飾故謂之帷裳或謂之童容者其上有蓋四傍垂而下謂之裧故雜記云其輤有裧注云裧謂鱉甲邊緣是也然則童容與裧別而先鄭云容謂幨車者以其有童容者必有幨故謂之為幨車也惟婦人之車為然也王后始乘重翟王女下嫁諸侯乘厭翟服則褕翟後鄭云重翟重翟雉之羽厭翟次其羽使相迫也謂相次厭其本以蔽車也皆有容蓋舊圖以下著合卺破匏為之以線連柄端其制一同匏爵故不重出太子詹事尹拙議云今新圖不以金飾諸末乃引通典云自兩漢晉宋齊皇后唯乘重翟金塗五末轅一轂二箱二至後魏始説厭翟亦金飾諸末又云不畫八轡者工部尚書竇儀議云臣儀今詳新圖繢總鞶帶車未之飾皆已正矣其帷裳所畫翟雉但云以類求之臣亦檢尋未見本義所闕八轡請令畫之士昏禮質明贊見婦于舅姑婦執笲棗栗自門入升自西階進拜奠于舅席又降階受笲腶修升進北面拜奠于姑席下記云笲緇被纁裏注云被表也笲有表者婦見舅姑以飾為敬賈又釋上注云笲竹器而衣者以字從竹故知是竹器也其形蓋如今之筥􅹫蘆矣音墟盧漢時有筥􅠚蘆故舉之以況笲也但漢法去今逺其狀無以知之或見圖中如筥狀其口微弇而稍淺今取以為法笲音煩又舊圖讀如皮辨之辨以繒衣之容一斗昏禮記云笲緇被纁裏加于橋注云橋所以庪笲其制未聞庪居委反舊圖云讀如橋舉之橋以木為之似今之步案髙五尺下跗午貫舉笲處亦午為之此則漢法也既周制無聞今亦依用三禮圖集注卷二
