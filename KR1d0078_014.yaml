body:
  text: 三禮圖集注卷十四宋聶崇義撰雞彞雞彞舟鳥彞斝彞黃彞虎彞蜼彞畫布巾龍勺圭瓉瓉槃璋瓉獻尊阮氏義獻尊鄭氏義象尊阮氏義象尊鄭氏義著尊壺尊太尊山尊疏布巾玉爵爵坫罍有蓋雞彞受三斗宗廟器盛明水彞者法也言與諸尊為法也臣崇義先覽鄭圖形制如此案舊圖云於六彞之間唯雞鳥虎蜼四彞皆云刻木為之其圖乃畫雞鳯虎蜼四物之形各於背上負尊皆立一圎器之上其器三足漆赤中如火爐狀雖言容受之數並不説所盛之物今見祭器中有如圖內形狀仍於雞鳯腹下别作鐵腳距立在方板為别如其然則斝彞黃彞二器之上又何特畫禾稼眼目以飾尊乎形制二三皆非典實又案周禮司尊彞云春祠夏禴祼用雞彞鳥彞後鄭云謂刻而畫之為雞鳯皇之形著於尊上考文審象法制甚明今以黍寸之尺依而計之口圎徑九寸底徑七寸其腹上下空徑髙一尺足髙二寸下徑八寸其六彞所飾各畫本象雖别其形制容受皆同周禮司尊彞云春祠夏禴祼用雞彞鳥彞皆有舟先鄭云尊下臺若今承槃臣崇義先覽鄭圖頗詳制度其舟外漆朱中今以黍寸之尺審而計之槃口圎徑尺四寸其周髙厚各半寸槃下刻殺二等而漸大圎局足與槃通髙一尺足下空徑橫尺二寸六彞下舟形制皆同其舟足則各隨尊刻畫其類以飾之此舟漆赤中唯局足內青油畫雞為飾制度容受同雞彞用盛鬱鬯司尊彞云春祠夏禴祼用雞彞鳥彞謂春夏將祭先於奏樂降神之後王始以圭瓉酌此鳥彞鬱鬯以獻尸祼神后亦以璋瓉酌鬱鬯亞祼今二祼並奠於神座經云鳥彞後鄭以為畫鳳皇形於尊上知鳥是鳳皇者案尚書君奭云我則鳴鳥不聞彼鳴鳥是鳳皇故知此鳥彞亦鳯皇也其與舟俱漆並赤中前雞彞與舟欲見法度故圖之異處自鳥彞已下尊與舟相連圖之貴省略也斝彞盛明水先鄭讀斝為稼謂畫禾稼於尊因為尊名然則冝畫嘉禾以為飾其彞與舟並漆赤中其局足內亦漆畫禾稼為飾黃彞盛鬱鬯司尊彞云秋嘗冬蒸祼用斝彞黃彞皆有舟王以圭瓉酌獻尸禮神后以璋瓉亞獻後鄭云黃彞謂黃目以黃金為目也郊特牲曰黃目鬱氣之上尊也黃者中也目者氣之清明者也言酌於中而清明於外也其彞與舟並以金漆通漆虎彞畫虎於尊盛明水其尊與舟並漆赤中其局足內亦漆及畫虎為飾舊圗形制既非鄭義今亦不取於雞彞下已有解説蜼彞盛鬱鬯司尊彞云追享朝享祼用虎彞蜼彞皆有舟王亦以圭瓉酌鬱鬯以獻尸禮神后亦以璋瓉亞獻其形制亦與圖不同已在上解其彞與舟皆漆赤中其局足內亦漆畫蜼以為飾案爾雅云蜼卬鼻而長尾郭云蜼似獼猴而大黃黑色尾長數尺似獺尾末有岐鼻露向上雨即自縣於樹以尾塞鼻或以兩指江東人亦取養之為物捷健案天官幂人云以畫布巾幂六彞後鄭云宗廟尚文故用畫布賈疏云畫者畫五色雲氣也宗廟六彞盛鬱鬯以畫布幂之宗廟亦有八尊亦用畫布幂之案舊圗説籩巾云圎一幅則不言幅之廣狹王制孔疏云布幅廣二尺二寸帛幅廣二尺四寸此畫布當用二尺二寸之幅而亦圎也案少牢禮凡尊皆有蓋幂舊圗云柄長二尺四寸受五升士大夫漆赤中諸侯以白金飾天子以黃金飾臣崇義謹案周禮梓人云勺一升爵一升注云勺酌尊升也又明堂位曰夏后氏以龍勺注云為龍頭今以黍寸之尺計之柄長尺二寸口縱徑四寸半中央橫徑四寸兩頭橫徑各二寸又師儒相傳皆以刻勺頭為龍頭狀又案阮氏圗説蒲勺頭如鳬頭即知龍勺頭亦如龍頭明矣但以今圗與祭器內無此勺形故特圗於右用挹六彞之鬱鬯以注圭瓉玉人云祼圭尺有二寸有瓉以祀廟後鄭云祼謂以圭瓉酌鬱鬯以獻尸也瓉如槃大五升口徑八寸深二寸其柄用圭有流前注流謂鼻也故下注云鼻勺流也凡流皆為龍口又案大雅旱麓箋云圭瓉之狀以圭為柄黃金為勺青金為外朱中央凡圭博三寸又肆師職云大祀用玉帛牲牷次祀用牲幣小祀用牲後鄭云大祀天地宗廟臣崇義謹詳疏義自蒼璧以禮昊天至此圭瓉以祀宗廟於禮神玉帛牲牷之外别有燔瘞玉帛牲體其日月星辰社稷但有禮神之玉無燔瘞之玉也其宗廟雖在大祀惟説祼圭以禮神亦無所燔之玉今案諸家禮圗並無此説故形制差誤然圭柄金勺既異其牝牡相合處長可三寸厚一寸博二寸半流道空徑可五分其下三璋之勺皆類此典瑞注云漢禮瓉大五升口徑八寸下有槃口徑一尺臣崇義詳此注雖言槃口徑尺寸遍檢周禮正經及旱麓之詩箋注並不説槃之材飾今案玉府云若合諸侯則供朱槃玉敦注云敦槃珠以為飾疏云此槃敦應以木為之用珠玉為飾耳然則此瓉下之槃亦宜用黃金青金為外朱中央圭瓉既深二寸此槃冝深一寸足徑八寸髙二寸璋瓉者皇后酌鬱鬯獻尸禮神之器也其制一同圭瓉但用璋為柄器差小耳故司尊彞注云祼謂以圭瓉酌鬱鬯始獻尸也后於是以璋瓉酌亞祼是此璋瓉口徑亦四寸深二寸柄長九寸其下亦冝有槃口徑六寸深一寸足髙一寸徑四寸一如圭瓉槃形制案明堂位云獻象周尊也司尊彞云春祠夏禴其朝踐用兩獻尊一盛玄酒一盛醴齊王以玉爵酌醴齊以獻尸也禮器曰廟堂之上犧尊在西注云犧周禮作獻又詩頌毛傳説用沙羽以飾尊然則毛鄭獻沙二字讀與婆娑之娑義同皆謂刻鳳皇之象於尊其形婆娑然又詩傳疏説王肅注禮以犧象二尊並全刻牛象之形鑿背為尊今見祭器內有作牛象之形背上各刻蓮華座又與尊不相連比與王義大同而小異案阮氏圗其犧尊飾以牛又云諸侯飾口以象骨天子飾以玉其圗中形制亦於尊上畫牛為飾則與王肅所説全殊揆之人情可為一法今與鄭義並圖於右請擇而用之周禮司尊彞云春祠夏禴其再獻用兩象尊一盛玄酒一盛盎齊王以玉爵酌獻尸後鄭云象尊以象骨飾尊梁正阮氏則以畫象飾尊今並圗於右亦請擇而用之著尊受五斗漆赤中舊圗有朱帶者與概尊相涉恐非其制周禮司尊彞云秋嘗冬蒸其朝獻用兩著尊一盛玄酒一盛醴齊王以玉爵酌獻尸明堂位曰著殷尊也注云著著地無足今以黍寸之尺計之口圎徑一尺二寸底徑八寸上下空徑一尺五分與獻尊象尊形制容受並同但無足及飾耳壺尊受五斗周禮司尊彞云秋嘗冬蒸其饋獻用兩壺尊一盛玄酒一盛盎齊王以玉爵酌獻尸注云壺尊以壺為尊也左傳曰尊以魯壺今以黍寸之尺計之口圎徑八寸脰髙二寸中徑六寸半脰下橫徑八寸腹下橫徑一尺一寸底徑八寸腹上下空徑一尺二寸足髙二寸下橫徑九寸漆赤中舊圗文略制度之法無聞六尊用同盛受之數難異太尊受五斗周禮司尊彞云追享朝享其朝踐用兩太尊一盛玄酒一盛醴齊王用玉爵酌醴齊獻尸注云太尊太古之瓦尊也明堂位曰泰有虞氏之尊也今以黍寸之尺計之口圎徑一尺脰髙三寸中橫徑九寸脰下大橫徑一尺二寸底徑八寸腹上下空徑一尺五分厚半寸脣寸底平厚寸與瓦甒形制容受皆同山尊受五斗周禮司尊彞云追享朝享其再獻用兩山尊一盛玄酒一盛盎齊王用玉爵酌盎齊以獻尸注云山尊山罍也明堂位曰山罍夏后氏之尊亦刻而畫之為山雲之形今以黍寸之尺計之口圎徑九寸腹髙三寸中橫徑八寸脰下大橫徑尺二寸底徑八寸腹上下空徑一尺五分足髙二寸下徑九寸知受五斗者案郭璞云罍形似壺大者受一斛今山罍既在中尊之列受受五斗可知也祭天地以疏布巾幂八尊後鄭注幂人云以巾覆物曰幂天地之神尚質故用疏布巾也賈義云天地無祼唯有五齊三酒實於八尊此據正尊而言若五齊加明水三酒加玄酒則十六尊皆以疏布幂之天地雖無鬱鬯之彞亦用疏布幂之其四望山川社稷林澤亦用疏布是尚質也此巾亦用二尺二寸之幅而圎也禮幂巾有用絺綌者至於帨巾亦用布今唐禮亦用布或羅絹而已太宰職云享先王贊玉爵後鄭云宗廟獻用玉爵受一升今以黍寸之尺校之口徑四寸底徑二寸上下徑二寸二分圎足案梁正阮氏圖云爵尾長六寸博二寸傅翼方足漆赤中畫赤雲氣此非宗廟獻尸之爵也今見祭器內有刻木為雀形腹下别以鐵作腳距立在方板一同雞彞鳥彞之狀亦失之矣臣崇義案漢書律厯志説斛之制口足皆圎有兩耳而云其狀似爵又案士虞禮云賔長洗繶爵三獻尸鄭云繶爵口足之間有篆飾今取律厯志嘉量之説原康成解繶爵之言圖此爵形近得其實而况前代垂範觀象以制器服義非一揆或假名全畫其物或取類半刻其形則雞鳥已下六彞褘褕上音揮下音搖青素二質是全畫其物著於服器者也玉爵柄尺之類龍勺蒲勺之倫是半刻其形飾於器皿以類取名者也以此而言犧象二尊自然畫飾至於夏之九鼎鑄以象物取其名義亦斯類也坫以致爵亦以承尊若施於燕射之禮則曰􅞱音豐賈義云今諸經承尊爵之器不用本字之􅞱皆用豐年之豐從豆為形以􅞱為聲也何者以其時和年豐榖豆多有粢盛豐備神歆其祀人受其福也故後鄭注云豐似豆而卑都斫一木為之口圎微侈徑尺二寸其周髙厚俱八分中央直者與周通髙八寸橫徑八寸足髙二寸下徑尺四寸漆赤中畫赤雲氣亦隨爵為飾今祭器內無此豐坫或致爵於俎上故圗之於右請置用之案司尊彞職云春祠夏禴祼用雞彞鳥彞皆有舟六彞皆受三斗朝踐用兩獻尊音素何反六尊皆受五斗諸臣之所酢也張鎰引阮氏圗云瓦為之受五斗赤雲氣畫山文大中身鋭平底有蓋張鎰指此瓦罍為諸臣所酢之罍誤之甚矣此瓦罍正謂祭社之太罍也又開元禮云宗廟春夏每室雞彞一鳥彞一犧尊二象尊二山罍二但於罍上加一山字並不言容受之數案周禮六尊之下唯言皆有罍並無山罍瓦罍之名又不知張鎰等各何依據指此山瓦二罍以為諸臣所酢者也况此六罍厠在六尊之間以盛三酒比於六尊設之稍逺案禮記以少為貴則近者小而逺者大則此罍不得容五斗也又爾雅釋器云彞卣罍器也郭璞云皆盛酒尊又曰小罍謂之坎注云罍形似壺大者一斛又曰卣中尊也此欲見彞為上尊罍為下尊也然則六彞為上受三斗六尊為中受五斗六罍為下受一斛是其差也案詩周南風我姑酌彼金罍孔疏毛傳指此諸臣所酢之罍而受一石者也又引禮圖依制度刻木為之又鄭注司尊彞云罍刻而畫之為山雲之形既言刻畫則用木矣又引韓詩説士用梓無飾言其木體則士已上同用梓而加飾耳又毛以金罍大一石禮圗亦云大一斛毛説諸臣之所酢與周禮同天子用黃金為飾今據孔賈疏義毛鄭傳注此罍用木不用瓦受一石非五斗明矣謹以黍寸之尺依而計之口徑九寸五分脰髙三寸中徑七寸五分脰下橫徑九寸底徑九寸腹中橫徑一尺四寸上下中徑一尺六寸足髙二寸下徑一尺畫山雲之形三禮圖集注卷十四
