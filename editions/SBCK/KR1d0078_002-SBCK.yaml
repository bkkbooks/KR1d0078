front:
  text: 新定三禮后服圗卷第二
  hash: sha256:3869da8cbd82b0810a94626de818c8b0afdf0de1d72962984ee8d706178a0cca
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1d0078_SBCK_001-16b}
body:
  text: 通議大夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注禕衣音翬䄖狄音揺翟闕狄音翟鞠衣展衣展又作䄠禒衣褕狄纁袡宵衣音綃墨車厭翟車金飾諸未笲橋内司服掌王后之六服禕衣䄖狄闕狄鞠衣展衣禒衣此上六服皆以素紗爲裏使之張顯但婦人之服不殊裳上下連則此素紗亦上下連也王之吉服有九韋弁皮弁􅀇端三等裳服與后鞠衣巳下三服同但王祭服有六后祭服唯有三翟耳何者天地山川社禝之等后夫人皆不與故三服而巳必知外神后夫人不與者按内宰云祭祀祼獻則賛天地無祼唯宗廟有内宗外宗佐后皆云宗廟不云外神故知后於外神不與以其婦人無外事故也若然哀公問孔子云以爲天地社禝主者彼見夫婦一體而言也又按後鄭云六服備扵此者以諸經傳言婦人之服多矣文皆不備其六服唯此文爲備鄭言此者亦欲推次六服之色故也是以下云闕翟赤褕翟青禕衣􅀇者以王后六服其色無文故湏推次其色言推次以鞠衣象鞠塵其色黄褖衣與男子禒衣同其色黒二者爲本以五行之色從下向上以次推之水色既黒褖衣象之黒矣水生於金褖衣上有襢衣則襢衣象之金色白金生於土土色黄鞠衣象之黄矣土生於火火色赤鞠衣上有闕翟則闕翟象之赤矣火生於木木色青闕翟上有褕翟象之青矣五行之色已盡六色唯有天色􅀇禕衣最在上象天色􅀇是自下推次其色然也三翟唯禕言衣者禕衣是六服之首故以衣目之也按漢志皇后謁廟服紺上皁下􅅙上青下縹皆深衣制徐廣曰即單衣也隱領袖縁以絛假結歩揺簮珥上太皇太后皇太后首飾云翦􅈊蔮結簮珥耳當垂珠也簮以瑇瑁為揥長一尺端為華勝上為鳯皇爵以翡翠為毛羽下有白珠垂黄金鑷左右一横簮之以安國結諸簮珥皆同制其揥有等級焉下云夫人魚湏揥詩風以象骨爲揥是其等級與揥又作摘音竹革反歩揺以黄金爲山題貫白珠爲桂枝相繆一爵九華熊虎赤羆天祿辟邪南山豊大特六獸詩所謂副笄六珈者也爵獸皆以翡翠為毛羽金題白珠璫繞以翡翠為華云副若今歩揺釋名曰皇后副其上有垂珠歩則揺也續漢志云乗輿黄赤綬四采黄赤縹紺淳黃圭長二丈九尺九寸五分五百首太皇太后皇太后其綬皆與乗輿同蔡邕獨斷曰皇后赤綬後漢鄧皇后賜馮貴人赤綬又加賜歩揺環佩各一具凡先合單紡為一􅁝四􅁝為一扶五扶為一首五首成文文采淳為一圭首多者􅁝細少者􅁝麁廣尺六寸按周禮追師掌后首服爲副編次名制有三等雖代有㳂革稽諸典禮叅於舊圗以意求之則古今之法髣髴而見矣其委也今歩揺上飾也古之制所有未聞孔䟽云王后之衡笄皆以玉爲之唯祭服有衡垂於副之兩傍當耳其下以五色紞懸玉瑱若編次則無衡其笄言珈者以玉飾笄后夫人首飾尤尊者此別及衡笄以珈唯后夫人有之卿大夫巳下則無故云別尊卑也又云珈之言加者以珈字從玉由副既笄而加此飾故謂之珈漢之歩揺如周副之象故可以相􅀋也古今之制不必盡同故古制得有未聞者以言六珈必飾之有六但所施不可言據此言六則侯伯夫人爲六王后雖多少無文以侯伯夫人推之冝十二今但圗六則餘法可知又屨人注云􅀇舄爲上禕衣之舄也凡舄與裳同色此與衣同色者以婦人尚專一徳無所兼故連衣裳不異其色故云􅀇冩爲上禕衣之舄也既􅀇舄配禕衣則青舄配揺翟赤舄配闕翟又云鞠衣以下皆屨者六服之三翟既以三舄配之則下文命夫命婦唯言屨不言舄故知鞠衣巳下皆屨也又云舄屨有絇有繶有純飾也者言繶是牙底相接之縫綴黄絛於其中絇謂屨頭以黃絛爲􅈹絇拘也􅂑拘持爲行戒使人低目不妄視也純謂以黃絛爲口縁凡舄之飾如繢次玄舄黄絇繶純者􅀇黄天地色相對爲繢次之飾也赤絇繶純者王黒舄之飾也赤黒南北相對亦繢次之飾也黒絇繶純者王赤舄之飾也青絇繶純者王白舄之飾也青白東西對方亦繢次之飾也后之赤舄亦黒飾后之青舄亦白飾也若然爵弁纁屨黒絇繶純黒與纁南北相對用繢次爲屨飾者尊祭服也凡屨之飾如繡次此約皮弁白屨黒絇繶純爲飾白與黒西北次方爲繡次之飾又后黄屨白絇繶之又孔賈䟽云以季春將􅁞后服之告先帝養􅁞之服鞠者草名華色黄故季秋之月云菊有黄華是鞠衣黄也又云鞠塵不爲麴者古字通用也又云象桑葉始生者以其桑葉始生則養􅁞故服色象之其首服用編後鄭云謂編列髮爲之其遺象若介假紒矣其珮綬如三翟黄屨白絇繶純屨之與舄形制大同惟禪底爲異耳故屨人注云􅃨下曰舄禪下曰屨􅃨重也下謂底也然則禪底者名屨重底者名舄􅀌之妻從夫助君祭宗廟亦皆服之但紞用三采瑱用羙石爲異三采素青黄也知然者齊風著直居切詩云俟我於著乎而充耳以素乎而後鄭云我嫁者自謂也待我於著謂從君子出至于著我視君子則以素爲充耳謂懸瑱之紞爲素色下又云充耳以青充耳以黄據人臣三色妻亦然也又云尚禒衣色黒后接御見王之時則服禒衣及次按追師注云次者次第髮長短爲之所謂髲髢也賈䟽云所謂少牢主婦髲鬄即此次也鬄髢同音地彼注云古者或剔賤者刑者之髮而爲之按魯哀公十七年􅀃衛荘公自城上見己氏之妻髮羙使髠之以爲吕姜髢杜云吕姜荘公夫人髢髲也以此言之是􅂑他髪爲髢也則有不用他髪爲髢自成紒者故􅅠風君子偕老詩曰鬒髮如雲不屑髢也傳云鬒黒髪也如雲言長美屑絜也箋云髢髲也不絜髲者不用髲爲善也是不用他髮爲髲同合己髪絜爲紒者也漢志􅀃大手紒盖謂此也其珮綬如上而黒屨白繶絇純士妻從夫􅂇祭亦服之婦人禒衣之黒始因男子之􅀇端亦名禒衣知者按士冠禮陳服于房爵弁服皮弁服􅀇端服至於士䘮禮陳􅊞事于此師姆母所著之衣也士昬禮云姆纚笄宵衣在其右注云姆婦人年五十無子而出不復嫁或以婦道教人者若今時乳母矣纚韜髪纚也笄今時簮也纚亦廣終幅長六尺宵讀爲素衣朱綃之綃魯詩以綃爲綺屬姆亦􅀇衣即禒衣也以綃爲領因以爲名且相别耳姆在女右當詔以婦禮賈公彦釋曰婦人年五十隂道絶無子出之此七出之一也然就七出之中餘六出是無徳行不堪教人者故􅂑無子而出不復嫁􅀎以婦道教人者留以爲姆既使教女因從女向夫家也纚亦如冠韜髮又纚以繒廣終幅長六尺以韜髪而紒之姆所異於女有纚有次姆則有纚無次宵讀爲詩素衣朱綃之綃按詩晉風云素衣朱繡鄭箋破繡爲綃此注據彼箋破字之義故真云素衣朱綃以爲證也姆亦􅀇衣以綃爲領因以爲名者此衣雖言綃衣以亦與純衣同是禒衣用綃爲領故因得名綃衣也且相別耳謂上文女曰純衣此姆曰宵衣雖同是禒衣而純衣宵衣名相别也姆在女右當詔以婦禮者按禮記少儀云賛幣自左詔辭自右地道尊右之義故姆在女右也車雖有􅃮無革飾不得名墨車及飾車也故唯以棧車爲名耳若然自卿巳上更有異飾而名玉金象以五采畫轂而􅂐約謂之夏􅂐唯用五采畫轂無􅂐者謂之夏縵又有此五等之車按巾車云玉路以祀金路同姓以封象路異姓以封革路以封四衛木路以封蕃􅀦􅀌夏􅂐卿夏縵大夫墨車士棧車庻人役車木路有革鞔無􅃮飾故名木路投車謂方箱可載任噐似供役者也今士乗大夫墨車爲攝盛則大夫當乗卿之夏縵卿乗􅀌之夏􅂐巳上木路質而無飾不可使􅀌乗之但禮窮則同故􅀌還乗夏􅂐亦尊之義也若然庻人當乗士之棧車輿則諸侯天子之尊不假攝盛依巾車自乗本車矣五路非祭祀不可乗以親迎當乗金路矣以攝盛言之士冠與父同則昬禮亦同是尊適子皆與父同庻子冝降一等也下設轡執御皆同此然新圖此畫墨車二乗一是今注一是古法太子詹事尹拙議今車云當是目驗所見不堪垂法刪去可也工部尚書竇儀議云臣儀詳新圖所畫皆約三禮正文且於諸制之中不畫歴代㳂革唯此駕部車之法徧見今世所冝以兹不倫致其異議未若惜畫地之餘力明馭馬之古䂓今巳刪去今車乃從馭議男子立乗其車有盖無帷裳婦人坐乗有盖有帷裳按士昬禮􅀃壻乗墨車下云婦車亦如之有裧注云亦如之者車同等裧車裳帷幃通周禮謂之容車有容則有盖衛氓詩云淇水湯湯漸車帷裳童容也孔義云帷裳一名童容故巾車云重翟厭翟安車皆有容盖先鄭云容謂幨車裧與幨同又或作襜皆昌廉反山東謂之帷裳或曰童容即氓詩云漸車帷裳是山東名帷裳也以其帷障車之傍如裳以爲容飾故謂之帷裳或謂之童容者其上有盖四傍垂而下謂之裧故雜記云其輤有裧注云裧謂鼈甲􅁁縁是也然則童容與裧別而先鄭云容謂幨車者以其有童容者必有幨故謂之爲幨車也惟婦人之車爲然也王后始乗重翟王女下嫁諸侯乗厭翟服則褕翟後鄭云重翟重翟雉之羽厭翟次其羽使相迫也謂相次厭其析城鄭氏家塾重校三禮冠冕圖卷第
