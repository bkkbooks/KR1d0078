front:
  text: 析城鄭氏重校三禮鼎俎圖卷第十三通義大夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注
  hash: sha256:3b173739b19731ad2771058885529c61afce604d01445142ffffc7031daf1238
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1d0078_SBCK_013-1a}
body:
  text: 斛量名釡牛鼎羊鼎豕鼎鼎幂牛鼎扄羊鼎扄豕鼎扄朼䟽匕挑匕上􅄍彫反又音由畢鉶鼎有蓋鉶柶洗洗罍洗勺盥盤上音管匜簋有蓋簠有蓋敦音對有蓋籩籩巾豆有蓋登有蓋梡俎嶡俎椇俎房俎斛釡釡量名容六斗四􅂛曰釡故以所容爲名桉周禮㮚氏爲鬴賈䟽云謂量金汁入模以爲六斗四􅂛之鬴又晏子曰齊舊四量豆區釡鍾四􅂛爲豆而四豆爲區四區爲釡釡十則鍾然則鬴即釡也以金錫爲之與鍾鼎同齊謂四分其金而錫居其一深尺内方尺積千寸於今粟米法少二􅂛八十一分􅂛之二十二圜其外謂遶其口而圜之又厚之以爲脣耳在旁者而可舉也舊圖釡在畢洗之間都不言所設之由又無尺寸之法但云釡制度受三斛或云五斛旣圖之失處而容受不定未詳據何制度有三五惑􅀃今據經傳明文賈鄭義注庶遵往式有􅀘將來又桉舊圖有釡而無斛但以二量之法互有異同原始要終相兼仍備故並圖之於前以爲諸器之准匕是其重也旣非法制今亦略而不圖有司云雍人合執貳俎陳於羊俎西並皆西縮覆貳䟽匕于其上皆縮俎西枋音柄注云䟽匕匕柄有刻飾賈䟽云以其言䟽是䟽通刻之􅀂䟽屏之􅀋鄭注䟽屏以爲刻畫雲氣蟲獸此唯刻畫雲氣通飾其柄舊圖䟽匕亦形如飯音鍫以􅁄爲之長二尺四寸葉長八寸􅀶三寸其柄葉通䟽皆丹􅃮之案挑匕注云此亦淺􅂛爲之通䟽其葉似失之矣亦丹淺􅂛并雲氣爲是有司云馬在羊鼎之東二手執挑匕枋音柄以挹湆注于􅁥本無此巳上文舊圖云鉶受一斗兩耳三足髙二寸有蓋士以鐵爲之大夫巳上以銅爲之諸侯飾以白金天子飾以黃金臣崇義案鉶是羹器即鉶鼎也故周禮亨人祭祀則供鉶羹而掌客注云不殺則無鉶鼎又公食大夫禮注云鉶者菜羹和之器故䟽引下記牛以藿羊以苦豕以薇是菜和羹也以鉶盛此羹故云之器然則據羹在鉶則曰鉶羹據器言之則曰鉶鼎據在正鼎之後設之則謂之陪鼎據入庶羞言之則謂之羞鼎其實一也今以黍寸之尺計之其口徑底徑并深皆六寸乃受一斗之數今見祭器中有以木爲之者平底無足紅油畫之鉶字恐相傳爲誤故廣引經文注義鉶鼎施用所在圖之於右凡鉶有柶醴有柶用角爲之鉶有柶用木爲之舊圖云柶長尺㯿􅀶三寸㯿音葉夲又作二寸其醴柶冝爲二寸曲柄長六寸漆赤中及柄端臣崇義案聘禮云以柶祭醴尚㯿少牢禮云以柶祭羊鉶遂以祭豕鉶又士冠禮注云柶狀如匕以角爲之滑也今祭鉶之柶旣用木亦冝如䟽匕淺􅂛爲之方得挹鉶芼之湆以祭之也醴柶㯿又淺於鉶柶今案梁阮二氏不辨醴鉶二柶唯云柶圖爲勺形無淺􅀷之語恐失之矣又公食大夫禮云設四鉶于豆西又曰扱上鉶以柶辯音徧擩之上鉶之間祭注云扱以柶扱其菜鉶也賈䟽云此經有四鉶而扱上鉶辯擩則有一優賔故用一柶而巳少牢羞兩鉶皆有柶口扱以柶祭羊鉶豕鉶彼爲祭神故冝各有柶也洗洗罍旣用木爲洗以金飾口縁朱中其外油畫水文菱花及魚以飾之是其􅀋也案舊圖亦謂之洗壷受一斛口徑一尺脛髙五寸侈旁一寸大中身銳下漆赤中元士加青雲氣諸􅀃壷與罍形制相似今以壷言之下不可小謹以黍寸之尺計之口空徑一尺一寸脰髙五寸脰中橫徑一尺脰下橫徑一尺腹中橫徑一尺四寸底徑一尺足髙三寸下橫徑一尺二寸自脰下至底中央直徑一尺四寸半乃容一石之數又案鄭注儀禮云水器尊卑皆用金罍及大小異賈䟽云此亦據漢禮記器制度云尊卑皆用金罍及其大小皆異凡罍洗及酌水之枓音注同時而設今桉儀禮諸篇士冠士昬禮郷飲酒與郷射及郊特牲禮皆直言水不言罍燕禮與大射雖言罍水並不言枓少牢司舊圖云外方内圎曰簠足髙二寸挫其四角漆赤中臣崇義案掌客注云簠稻梁器又考工記旊人爲簋及豆皆以瓦爲之雖不言簠以簋是相將之器亦應制在旊人亦有蓋䟽云據祭天地之神尚質器用陶匏而巳故郊特牲云器用陶匏以象天地之性也􅀂祭宗廟則皆用木爲之今以黍寸之尺計之口圎徑六寸深七寸二分底徑亦五寸二分厚八分足底徑六寸厚半寸脣寸所盛之數及蓋之形制並與簋同舊圖云内方外圎曰簋足髙二寸漆赤中臣崇義案鄭注地官舎人秋官掌客及禮器云圎曰簋盛黍稷之器有蓋象􅀛形外圎函方以中規矩天子飾以玉諸侯飾以象又案考工記瓬人爲簋受一斗二􅂛髙一尺厚半寸脣寸又以黍寸之尺校之口徑五寸二分深七寸二寸足徑尺八寸髙二尺四寸小身有蓋似豆狀所記制度並非禮文􅀋之於豆則形制全大比之豐坫又髙下相殊旣非正經不可依據臣崇義案爾雅云木豆謂之豆竹豆謂之籩瓦豆謂之登大雅生民篇曰于豆于登毛傳云木曰豆瓦曰登其在周禮旊人爲瓦豆而實四􅂛髙一尺空徑二寸厚半寸又生民傳云豆薦葅醢登盛大羹以其盛湆故有蓋也然則瓦木竹之三豆隨材造作殊名其制大小無異況此圖以三禮爲目梁阮二氏自題又何捨此正經别資他􅀃貴從典故豈好是非今依周禮旊人制度爲定梡俎嶡俎足足下各别爲柎足間橫者似堂之壁橫下二柎似堂之東西兩頭各有房也臣崇義又案詩魯頌曰籩豆大房箋云大房玉飾俎也其制足間有橫下有柎似乎堂後有房然詩䟽云俎大房者以其用玉飾之美大其器故稱大也知用玉飾者以俎豆相􅀋之物明堂位􅀃周公之禮云薦用玉豆豆以玉飾明俎亦用玉飾也云其制足間橫其下有柎以明堂位文差次爲然柎上有橫似於堂上有房故謂之房此􅀃稍長􅀼見祭器内俎兩端皆圎其飾亦異唯柎足與距則似此房俎今雖具四代之俎請擇而用之三禮鼎俎圖卷第十三
