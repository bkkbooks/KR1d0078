body:
  text: 大圭冒圭鎭圭桓圭信圭躬圭穀璧蒲璧牙璋榖圭大璋駔琮音組大琮琬圭琰圭圭繅音藻璧繅大圭冒圭玉人職云大圭長三尺杼上終葵首天子服之注云王所搢大圭也或謂之珽玉藻曰天子搢珽方正於天下也杼殺也終葵椎也以齊人謂椎爲終葵故云終葵椎也爲椎於杼上明無所屈也此對諸侯荼前屈後直大夫前屈後屈故玉藻注云此珽亦笏也謂之珽者言珽然無所屈也相玉書曰珽玉六寸明自炤然則六寸之珽據上不殺者椎頭也玉體瑜不掩瑕瑕不掩瑜善惡露見是其忠實故云明自炤也炤與照同故君子於玉比德焉言其忠實也比他圭最長故得大圭之各以其搢於衣帶之間同於衣服故以服言之天子執冒圭四寸以朝諸侯注云名玉曰冒者言德能覆蓋天下也四寸者方以尊接卑以小爲貴也案尚書大傳云古者必有冒言下之不敢專達之義天子執冒以朝諸侯是見覆之注云君恩覆之臣乃敢進是其冒覆之事然則諸侯所受天子之圭璧者與諸侯爲瑞也瑞也者屬也諸侯朝於天子有過行者留其圭璧三年圭璧不復者少黜以爵六年圭璧不復者少黜以地九年圭璧不復者而盡黜其地此所謂諸侯之天子也義則見屬不義則不見屬也又孔注顧命曰言冒所以冒諸侯圭邪刻之以冒諸侯之圭以爲瑞信子男執璧蓋亦刻而覆驗之大傳以古者圭有冒亦是冒圭之法也此冒據朝覲諸侯時執之詩殷頌云受小球大球爲下國綴旒注小球尺二寸大球長三尺與下國結定結定其心如旌旗之旒彼據天子與諸侯盟㑹故云結定其心故執鎭圭不執冒也鎭圭桓圭鎭圭大宗伯以玉作六瑞以等􅀖國等謂齊也執鎭圭長尺二寸以鎭安天下蓋以四鎭山爲瑑飾故得鎭各典瑞曰王執鎭圭搢大圭以朝又曰珍圭以徴守以恤凶荒珍音鎭鎭圭以徴守者􅀂漢時徴郡守以竹使符也諸侯亦一國之鎭故以鎮圭徴之凶荒則民有逺志不安其土故王使使執鎭圭以往致王命以安之鎭圭大小之制當與琬圭琰圭相依孔義云凡圭廣三寸厚半寸剡上左右各寸半又注云尹拙議以鎭圭用五采組約中央以備失墜竇儀云詳周禮儀禮經䟽之義自天子公侯巳降及聘使所執圭璋皆有絢組約圭中央備其失墜新圖圭繅叙必以合正文則餘制皆顯矣大宗伯云公執桓圭注云公者二王之後及王之上公也玉人云命圭九寸謂之桓圭公守之其信圭躬圭皆言命圭而云守之者以其朝覲執焉居則守之也後鄭云􅀟植謂之桓賈釋云象宫室之有桓楹也以其宫室在上須桓楹乃安天子在上須諸侯乃安也蓋亦以桓楹爲瑑飾也信圭躬圭大宗伯云侯執信圭信音身注云信圭躬圭皆長七寸蓋皆象以人形爲瑑飾文有麤縟耳欲其慎行以保身大宗伯云伯執躬圭七寸孔義引江南儒者解之云直者爲信其文縟細曲者爲躬其文麤略義或然也榖璧蒲璧大宗伯云子執榖璧五寸諸侯自相見亦執之曲禮䟽云其璧則內有孔謂之好外有玉謂之肉故爾雅云肉倍好謂之璧肉好􅀂一謂之環此五等諸侯各執圭璧朝於王及自相朝所用也又云榖所以養人蓋瑑榖稼之形爲飾大宗伯云男執蒲璧五寸曲禮䟽引此注云蒲爲席所以安人蓋瑑蒲草之形爲飾牙璋玉人云榖圭七寸天子以聘女注云納徴加於束帛賈釋云自士巳上皆用玄纁束帛但天子加以榖圭諸侯加大璋亦七寸典瑞云榖圭以和難以聘女後鄭云穀圭亦王使之瑞節也榖善也其飾􅀂粟文然仇讎和之者􅀂春秋宣公及齊侯平莒及郯􅀳侯使瑕嘉平戎于王也其聘女則以納徴焉大璋七寸射四寸厚寸諸侯以聘女注云亦納徴加于束帛也上云大璋九寸此七寸得云大璋者以天子榖圭七寸以聘女諸侯不可過於天子而用九寸也謂用大璋之文以飾之故得大璋之名又案三璋之勺注云大璋加文飾中璋殺文飾邊璋半文飾則此璋雖七寸取於大璋加文飾之義謂遍於璋體瑑雲氣如大璋也駔音組琮大琮玉人曰駔琮五寸宗后以爲權又曰駔琮七寸鼻寸有半寸天子以爲權後鄭讀駔爲組謂以組繫琮因名組琮以玉飾豆即名玉豆是其􅀋也先鄭解組琮以爲稱錘以起量旣用爲權故有鼻又賈釋云量自是斗斛之名此權衡而爲量者對文量與權衡異散文權衡亦得量名以其量輕重故也天子組琮旣有鼻明后組琮亦有鼻也玉人云大琮十有二寸射四寸厚寸是謂内鎭宗后守之後鄭云如王鎭圭也射其外鉏牙賈釋曰言大琮者對上駔琮五寸者爲大也言十有二寸者并角徑之爲尺二寸也云射四寸者據角各二寸兩廂并四寸內鎭者對天子執鎭圭爲內謂􅀂內宰對太宰內司服對司服皆爲內之比也王不言外者男子陽居外是其常但婦人隂主內治故得稱內也云其外鉏牙者據八角鋒言之故云鉏牙也琬圭琰圭玉人云琬圭九寸而繅以象德後鄭云琬猶圎也玉使之瑞節也諸侯有德王命賜之使者執琬圭以致命焉故典瑞云琬圭以治德結好治德即玉人注云諸侯有德王命賜之也結好謂諸侯使大夫來聘旣而爲壇㑹之使大夫執以命事焉大行人曰時聘以結諸侯之好繅藉也先鄭云琬圭無鋒芒故治徳以結好玉人云琰圭九寸判規以除慝以易行賈釋注云判半也凡圭琰上寸半琰圭琰半以上至首而規又半巳下爲瑑飾諸侯有爲不義使者征之執以爲瑞節也經云除慝謂誅逆惡也易行謂去煩苛也然則煩苛非惡逆之事直謂政教煩多而苛虐也是知諸侯有惡行故王使人執之以爲瑞節易去之也又後鄭典瑞注云除惡行亦於諸侯使大夫來覜旣而使大夫執而命事於壇大行人職曰殷規以除邦國之慝又先鄭典瑞注云琰圭有鋒芒傷害征伐誅討之象故以使易惡行令爲善也則以此圭責讓諭告之詳先鄭鋒芒之言有違判規之所以藻玉木爲中幹用韋衣而畫之就成也者鎭圭尺二寸廣三寸即此木板亦長尺二寸廣三寸與玉同然後用韋衣之乃於韋上畫之一采爲一帀五采則五帀五帀爲一就就成也是五采一成者也又案聘禮記云絢組尺注云五采成文曰絢彼不問尊卑皆用五采組長尺爲以繫所以束玉使不墜落因以爲飾然絢組繫亦名繅藉者則曲禮云其藉者則禓聘禮曰上介屈繅以授賔是亦名組繫爲繅藉者也又曲禮䟽引鄭注覲礼云繅藉以韋衣木廣袤各如其玉之大小旣然則穀璧蒲璧其繅藉之形亦如之天子則以五采畫之公侯以三采子男則以二采其卿大夫亦二采故典瑞云玉繅藉五采五就公侯伯皆三采三就子男繅皆二采再就又云瑑圭璋璧琮二采二就是也熊氏云五采五就者采別二行爲就也三采三就者亦采別二行爲一就故三就也又下云二采一就者以臣下行聘不得與君同是以二采采別一行共爲一就凡言就者或兩行名爲一就即此上下文是也或一帀二行爲二就就即等也知者聘禮記云所以朝天子圭與繅皆九寸又云繅三采六等朱白蒼注云以三色爲再就謂三色色爲再就就亦等也三色即六等雜記亦云三采六等注云三采六等以朱白蒼畫爲再行行爲一等是一等爲一行行亦就也據單行言之也各有所據故其文有異旣三采爲六等則知天子五采巳下采别爲二等也此是周法其殷巳上則禮含文色之帛故鄭注虞書三帛髙陽氏之後用赤繒髙辛氏之後用黒繒其餘諸侯用白繒其餘謂堯之諸侯也旣以采色畫韋衣於板上前後垂之又有五采組繩以爲繫其組上以玄爲天下以絳爲地則繫於有事則垂爲飾故聘禮記云玄纁繫長尺絢組注云繫無事則以繫玉因爲飾用五采組上以玄爲天下以絳爲地是也三禮玉瑞圖卷第十
