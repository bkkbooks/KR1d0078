body:
  text: 喪大記云君飾棺黼翣二黻翣二畫翣二皆戴圭大夫士皆戴緌禮器曰天子八翣諸侯六翣大夫四翣又鄭注喪大記引漢禮翣以木爲筐廣三尺髙二尺四寸方兩角髙衣以白布畫者畫紫雲氣其餘各如其象柄長五尺車行使人持之而從以障車旣􅉎樹於壙中障柩天子八翣加龍翣二其戴皆如璧垂羽柳車名有四殯謂之輤車葬謂之柳車以其迫地而行則曰蜃車以其無輤則曰軫車案周禮縫人掌縫棺飾衣翣柳之材後鄭以必先􅅶衣其木乃以張飾也柳之言聚也謂諸飾所聚也又上注云孝子旣啓見棺猶見親之身旣戴飾而行遂以葬􅀂存時居于帷幕而加文繡其帷荒畫火龍等是加文繡也其生時帷幕則無此畫飾故云加也今柩入壙還以帷荒等加於柩上同葬之故云遂葬喪大記曰飾棺君龍帷三池振容黼荒火三列黻三列素錦禇加帷荒纁紐六齊五采五貝魚躍拂池君纁戴六纁披六此諸侯禮也披披義反漢禮器制度飾棺天子龍火黼黻皆五列又喪大記註云荒蒙也在旁曰帷在上曰荒然則荒柳車上覆謂鼈甲也天子其荒縁荒邊畫龍又畫雲氣次畫白黒之黼文又畫火形如半環以畫兩已相背之黻又於其間素錦白錦也禇即屋也於荒下又用白錦爲屋以葬車在道象宫室也禇外乃加帷荒帷者邊牆荒是上蓋禇覆竟而加帷荒於禇外也池者織竹爲之狀如小車笭衣以青布挂著於柳上荒之􅀲端象平生宫室承霤然天子四注屋四靣各有承􅋼今池亦四而象之也諸侯屋雖四注而降降一池闕於後故三池振容者振動也容容飾也謂以絞繒爲之長丈餘如幡其上畫青質五采之䄖翟又懸銅魚於池下車動爲容飾魚躍拂池也纁紐六者以上蓋與邊牆相離故又以纁帛爲紐連之相著傍各三凡共用六紐也齊者謂在荒之上當柳之中央形圜如車蓋上蕤矣蓋之中央故舉以爲􅀃漢時小車蓋上有蕤在以其當中如人之齊故謂之齊髙三尺徑二尺餘又案旣夕禮註云以三采繒爲之上朱中白下蒼著以絮則人君以五采繒爲之亦著以絮蒼下有黃玄二色則五等相次故云齊五采也五貝者又連貝爲五行交結齊上纁戴六纁披六者戴披皆用纁帛爲之戴值也於車輿兩廂各豎三􅃗軨子各當棺束用此纁戴貫棺束之皮紐出兩頭皆絆結其軨子各使相值堅固方用纁披於棺上横絡過各貫穿戴之連結棺束者乃于戴餘投出之於外使人持制之又棺横束有三毎束有二紐各屈皮爲之三束兩旁共有六紐故有六戴六披也持披者􅀂車登髙則前引以防軒車適下則後引以防翻車韻左則引右欹右則引左使車不傾覆也桉阮氏圖云柳車四輪一轅車長丈二尺廣四尺髙五尺周禮謂之蜃車故遂師云大喪使帥其屬以幄弈先及蜃車之役注云幄弈先者爲於葬􅉎之閒先張神座蜃車柩輅也柩輅戴柳四輪迫地而行有似於蜃因取名焉又鄭註旣夕禮記云其車之輿狀如􅇃中央有轅前出設前後輅上有四周下則前後有軸以輇爲輪許愼􅀃有輻曰輪無輻曰輇孔竇義云觀此註其輿與輴車同亦一轅爲之設前後輅者上經唯云前輅言前以對後明有輅車也此輅謂以木縛於柩車轅上屬引而挽之故名此轅縛爲輅也輿上有四春官􅃁人掌公墓之地辨其兆域而爲之圖先王之葬居中以昭穆爲左右賈釋註云公君也訓公爲君者言公則諸侯之通稱言君則上通天子此旣王之墓域故訓爲君也圖謂未有死者之時先畫其地之形􅀔預圖岀其丘壠之處旣爲之圖明藏掌之後湏葬者依圖置之也云先王造塋者但王之都有遷徙之法􅀂文王居豐武王居鎬平王居於洛邑所都而葬則是造塋者也􅀂文王在豐葬于畢子孫皆就而葬之即以文王居中文王次第當穆文王雖次第居穆以所遷居豐葬於畢地子孫旣昭穆夾處文王合居中央則以武王爲昭居左成王爲穆居右康王爲昭居左昭王爲穆居右穆王爲昭居左恭王爲穆居右巳下子孫皆然據昭穆夾處東西􅀂然兄死弟及俱爲君則以兄弟爲昭穆以其弟巳爲臣臣子一列則如父子故别昭穆也必知義或然者案文二年秋八月大事於太廟躋僖公謂以惠公當昭隱公爲穆桓公爲昭莊公爲穆閔公爲昭僖公爲穆今􅂛僖公於閔公上爲昭以閔爲穆故云逆祀知不以兄弟同居昭位􅂛僖於閔上爲逆祀者案定八年經云從祀先公傳曰始順祀先公而祈禱焉􅀂夲同倫以僖公􅂛於閔公之上則以後諸公昭穆不亂何得至定八年始云順祀乎明夲以僖閔昭穆别故於後皆亂也􅀂然兄弟相事兄爲君則昭穆昜可知但置塋以昭穆夾處與置廟同也又下文云以爵等爲丘封之度則天子亦是爵號也尊者丘髙而樹多卑者封下而樹少以别尊卑也鄭知王公曰丘諸臣曰封者比無正文案爾雅云土之髙者曰丘髙丘曰阜以丘是自然之物故屬之王公也聚土曰封人力所造故屬之諸臣􅀂然公中可兼五等鄭又引漢律列侯封髙四丈者以周禮丘封髙下樹木之數無文故以漢法況之案春秋緯云天子墳髙三仞樹以松諸侯半之樹以栢大夫八尺樹以藥草士四尺樹以槐庶人無墳樹以楊柳鄭不引者春秋緯或􅀃異代多與周禮相乖或者鄭所不見故不引也又王制云庶人不封不樹而春秋緯云庶人樹以楊柳者以庶人禮所不制故容楊柳也重校三禮喪器圖卷第十九析城鄭氏家塾重校三禮圖目録卷第
