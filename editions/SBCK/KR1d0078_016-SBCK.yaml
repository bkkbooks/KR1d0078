front:
  text: 析城鄭氏家塾重校三禮喪服圖下第十六
  hash: sha256:39d19288ade26a1afad1534ad53c47c7dd18e6cc026bb9316b1cf054c60625be
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1d0078_SBCK_016-1a}
body:
  text: 通議太夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注齊衰衣齊衰裳牡麻絰冠布纓削杖布帶上亦有􅆎經䟽屨大功布衰大功布裳大功牡麻絰中殤降在小功者絰无纓大功牡麻絰纓長殤與正服同緦衰衣縷加小功細而踈緦衰裳殤小功連衣裳婦人服特圖此者明斬衰至緦麻婦人衰裳皆然小功􅁑絰小功􅁑帶上亦有􅆎絰緦冠澡纓凡五服衰裳一斬四齊自齊衰以至緦麻衰並齊鄭曲礼註云齊謂下緝也然則君衰棄彼麁名麁名自顕功緦遺其齊號齊號亦明而四齊之衰並外削幅外殺縫也皆外展而方齊􅀂今慘衣先展訖乃行針功其裳並内削幅皆内展而始緝臣崇義又案喪服上下十有一章從斬至緦􅂛數有異其異者斬衰有二正義不同爲父以三􅂛爲正爲君以三􅂛半爲義其冠則同六􅂛其三年齊惟有正之四􅂛冠七􅂛繼母慈母慈母謂父命爲母子者雖是義服繼母以配父不敢殊慈母以重命不敢降故與母同是以略爲一節同正而巳父在爲母爲妻齊衰杖朞雜記云十一月而練十三月而祥十五月而禫是也然母則恩愛也妻則義合也雖父尊厭屈禫杖猶申故與三年同正而服齊衰五􅂛冠八􅂛又齊衰三月者義服也衰則六􅂛冠九􅂛曽祖父母計是正服但正服合服小功以尊其祖而服齊衰三月旣非本服故與義同服也又殤大功有義爲夫之昆弟之長殤義也其衰九􅂛冠十一􅂛餘皆降也其衰七􅂛冠十􅂛成人大功章有降有正有義姑姊妹出適之等是降也衰冠同殤降婦人爲夫族爲義也衰弱同殤義餘皆正也其衰八􅂛冠十􅂛又緦衰唯有義服其衰四􅂛半冠七􅂛諸侯之大夫爲天子故同義服也殤小功有降有義婦人爲夫之族􅀋義也衰冠同十二􅂛餘皆降也衰冠同十􅂛成人小功有降衰冠如殤降有正衰冠同十一􅂛有義衰冠同殤義緦麻之衰冠降正義也皆同十五􅂛抽去其半而巳齊衰衣齊衰裳䟽衰裳齊者䟽猶麁也齊者緝也此齊衰三年章以輕於斬故次斬後上斬衰章中爲君三􅂛半曰麁衰以三􅂛正服斬不得麁名三􅂛半成布三􅂛微細則得麁稱晏子麁衰爲在三􅂛斬内以斬爲正故設義服之此䟽衰四􅂛始見其麁􅀂然爲父哀極直見深痛之斬不設人功之麁至於義服斬衰齊衰之等乃見麁稱其大功小功更見人功之顕緦麻極輕又表細宻之事皆爲衰有􅀷淺故作文不同者也則斬衰先言斬者一則見先斬其布乃作衰裳二則見爲父極哀先表斬之􅀷重此齊衰稍輕直見造衣之法衰裳旣就乃始緝之是以斬衰斬在上䟽衰齊在下布帶者亦象革帶以七􅂛布爲之此即下章云帶縁各視其冠帶縁冠皆七􅂛布如􅀷衣之縁此言布纓布帶者對斬衰纓帶皆用繩故也䟽屨者麁屨也讀如䟽不熟之䟽䟽草也䟽取用草之義是故斬衰重而言菅屨故見草體舉其惡貌也齊衰輕而言䟽屨故舉草之緫稱也自此巳下各舉􅏔降之冝故不杖章言麻屨齊衰三月與大功同繩屨小功緦麻輕又設其屨號傳曰䟽屨者藨蒯之菲也藨平表反蒯苦恠反皆草名叙父卒爲母三年父在爲母爲妻爲出母朞父卒爲繼母嫁者亦朞曽爲母子貴終其恩也皆服䟽衰裳齊壯麻絰冠布纓削杖布帶䟽屨岀妻之子爲父後者爲岀母无服然母出爲外祖父母无服祖父母共父母叔父母兄弟之子適孫重適爲人後者爲父母嫁女爲父母降服昆弟之爲父後者繼父同居者姑姊妹女子子適人而無主者爲无此大功中殤有之故禮記云九月七月之喪三時者是也長殤皆九月絰有纓者爲其情重故也七月無纓者情殺故也鄭知以一條繩爲之者見斬衰冠繩纓通屈一條繩屬之於武垂下爲纓故知此絰之纓亦通屈一條繩屬之於絰垂下爲纓大功長殤及正大功絰皆有纓小功巳下絰皆無纓故布衰裳牡麻絰纓布帶三月受以小功衰即􅁑九月者則成非正大功之服也受猶承也正大功章輕於殤大功故次在殤章之下傳曰大功布九􅂛小功布十􅂛此章有降有正有義降則衰七􅂛冠十􅂛正則衰八􅂛冠亦十􅂛義則衰九􅂛冠十一􅂛又十􅂛者降小功也十一􅂛者正小功也傳以受服不言降大功及正大功直言義大功之受者以冠爲受以義大功冠十一􅂛受小功之正者也註云此受之下也者謂越大功降正二服直取義大功是下也據受之下發傳者明受盡於此義大功也以其大功至葬唯有變麻服舊因故衰無受服之法故傳據義大功而言也叙服上者以大功巳上絰帶有夲小功巳下斷夲此殤小功中有下殤小功帶不絶本與大功同故進帶於絰上到文以見重也又上文多直見一絰包二帶此别言帶者亦故見帶不絶本與成人小功絰不同兩見之也叙服叔父適孫昆弟大夫庶子爲適昆弟姑姊妹女子子巳上八人夲服期今爲下殤降在小功者爲人後者爲其昆弟從父昆弟此二者夲服大功今長殤降在小功者傳問者曰中殤何以不見荅者曰大功之殤中從上小功之殤中從下問者據從父昆弟之下殤在緦麻者也以其緦麻章見從父昆弟之下殤此章見從父昆弟之長殤唯中殤不見故致問也爲夫之叔父之長殤不見中殤者中從下服緦也昆弟之子女子子姪男女也夲朞今在下殤夫之昆弟之子女子子亦姪男女也本朞今在下殤庶孫男女之在長殤皆小功無變五服上曰衰下曰裳男子衰裳殊婦人衰裳不殊衰亦如男子外削幅綴衰於衣而衣無帶其裳則如􅀷衣而裳無衽謂皆縫合自上巳來唯見男子衰裳婦人衣衰不見故特圖之正小功布衰衣裳牡麻即􅁑五月者註云即就也小功輕三月變麻因故衰以就􅁑絰帶而五月也此小功成人章輕故次在殤小功下此章有三等正降義其衰裳之制澡麻帶絰唯斷夲與前章爲異此成人文縟故麻從􅁑但以日月爲足故不變衰不列冠屨者小大功章巳畧至此小功輕故亦不言舊􅀃云小功巳下吉屨無絇案周禮屨人職屨舃皆有絇繶純純者於屨口有縁繶者牙底相接處縫中有絛絇者屨􅈹頭有飾爲行戒吉時有行戒故有絇喪中無行戒故無絇以小功輕故從吉屨爲其太飾故去絇叙服從父祖父母從祖祖父母報註云祖父之昆弟之親從祖祖父母是曽祖之子故知是祖父之昆弟之親也從祖父母是從祖祖父母之子是父之從父昆弟之親故鄭并言祖父之昆弟之親報者恩輕欲見兩相爲服故云報也從祖昆弟註云父之從昆弟之子此是從祖父母之子故鄭言父之從昆弟之子是巳之􅄪從昆弟此上三者爲三小功從父姊妹註云父之昆弟之女從父姊妹在家大功岀適小功不言岀適反在室者姊妹旣逆降其宗族亦逆降報之故不辨在家及出適也女孫適人者也在室亦大功爲人後者爲姊妹之適人者姑恩輕故降也外祖父母從母丈夫婦人報丈夫婦人皆成人之號此謂從母所生之男女也外親之服皆緦也外祖父母以尊加從母以名加而皆小功焉外祖夲非骨􅁏而情䟽故聖人制禮無過緦也以言外祖祖是尊名以母之所生情重故尊加至小功不服緦也從母是母姊妹與母一體從於巳母而有母名故以名加至小功亦不服緦夫之姑姊妺娣姒婦報夫之姑姊妹在室及嫁皆小功者因恩輕略從嫁也傳曰娣姒婦者弟長也何以小功也以爲相與居室中則生小功之親焉娣姒婦者兄弟之妻相名也弟長也者破娣女弟也姒長也以娣姒二字皆以女為形弟姒為声則據二婦立名謂年小者為娣年大者為姒假令弟妻年大則稱之日姒兄妻年小稱之日娣案左傳穆姜昃宣公夫人大婦也声伯之母昃宣公弟叔􅆄妻小婦也声伯之母不聘穆姜曰吾不以妾為姒是據二婦年大小爲娣姒不據夫年為大小也君子子爲庶母慈巳者曰君子子者貴人之子也註云君子子者大夫及公子之適妻子也禮之通例云君子與貴人皆據大夫已上而言也公子尊卑比大夫故鄭據而言也此庶母慈巳者父之諸妾也故内則云異為孺子室於宫中擇於諸母與可者必求其寛􅁉慈惠温良㳟敬慎而寡言者使為子師教示以善道其次為慈母知其􅄝欲其次為保母安其居処皆居子室有此三母又曰大夫之子有食母此所謂庶母慈巳者也以其慈於巳故於緦麻上加至小功國君子為慈母無服士又不得稱君子為慈母服小功者唯公子及大夫之適子二人矣此謂父在者則服之知者以大夫公子不繼丗身死則無餘尊之厭一同凡庶三母慈巳之義故知父在則服之父没則服緦麻又鄭云以慈巳加則君子子亦以士礼為庶母緦也􅀂然昃其本為庶母緦麻也析城鄭氏家塾重校三禮襲斂圖卷第十七通議大夫國子司業兼太常博士柱國賜紫金魚袋臣
