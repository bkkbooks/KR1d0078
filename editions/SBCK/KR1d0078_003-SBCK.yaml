body:
  text: 通議大夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注童子服將冠者緇布冠三制太古冠新増緇布冠新増頍項上音丘委反青組纓纚皮弁爵弁笄紘篋簞匴委貌如進賢冠委貌如皮弁者委貌張鎰圖制委貌梁正法母追音牟堆章甫周弁通天冠逺遊冠髙山冠長冠一名齊冠法冠建華冠武弁大冠術氏冠方山冠巧士冠卻非冠樊噲冠郤敵冠章甫冠别一法四冕叔孫通稽周法三冠皆進賢冠梁正修阮鄭等圖以童子之服繫冕弁之末不連緇布緇布冠繢緌其頍項青組纓則與士同其士以青組纓結於頥下無緌自士巳上冠訖則弊去之不復著也然庶人猶著之故詩云彼都人士臺笠緇撮謂彼都邑人有士行者以緇布爲冠撮持其髪檀弓曰古者冠縮縫今也衡縫註云縮從也衡讀爲橫孔䟽云縮直也古謂殷巳上質吉凶冠皆直縫直逢者辟積少故二前後直縫之其冠廣三寸落項前後兩頭皆在武下向外岀反屈之縫於武辟積三皆厭伏今即周也周尚文多辟積不復一一直縫但多作􅙭音輙并橫縫之故周吉冠多辟􅙭而横縫又以冠兩頭皆在武上向内反屈縫之旣吉凶相變其喪冠質猶踈辟􅙭而右直縫之以兩頭皆在武下向外反屈縫於武故得厭伏之各其吉冠則左辟􅙭而横縫之詳此文義法式顕然士冠禮註云皮弁以白鹿皮爲之象太古又舊圖云以鹿皮淺毛黃白者爲之髙尺二寸周禮王及諸侯􅀌卿大夫之皮弁㑹上有五采三采二采玉琪象邸唯不言士之皮弁有此等之飾凡於圖中重見者以其夲㫖不同也此解士冠禮三加次加皮弁是以重出他皆􅀋此爵弁鄭云冕之次也其色赤而微黒如爵頭然用三十􅂛布爲之亦長尺六寸廣八寸前圎後方無旒而前後平笄紘于頍共爲一物緇纚長六尺二物也皮弁笄三物也爵弁笄四物也其緇組紘纁邊皮弁爵弁各有一則爲二物通四爲六物也士冠禮云櫛實于簞註云簞笥也又曲禮註云圓曰簞方曰笥與簞方圓有異此云簞笥也共爲一物者鄭舉其􅀋也士冠禮云爵弁皮弁緇布冠各一執以待於西坫􅀯註云匴器名今之冠箱也舊圖畫而圓梁正改而方舊匴在爵弁之下今依經次於簞後後代轉以巧意改新而昜其名耳其制相比皆以􅃮布爲殻以緇縫其上前廣四寸髙五寸後廣四寸髙三寸章甫委大章其身也母追制與周委貌同殷冠委大臨前夏冠委前小損臣崇義按郊特牲曰委貌周道也章甫殷道也母追夏后氏之道也孔䟽云三代恒服行道之冠俱用緇布其形自別旣言俱用緇布爲之則緇布冠是委貌等矣蓋布有麄縟各爲一名又漢志云長七寸髙四寸制如覆杯前髙廣後卑鋭所謂夏之母追殷之章甫者也母追有覆杯之狀但古法難識依文觀象備圖於右庶合遺制他皆􅀋此按王制䟽與舊圖云周曰弁殷曰哻夏曰収三冠之制相似而微異俱以三十􅂛布􅃮爲之皆廣八寸長尺六寸前圓後方无旒周赤而微黒如爵頭然前小後大冠刋字本與御名同不欲斥之故改焉又云鷸水鳥天將雨則鳴古人以知天時乃爲冠象此鳥形使掌天文者冠之故逸禮記曰知天文者冠鷸冠此其證也鷸音聿亦術蔡邕獨断謂爲術氏冠亦因鷸音轉爲術耳非道術之謂也今謂於術士冠下添云亦謂之術士冠工部尚書竇儀議曰臣儀今詳術士冠已依舊圖改爲術氏冠方山冠後漢志云制似進賢前髙七寸後髙三寸纓長八寸似進賢冠五采縠爲之祠宗廟天子八佾四時五行樂人服之冠衣各如其行方之色又景帝紀云髙廟奏武德文始五行之舞禮樂志曰武德髙帝所作也文始舜舞也五行周舞也武德者舞人執干戚舞也文始者舞人執羽籥舞也五行舞者舞人冠冕衣服法五小吏冠一梁天子公卿特進諸侯祀天地明堂皆冠平冕天子十二旒三公九旒卿大夫諸侯七旒其纓各如綬色玄衣纁裳董巴輿服志曰顯宗􅀄服冕旒衣裳以祀天地上玄下纁乗輿備文日月星辰十二章三公諸侯用山龍巳下九章卿巳下用華蟲七章皆五采乗輿刺繡公卿巳下皆織成陳留襄邑獻之徐廣車服註云漢明帝按古禮備其服章天子郊廟衣皁上絳下前三幅後四幅衣畫而裳繡析城鄭氏家塾重校三禮宫室圖卷第四通議大夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注
