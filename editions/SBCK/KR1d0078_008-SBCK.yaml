body:
  text: 乏并夾彤弓玈弓彤矢玈矢楅韋當鹿中兕中皮樹中閭中虎中筭扑射物朱極三遂次扆几筵􅀛燋音雀楚焞焞即焌俱音鐏蓍畫爻木卦版佩玉韍大帶笏舄郷射禮司馬命弟子設楅賈釋注云楅猶幅也所以揚笴齊矢也以楅爲幅者義取若布帛有邊幅整齊之意故云承笴齊矢也下記云楅長如笴博三寸厚寸有半龍首其中蛇交楅髹注云兩端爲龍首中央爲蛇身相交龍蛇君子之􅀋交者象君子取矢於楅上髹赤黒􅃮賈䟽引鄭注易龍戰于野云聖人喻龍君子喻蛇是龍蛇揔爲君子之􅀋也舊圗云楅長三尺有足置韋當於背舊圗云韋當長二尺廣一尺置楅之背上以籍箭郷射記注云直心背之衣曰當以丹韋爲之司馬左右撫矢而乗之分委於當賈釋云直者通身之言其楅兩頭爲龍首於背通身著當言直者當心中央也知丹韋爲之者周尚赤故也朱極三萑圗云决亦以朱韋爲之案大射禮云設决朱極三注云猶闓音開以象骨爲之著右巨指所以鉤弦而闓之極猶放也所以韜指利放弦也以朱韋爲之三者食指將指無名指􅀂無决極放弦契於此指多則痛小指短不用極遂舊圗云遂臂捍以朱韋爲之按郷射禮注云遂射韝也以韋爲之所以遂弦也其非射時則謂之拾蔽歛也所以蔽膚歛衣也又大射注云遂著左臂裏以遂弦也次扆大射禮注云次若今更衣處即所設者帷幄也故幕人掌帷幕幄帟以供掌次􅀂王朝日祀五帝則掌次張大次小次凡􅀕祀張旅幕張尸次射則張耦次後鄭以耦次在洗東大次大幄也􅀄徃所止居也小次小幄也旣接􅀕退俟之處今又射有三位􅀂王射設耦次亦冝有大次小次也又幕人聀注云在傍曰帷在上曰幕􅂉在地展陳于上帷幕皆以布爲之四合象宫室曰幄即王所居之帳也帟王在幕若幄中坐上承塵也幄帟皆以繒爲之賈釋云帷在下幕在上共爲室幄帟又在帷幕室内設之也司几筵云凡大朝覲大饗射凡封􅀦命諸侯王位設黼依注云黼謂之斧其繡白黒采以絳帛爲質依音扆其制如屏風賈釋云諸文多作斧字若據米色而言即繢人聀白與黒謂之黼􅀂據繡於物上即爲金斧之文近刃白近銎黒則曰斧銎音曲恭切取金斧斷割之義屏風之名岀於漢丗故引爲况舊圗云從廣八尺畫斧無柄設而不用之義璜之外別有琚瑀其琚瑀置當於縣衝牙組之中央又以二組穿於琚瑀之内角斜係於衡之兩頭於組末係於璜蠙珠以納其間蠙蜯也珠出於蜯故言蠙珠納於其間者組繩有五皆穿蠙珠於其間故云以納其間舊􅀃云佩上有􅀟衝長五寸􅀶一寸下有􅀟璜徑二寸衝牙長三寸韍大帶韍天子以下皆用朱韋爲之明堂位曰有虞氏服韍夏后氏山殷火周龍章注云韍冕服之韠也舜始作之以尊􅀕服禹湯至周増以畫文後王弥飾也山取其仁可仰也火取其明也龍取其變化也天子備焉諸侯火而下卿大夫山士韎韋而巳其制下廣二尺上廣一尺長三尺其頸五寸肩革帶愽二寸天子四角直公侯殺四角使之方大夫前方後挫角士前后正韠制同隨裳色無山火龍之飾凡韠韍以下爲前以上爲后玉藻云天子素帶朱裏朱緑終辟大夫巳上用素皆廣四寸諸侯不朱裏合素爲之亦朱緑終辟大夫飾以玄華辟紐及垂終之士練帶廣二寸繂下辟并紐約用組廣三寸長齊于帶其紳韠紐俱三尺笏屨人掌王及后之服屨爲赤舄黒舄赤繶黄繶青句注云􅃨下曰舄單下曰屨舄屨有絇有繶有純者飾也賈釋云下謂厎也􅃨下重厎也重厎者名舄單厎者名屨繶者是牙厎相接之縫綴絛於其中后用黄繶句讀曰絇絇之言拘狀如刀衣􅈹拘著舄屦之頭取自拘持爲行戒使常低目不妄顧視也純謂以絛爲口縁屨舄各象裳色王舄有三冕服則赤舄韋弁皮弁則白舄冠弁之服則黒舄王后亦三舄配禕衣青舄配䄖翟赤舄配闕翟鞠衣巳下皆屨三禮弓矢圖卷第八
