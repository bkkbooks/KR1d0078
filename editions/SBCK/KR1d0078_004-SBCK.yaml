body:
  text: 明堂宫􅆍制王城九服律吕圎丘樂方丘樂禘祫樂大宗子小宗子四等附庸井田溝洫明堂此秦法故重出明堂殷三尺以相叄之數而禹卑宫室則夏堂髙一尺又上註云堂上爲五室象五行以宗廟制如明堂明堂中有五天帝五人神之坐皆法五行以五行先起於東方故東北之室爲木其實兼水矣東􅀯火室兼木西􅀯金室兼火西北水室兼金矣以中央太室有四堂四角之室亦皆有堂乃知義然也故賈釋太史閏月下義云明堂路􅃦及宗廟皆有五室十二堂門是也旣四角之堂皆於太室外接四角爲之則五室􅀯北止有二筵東西各二筵有六尺乃得其度􅀂聽朔皆於時之堂不於木火等室􅀂閏月則闔門左扉立其中而聽朔焉故鄭云於文王在門謂之閏法夏制凢階􅀯靣三二靣各二宫􅃦制天子五門曰臯曰庫曰雉曰應曰路舊夲只圖此五門曰王宫五門而無名目今特添釋之居之一在東􅀯王夏居之一在西北王冬居之一在中央王季夏居之凢后妃巳下更與次序而上御於王之五􅃦又案内命婦註云三夫人巳下分居后之六宫其實三夫人如三公從容論婦禮不分居除三夫人外巳下分居九嬪毎宫各一人餘有三人在二十七丗婦毎宫各三人餘有九人在八十一御女每宫各九人餘有二十七人在從后唯其所燕息焉以后不專居一宫湏徃即停故知從后所在而燕息也其次又上十五日而徧者此謂九嬪巳下分居六宫皆三分之一分從后兩分居宫五日一畨假令月一日分從后至月五日從后者日滿則右邊三宫之中舊居宫者來替此從后日滿者却入在右邊三宫從后者至十日又滿則左邊三宫舊居宫者來替從后日滿者亦却居左邊三宫又至十五匠人營國方九里旁三門國中九經九緯經塗九䡄左祖右社靣朝後市賈釋註云營謂丈尺其大小天子十二門通十二子謂以甲乙丙丁等十日爲母子丑寅卯等十二辰爲子國中地中也城内經緯之塗皆容方九䡄䡄謂轍廣也乗車六尺六寸傍加七寸凡八尺九䡄七十二尺則此塗十二歩矣王城靣有三門有三塗男子由右女子由左車從中央􅀯北之道爲經東西之道爲緯王宫當中經九服周之王畿與九服共方萬里故此九服除王畿之外每服而言又方以别之畿者限也樹之封疆而限千里故曰王畿其外方五百里曰侯服侯者候也爲王斥候服者服事於王又其外方五百里曰甸服甸田也爲王治田出稅又其外方五百里曰男服男者任也爲王任其職理又其外方五百里曰采服采事也爲王事民以供其上又其外方五百里曰蠻服蠻者縻也以政敎縻之又蠻服大司馬謂之要服要者以政要束爲義於四要之内方七千里故王制註云周公復唐虞舊域分其五服爲九其要服之内七千里又其外方五百里曰夷服謂此一服在夷狄之中故以夷言之又其外方五百里曰曰鎭服此一服入夷狄又􅀷故湏鎭守之又其外方五百里曰藩服以其最在外爲藩籬也者以隂故退位在未故曰乾貞於十一月子坤貞於六六月未也林鐘又上生太蔟之九二太蔟又下生􅀯吕之六二􅀯吕又上生姑洗之九三姑洗又下生應鍾之六三應鍾又上生㽔賔之九四㽔賔又上生大吕之六四太吕又下生夷則之九五夷則又上生夾鍾之六五夾鍾又下生無射之上九無射又上生中吕之上六同位者象夫婦異位者象子母所謂律娶妻而吕生子也同位謂􅀂黃鍾之初九下生林鍾之初六俱是初之第一夫婦一體是象夫婦也異位謂􅀂林鍾上生太蔟之九二二於第一爲異位是象母子也但律􅀄生者爲夫婦吕所生者爲母子十二律吕律所生者常同位吕所生者常異之故云律娶妻而吕生子也夾鍾在卯位生於房心之氣爲大辰天出日之處爲明堂故以夾鍾爲天之宫又註云以此三者用聲􅀋求之謂以天地人三宫各用聲􅀋求之􅀂十二律相生終於六十即以黄鍾爲首終於􅀯吕今此二者爲宫各於夲宫上相生爲角徴羽麤細湏品或先生後用後生先用故云聲􅀋求之也註又云天宫夾鍾隂聲其相生從陽數者其夾鍾與無射相配合之物夾鍾是二隂也無射是律陽也天是陽故宫後歷八相生還從陽數是從無射數也故下云其陽無射無射上生中吕中吕與地宫同位而不用地宫林鍾也林鍾自與㽔賔合但中吕與林鍾同在􅀯方故云同位以天尊地卑故嫌同位而不用也中吕上生黄鍾黄鍾爲宫也黄鍾下生林鍾也林鍾地宫又嫌不同林鍾上生太蔟太蔟爲徴也太蔟下生􅀯凡樂黄鍾爲宫大吕爲角太蔟爲徴應鍾爲羽路鼓路鼗隂竹之管龍門之琴瑟九德之歌大㲈音韶之舞於宗廟之中奏之􅀂樂九變則人􅀑可得而禮矣註云人􅀑則主后稷先奏是樂以致其神而以圭瓉祼神也此謂秋祫知者但殷人祫以三時周禮唯用孟秋之月爲之黄鍾生於虚危之氣虚危爲宗廟賈釋云黄鍾在子子上有虚危是生於虚危之氣也又星經云虚主宗廟是虚危爲宗廟也故黄鍾爲人宫黄鍾下生林鍾林鍾犯地宫避之不取也林鍾上生太蔟太蔟爲徴先生後用也太蔟下生􅀯吕􅀯吕與天宫之陽同位又避之亦不取也􅀯吕上生姑姺姑姺􅀯吕之合又避之沽姺下生應鍾應鍾爲羽應鍾上生㽔賔㽔賔地宫之陽以林鍾是地宫與㽔賔相配合故又避之㽔賔上生大吕大吕爲角六加九同則爲二十五同與公等故知侯附庸九同也伯附庸七同者伯地三百里三三而九加七同則爲十六與侯等子夲地四同有功進受伯地五同與伯等男有功進受子地男夲一同加三同與子等進則取閑田爲附庸退則歸之閑田故云進則取焉退則歸焉魯雖侯爵以其是王子母弟得如上公受五百里之地與上公等又成王以周公之勲賜魯以侯伯子男四等附庸下註附庸二十四是此四等附庸之數也小司徒佐大司徒當都鄙三等之采地而爲井田故經云九夫爲井四井爲邑四邑爲丘四丘爲甸四甸爲縣四縣爲都以任役萬民使營地事而貢軍賦出車役又采地之中毎一井田之岀一夫之稅以入於官但此都鄙是畿内之地小司徒並營其境界故孟子曰夫仁政必自經界始經界不正井地不均榖禄不平是故􅁀君汙吏必慢其經界經界旣正分田制禄可坐而定也此圖一甸之田則縣都之法亦可見矣遂人職凡治野夫間有遂遂上有徑十夫有溝溝上有畛百夫有洫洫上有塗千夫有澮澮上有道萬夫有川川上有路以逹于畿註云十夫二鄰之田百夫一鄼之田千夫二鄙之田萬夫四縣之田遂溝洫澮皆所以通水於川也遂廣深各二尺溝洫澮廣二尋深二仞徑畛塗道路皆所以通車徒於國都也徑容牛馬畛容大車塗容乗車一軓道容二軓路容三軓都之野塗與環塗同可也匠人環塗七軓萬夫者方三十三里少半里九而方一同以南畮圖之則遂從溝横洫從澮橫九澮而川周其外焉賈釋遂從者南北細分隔爲一夫十夫則於首爲横溝十溝即百夫於東畔爲南北之洫十洫則於􅀯畔爲橫澮九澮則於四畔爲大川此川亦人造雖無丈尺之數蓋亦傍澮耳此川與匠人澮水所注州者異彼百里之間一川謂大川也案梁正計九而方一同積是一同則九萬之夫田也圖施於六遂則六郷之制亦明矣此秦制改周法爲九室三十六户七十二牖十二階今以月令是秦法故存其制圖之於後重校三禮宫室圖卷第四
