front:
  text: 定三禮冕服圗卷第一
  hash: sha256:13d1e8da62a43fca0b66290792d2b20878f64b639d11a5534d90441e5d41ef9b
body:
  text: 大裘冕衮冕與后禕衣畫糹紉約明巳下皆有鷩冕毳冕絺冕絺玄冕韋弁服皮弁服冠弁服三公毳冕上公衮冕侯伯鷩冕子男毳冕卿大夫玄冕爵弁皮弁諸侯朝服周天子吉服有九冕服六弁服三凡九也故司服云王祀昊天上則服大裘而冕祀五帝亦如之享先王則衮冕享先公饗射則鷩冕祀四望山川則毳冕祭社禝五祀則絺冕祭群小祀則玄冕兵事韋弁服眡朝皮弁服凡甸冠弁服又孔䟽引弁師掌王之五冕皆玄冕朱裏止言􅀇朱而已不言所用之物論語云麻冕禮也盖以布衣版上􅀇下纁􅂑天地之色其長短廣狹則經傳無文漢禮噐制度云冕制皆長尺六寸廣八寸天子巳下皆同董巴輿服志云廣七寸長尺二寸皇氏沈氏以爲諸侯之冕應劭漢官儀云廣七寸長八寸皇氏沈氏以爲卿大夫之冕若依此言豈董巴專記諸侯應劭專記卿大夫此盖隨代變易大小不同今依漢禮制度爲定謂之冕冕者俛也後髙前下有俯俛之形故因名焉盖以在位者失於驕矜欲令位彌髙而志彌下故制此冕令貴者下賤者也其服舊􅀃云天子九章據大章而言其章别分小章章依命數則皆十二爲節上公亦九章無􅂛龍有降龍其小章章別皆九而巳鷩冕毳冕己下皆然必知有小章者若無小章絺冕三章則􅀌有四命六命卿大夫玄冕一章卿大夫中則有三命二命一命天子之卿六命大夫四命明大章中有小章乃可得依命數又司馬彪漢書輿服志云明帝永平二年􅀄詔有司采周官禮記尚書之文制冕皆前圎後方朱裏􅀇上前垂四寸後三寸王用白玉珠十二旒三公諸侯青玉七旒卿大夫黒玉五旒皆有前無後此亦漢法耳今案三禮經注孔賈䟽義并諸家禮圗逐冕下别各明其制度則古今㳂革事可知矣也火􅂑其明也宗彛古宗廟彛尊名以虎蜼畫於宗彛因號虎蜼爲宗􅃔故并畫虎蜼爲一章虎􅂑其嚴猛蜼􅂑其智遇雨以尾塞􅈹是其智也冕制廣八寸長尺六寸以三十升布染之上以􅀇覆冕爲延下以朱衣之又以紐綴於冕兩傍垂之與武傍孔相當以笄貫之使得牢固义以紘一端先屬扵左邉笄上以頭遶於頥下向上於右邉笄上遶之衮冕十二旒以五采絲爲之繩貫五采玉每旒各十二玉垂於冕前後共二十四旒計用玉二百八十八五采繩十二就就成也每就間盖一寸五冕服皆玄衣纁裳朱韍素帶朱裏又以朱緑終禆太子詹事尹拙議云衮冕已下君臣合畫充耳天子黊纊諸臣青纊工部尚書竇儀議云臣儀案周禮弁師掌王之五冕皆玄冕朱裏延紐五采繅十有二就皆五采王十有二玉笄朱紘諸侯之繅斿九就瑉玉三采其餘如王之事繅折斿皆就玉瑱玉笄注使當為公字之誤也其餘謂延紐皆玄覆朱裏與王同也玉瑱塞耳者䟽云王不言玉瑱於此言之者王與諸侯互見為義是以王言玄冕朱裏延紐及朱紘明諸侯亦有之諸公言玉瑱明王亦有之是其互有也詳此經注䟽之文則是本有充耳今請令君臣衮冕已下司服云公之服自衮冕而下注云自公衮冕至卿大夫之􅀇冕皆朝聘天子及􅂇祭之服諸侯非二王後其餘皆􅀇冕而祭又弁師云諸公之繅斿九就瑉玉五采其餘如王之事繅斿皆就玉瑱玉笄注云三采朱白蒼其餘延紐皆􅀇覆朱裏與王同繅斿就皆三采每繅九成則九斿每斿九玉計用玉百六十二其五冕之版亦廣八寸長尺六寸前圎後方入覲禮注云公衮有降龍無升龍又明堂位注韍畫山火而無龍祭義云諸侯冕而青紘玉繅云笏諸侯以象又曰荼前屈後直張鎰圗云其服􅀇衣纁裳朱韍素帶朱緑終辟佩山􅀇玉朱組綬赤舄黒絇繶純其方伯及王之子弟出封侯伯皆得服之朝王􅂇祭焉司服云士之服自皮弁而下又弁師注云韋弁皮弁之㑹無結飾士冠禮云皮弁服素積緇帶素韠與君視朔之服同玉藻云佩瓀玟玉而緼組綬又云士笏竹夲象可也若上公韋弁皮弁􅋒飾九玉侯伯七玉子男五玉皆三采􅀌四命􅋒飾四三命之卿􅋒飾三􅂯命之大夫􅋒飾二皆二采諸侯皮弁白布衣素裳白韠素帶朱綠終禆佩山􅀇玉白舄青絇繶純卿大夫則白屨諸侯朝王及自相朝視朔則服之王朝之臣亦服朝王其韋弁服既爲軍容君臣同服制度巳見於上更不别圗裳下士雜裳前􅀇後黄但􅀇是天色黃是地色天尊地卑故上士􅀇裳中士黄裳下士雜裳還用玄黄者以前陽後隂故知前􅀇後黄也新定三禮冕服圗卷第一
