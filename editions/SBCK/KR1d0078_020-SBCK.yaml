  text: 二十
  hash: sha256:e5ec573b3977ce9d55cb8e5fde4b730d653f8ab5b5d8dd377a7d97bbadfb0be3
body:
  text: 通議太夫國子司業兼太常􅀶士柱國賜紫金魚袋臣聶崇義集注舊圖十卷形制闕漏文字省略名數法式上下差違旣無所從難以取象蓋乆傳俗不知所自也臣崇義先於顯德三年冬奉命差定郊廟器玉因敢刪改其或名數雖殊制度不别則存其名而略其制者瑚簋車輅之􅀋是也其名義多而舊圖略振其綱而目不舉者則就而増之射侯喪服之􅀋是也有其名而無其制者亦略而不圖仍别序目録共爲二十卷凡所集注皆周公正經仲尼所定康成所注傍依䟽義事有未達則引漢法以況之或圖有未周則於目録内詳證以􅀘其闕又案詳近禮周知􅆓革至大宋建隆二年四月辛丑第叙旣訖冠冕衣服見吉凶之象焉宫室車旗見古今之制焉弓矢射侯見尊卑之别焉鐘鼔管磬見法度之均焉祭器祭玉見大小之數焉圭璧繅藉見君臣之序焉喪葬飾具見上下之紀焉舉而行之昜於詳覽冕服第一大裘冕無旒冕廣八寸長一尺六寸上玄下纁以綖覆飾之其板側則不用金飾有紐玉簪導以組爲纓色如綬衣服令云大裘以黒羔皮爲之玄領褾縁褾音必小反䄂端也玉藻云羔裘豹飾緇衣以禓之詩唐風云羔裘豹祛此云領標及縁皆以玄朱裳白紗中單皂領青褾􅙦􅅂􅙦士眷切重裙也革帶玉鈎䚢日列切觖也大帶天子素帶朱裏又上以朱下以緑終純之上外也朱正色故在外畔緑閒色故在下畔諸侯大帶以素合之不朱裏亦朱緑終純與天子同大夫亦合素爲帶純其垂外以玄内以華即黃也逺人爲外近人爲内玄天色故在外黃地色故在内士巳下亦素練爲帶皆單而不合堆繂下外内皆用緇紕之故士冠禮謂之緇帶據所純而言也紐約並用組紐謂帶之交結之處以屬其紐約者謂以物穿紐約結其帶天子巳下紐約之物並用組爲之也大帶闊四寸紐約之組闊三寸長齊於帶言約紐餘長三尺與帶垂齊者黻黻蔽􅂰也凡黻皆隨裳色他服謂之􅔖祭服謂之黻案昜困卦九二朱黻方來利用享祀是祭服謂黻也案毛詩傳云天子組朱諸侯黃朱色淺大夫亦赤黻色又淺矣士緼黻緼赤黃之閒色士冠禮爵弁韎韐即緼黻也鹿盧玉具剱火珠縹首縹音漂劒飾白玉􅀟珮玄組􅀟大綬六綵玄黃赤白縹緑純玄質漢志乗輿黃赤綬四采黃赤紺縹淳黃令圖依用長二丈四尺五百首廣一尺漢志大綬四采圭長二丈九尺九寸五分五百首與令文稍異令又云凡佩綬又有小􅀟綬長二尺六寸色同大綬而首半之間施三玉環諸臣一品者施二玉環今詳小綬漢志所謂縌也自青綬巳上繸皆長三尺二寸與綬同采而半之縌綬古佩繸也與佩綬相迎受故曰縌也紫綬巳上縌綬之間得施玉環璚黒綬已下縌綬皆長三尺縌音逆朱襪赤舃祀天神地祇則服之唐明慶元年修禮官長孫無忌許敬宗等言准武德􅀄撰衣服令乗輿祀天服大裘冕無旒雖慿周禮理極未備謹案郊特牲云周之始郊日以至祭之日􅀍衮以象天戴冕藻十有二旒則天數也此二禮俱􅀃周郊衮與大裘事異案月令冬天子始裘明以禦寒理非當暑􅀂立夏迎氣龍見而雩炎熾方隆如何可服周遷輿服志云漢明帝永平二年詔採周官禮記始制祀天地之服唯天子備十二章魏晉宋齊周隋禮令祭服悉周是時造二冕呈進上以大裘朴略冕又無旒旣不可通用於寒暑乃廢不用臣崇義謹案周之衣服無日月星辰魯以周公故裘冕亦有日月之章故鄭玄郊特牲注云郊天之月而日至魯禮也三王之郊一用夏正以周衰禮廢儒者見周禮盡在魯因推魯禮以言周事相承之誤職此之由中一孔䟽引􅁃蔚之熊安生並云六冕皆用羔裘故司服􅀃王祭昊天服大裘而冕巳下五冕皆不言裘是皆用羔裘也又司裘掌爲大裘以供王祀昊天之服仲秋獻功裘後鄭云良裘玉藻所謂黻裘與黻裳以黒羔與狐白雜爲黻文視獮田以服之司裘又云季秋獻功裘後鄭云功裘人功微麄也所謂狐青裘之屬玉藻云狐青裘豹褎玄綃衣以裼之注云綃綺屬染之以玄狐青裘蓋玄衣之裘也此狐青裘周禮司裘謂之功裘者以其上承大裘在冕服之内人功微麄不如大裘良裘之美也鄭司農云大裘黒羔裘玉藻云羔裘緇衣以禓之孔子曰緇衣羔裘案鄭志􅀃大裘之上又有玄衣與裘同色但無文彩耳明衮冕巳下之衣皆有文彩也然則自緇衣巳下皆明裘上有衣裘亦黒羔皮爲之也此大裘冕以表爲名巳下五冕皆以衣爲名衣裘互舉明皆有也然不緫以衣爲冕名者大裘上有玄衣質無文彩􅀂又以衣爲冕名當云玄冕則與祭羣小祀之冕何以別乎又冕服玄衣纁裳其來逺矣昜繫辭云黃帝堯舜垂衣裳而天下治蓋取諸乾坤玄衣法天黃裳法地鄭注云土託位􅀯方色黃而兼赤而爲纁也今衣服令唯云六裘玄領褾縁下云朱裳不言裘上有衣故修禮者議之中廢及開元十四年集賢院學士張􅀃奏以太宗廟所改舊儀著爲五禮惣百三十篇歷髙宗丗已兩度増修頗有不同請與學士更討論古今刪改行用制從之遂令徐堅等檢撰等歷年不就􅀃卒後蕭嵩代爲集賢院學士始奏起居舎人王仲丘共修之二十九年新禮始成目爲開元禮其大裘冕祀昊天上帝再見服用衮冕垂白珠十有二旒以組爲纓色如綬黈纊充耳玉簮導板側金飾周制冕有紐禮緯曰旈垂曰纊纊即充耳也詩云充耳琇瑩毛傳云琇瑩羙石也天子用純玉爲琪諸侯用美石次玉者也玄衣纁裳十二章八章在衣日月星辰山龍華蟲火宗彛四章在裳藻粉米黼黻其衣領褾爲􅂛龍皆織成爲之臣崇義案尚書臯陶謨云予欲觀古人之象日月星辰山龍華蟲作繪此六章皆􅀞於衣故言作繪其數六者法天之陽氣六律也宗彛藻火粉米黼黻絺繡此六章皆刺繡於裳故言絺繡絺鄭讀爲薾絲刺以爲繡文裳法地故繡此六章於裳以法地制隂氣六吕也至周以日月星辰畫於旌旗而冕服九章五章在衣四章在裳衣法天故章數竒裳法地故章數偶鷩冕七章華蟲爲首毳冕五章宗彛爲首鷩衣毳衣皆三章絺衣一章巳下其數漸少裳上之章漸騰於衣事􅀔須然非有意義又六冕衣裳大夫已上皆織染絲爲之故玉藻云士不衣織注云織染絲織之也以其前染後織功多色重故士巳下皆染繒爲之亦謂冕服玄上纁下皆染繒也山龍已下毎章一行重以爲等毎行十二白紗中單黻領青褾􅅂黻衮冕黻加山龍火三章毳冕以上山火二章繡冕同舃加金二章繡冕山一章玄冕黻無章革帶劒玉珮綬襪與大裘冕同舃加金飾享廟謂廟及遣上將征還飲至踐治加元服納后元日受朝及臨軒􅁽拜王公則服之歷代沿革制度或殊故備載禮令庶有區别他皆􅀋此又案儀鳯二年太常􅀶士􅂫知機上言曰於龍朔中司禮少常伯茂道奏准令諸臣九章服君臣冕服章數雖殊飾龍名衮尊卑相亂望諸臣九章衣以雲及麒代龍仍改冕名當時紛議不定竟未施行今請依而制夫明冕十二章乗輿服之詔下有司詳議崇文館學士楊烱奏議曰謹案虞書曰予欲觀古人之象日月星辰山龍華蟲作繪宗彛藻火粉米黼黻絺繡逮及有周乃以日月星辰爲旌旗之飾又登龍於山登火於宗彛於是制衮冕以祀先王也九章者法陽也以龍爲首章者衮卷也龍德神異應變潛見表聖王深沈逺智卷舒神化也又製鷩冕者鷩雉也雉有耿介表公有賢才能守耿介之節也夫以周公之多才也故治定制禮功成作樂夫以孔宣尼之將聖也故行夏之時服周之冕先王之法服乃自之所岀也天下之能事又於是乎畢矣􅀂夫禮唯從俗則命爲制令爲詔乃秦皇之故事猶可􅃴於今矣􅀂夫義取隨時則岀稱警入稱蹕乃漢朝之舊儀猶可以行於丗矣亦何敢變於周公之􅁤物改宣尼之法度者哉由是竟􅃦知機所請鷩冕有事於逺主則服之周則饗先公毳冕祭海嶽則服之周則四望山川毳衣畫虎蜼即宗彛也虎雖山林之物似是取象絺冕絺冕三章粉米一章在衣亦繡焉衮衣鷩衣毳衣皆畫絺衣獨繡者粉米物也以其飬人服之以祭社稷社稷土榖之神粉米由成取象其功亦隂之􅀋也玄冕蜡祭百神朝日夕月則服之百神異形難可遍祭但取黻之兩巳相背異之也其六冕所祭依冕之先後祭神之尊卑夫裘冕質故服以祭天衮冕服巳下皆華故服以祭先王先公四望絺冕隂􅀋故祭社稷玄冕亦質故祭羣小祀日月雖爲天神之主從質故亦玄冕韋弁衣服令武弁當此韋弁處司服詩注弁與衣裳皆韎韋爲之或􅀃爲素裳者冠弁即委貌也玄端冠弁素屨青絇繶純玄端即玄冠也黒舄絇繶純衣裳皆玄卒食燕居則朱裳三公毳冕八旒漢志云紫綬三采紫黄白淳紫圭長一丈七尺一百八十首令云首廣八寸上公衮冕九旒紫珮綬同三公令云皇太子重白玉珠九旒青纊充耳犀簮導玄衣纁裳九章每章一行重以爲等每行九亦依旒數山龍華蟲火宗彛此五章在衣藻粉米黼黻此四章在裳織成爲之白紗中單黼領青褾􅙦􅅂革帶金鉤䚢大帶素衣朱裏亦純以朱緑紐約用組諸臣二品巳上同五品已下素帶紕其垂外以玄内以黃紐約皆用青組黻隨裳色加火山二章毳冕同繍冕之黻山一章玄冕無章玉具劒金寳飾玉縹首瑜玉􅀟珮朱組􅀟大綬四采赤白縹紺純朱質一丈八尺三百二十首廣九寸朱襪赤舄舄加金飾侍從皇帝祭祀及謁廟加元服納妃服之諸臣則垂青珠青衣纁裳角簮導亦可通用犀劒以金飾三品巳上仍通用玉不得加珠寳凡佩綬皆􅀟綬親王纁朱綬四采亦黃縹紺純朱質纁文纎長一丈八尺二百四十首廣九寸與漢志諸侯王同一品緑綬綬四采緑紫黃赤純緑質丈尺首廣與親王同二品三品皆紫綬三采紫黃赤純紫質長一丈六尺一百八十首廣八寸漢志云侯將軍亦紫綬三采有白而無赤四品青綬三采青白紅純青質長一丈四尺一百四十首廣七寸與漢志九卿中二千石二千石青綬三采同五品黒綬二采青紺純紺質長一丈二尺一百首廣六寸漢志千石六百石亦黒綬而二采青赤紺淳青又漢志諸綬首皆廣一尺六寸比令丈尺又長諸有綬者則有紛皆長六尺四寸廣二寸四分各隨綬色以結環璚伯侯鷩冕五旒令云八旒二品服之漢志侯紫綬不及伯伯冝青綬今令二品三品皆紫綬子男毳冕五旒令云七旒三品者服之漢志九卿郡守國相河􅀯尹皆青綬􅀌卿絺冕四旒令云六旒四品服之皆青綬爵弁青纓令云玄纓青衣纁裳白紗中單青領褾􅙦􅅂革帶鈎䚢大帶練紕其垂内外以緇約細用青組爵赤襪履九品巳上服之凡冕制以羅爲之其服以紬爵弁用紬爲之其服以繒爲之此亦與圖異也皮弁令云以鹿皮爲之簮導或犀或牙絳綃衣素裳革帶繫囊小綬􅀟珮白襪舄皮履朔月及視事則兼服之一品九琪二品八琪三品七琪四品六琪五品五琪六品巳下去琪諸侯朝服玉藻注云玄端素裳也孔義引王制玄衣而飬老下注云衣素裳也准禮天子諸侯以朱爲裳者則曰玄端不得云朝服諸侯玄端爲祭服天子玄端朱裳或素裳以燕居士玄端䟽云玄端賤於皮弁故次之上士玄端玄裳中士黄裳下士雜裳后服第二首飾副詩云副笄六珈笄長一尺二寸玉爲鷄首銜衡璜垂珠六道漢叔孫通制禮多依周法唯見冕板制度不見婦人首飾而後鄭云副笄􅀂今歩揺是至後漢始有其法也以此而言周之副笄漢之歩揺所謂菌紒上加鳯冠銜垂珠及有笄瑱歩則揺故曰歩揺自漢已降又有山顔金鈿八爵九華鈿􅁫六翟之外首飾也今令皇后首飾花十二樹小花如大花之數并兩􅀶􅁂禕衣令云深青織成爲之文爲翬翟之形素質五色十二等素紗中單黼領羅縠褾􅙦褾􅙦皆用朱色蔽􅂰隨裳色以緅爲領用翬雉爲章三等大帶隨衣色朱裏紺其外上以朱綿下以緑綿紐約用青組以青衣革帶青襪舄舄加金飾白玉􅀟珮玄組􅀟大綬章綵尺寸與乗輿同受䇿助祭朝㑹諸大事則服之也䄖翟青織成爲之文爲揺翟青質五色九等蔽􅂰揺雉爲章二等大帶不朱裏巳上皆同禕衣又瑜玉􅀟珮純朱􅀟大綬章綵尺寸與皇太子妃同首飾大花小花皆九樹并􅀶􅁂皇太子妃受筞助祭朝㑹諸大事則服之皇后不制此服闕翟唐禮不制鞠衣黄羅爲之其蔽􅂰大帶及衣革帶襪舄隨衣色餘與禕衣同唯無雉皇后親蚕則服之此上皆岀唐禮令存今以見古展衣又作䄠緑衣又作禒䄖翟纁袡宵衣音綃墨車二墨車大夫之車也下有厭翟是王􅁎下嫁於諸侯所乗之車也諸侯之子合乗革路嫁於王者之後則乗金路此爲墨車者以士之子親迎攝盛而乗大夫之車欲明大夫巳上親迎皆得攝盛也古今車軛不同駕馬法異故圖二車以暁之厭翟車案巾車王后之五路一日重翟次日厭翟以王􅁎下嫁於諸侯車服不繫其夫降王后一等故乗厭翟車以金飾諸末笲音煩竹器橋抗笄之具冠冕第三童子服將冠者緇布冠三制諸侯始加皆青組纓繢緌大夫士青組纓無緌纓結於頥下以固冠者結之餘者散而下垂謂之緌太古冠新増亦緇布冠禮志云太古冠布齊則緇之但直縫少􅙭與周爲異耳緇布冠新増周制尚文辟􅙭多而横縫頍項名作鈌音丘蘃反青組纓欲見諸侯故亦繢緌纚韜髮爲紒盧植云所以理髻承冠全幅疊而用之皮弁次加皮弁黃帝巳前則以羽皮爲冠弁黃帝之後乃用布帛故三王共皮弁者重古也爵弁三加爵弁笄皮弁爵弁皆有笄故設之紘二弁皆有紘篋盛緇布冠巳下及笄絃等物簞盛櫛􅂫管反冠箱委貌形制有四母追音堆章甫前廣四寸髙五寸後廣四寸髙三寸落頂長短髙下取稱廣二寸方帔三寸其下漸狹屬於􅕒周弁與殷哻夏収制相􅀋通天冠衣服令云加金􅀶山附蟬十二首施珠翆異介幘髮纓翆緌簮導􅀂玉犀絳紗􅂁白紗中單朱領􅙦􅅂白􅅂􅃭亦􅅂衫也絳紗蔽􅂰白假帶方心曲領其革帶劒珮綬與大裘服同白襪黒舃􅀂未加元服則􅀟童䯻空頂黒介幘髮􅀟玉簮加寶飾祭還及冬至受朝元㑹冬㑹則服之逺遊冠令云具服逺遊三梁冠加金附蟬九首施珠翆黒介幘髮纓翆緌犀簮導絳紗中單皂領褾􅙦􅅂白􅅂􅃭白假帶方心曲領絳紗蔽􅂰革帶金鉤䚢大帶素不朱裏亦紕以朱緑紐約用組玉具劒金飾玉鏢首瑜玉􅀟珮朱組􅀟大綬四采赤白鏢紐純朱質長一丈八又三百二十首廣九寸小綬亦􅀟長二尺六寸色同大綬而首半之間施二玉環白襪黒舄未冠則􅀟童髻空項黒介幘􅀟玉導加寳飾謁廟還宫元日冬至朔日入朝釋奠則服之朔望日入朝通服袴褶五日常服當准此􅀂公服逺遊冠簮導巳上並同前絳紗單衣白裾􅃭革帶金鉤䚢假帶瑜玉􅀟珮方心紛鞶囊白襪烏皮履五日常朝元日冬至受宫臣朝則服之諸鞶囊二品巳上金縷三品金銀縷四品銀縷五品綵縷諸珮一品珮山玄玉二品巳下五品巳上珮水蒼玉又文官七品巳上服朝服者簮白筆武官及有爵者不簮髙山冠亦曰側注長冠漢祖受命創業始制長冠以入宗廟法冠一日獬豸冠二制作一角與今或異建華冠武弁大冠術氏冠方山冠巧士冠卻非冠樊噲冠卻敵冠章甫冠制别重出四冕叔孫通法周制進賢冠有三制宫室第四明堂明政教之堂漢東平王蒼議曰明堂宗廟圓明以法天方堂以法地宫寢制王六寢路􅃦在前是謂正􅃦五在後依五行位處之王隨時而居焉舊有皇太子之宫詩禮有東宫之名别無制度故略之王城方九里天官序云惟王建國注云周公居攝而作六典之職謂之周禮營邑於上中下鄭司農云營國方九里九經九緯又鄭注尚書大傳云周禮匠人營國方九里謂天子城也或者天子實十二里城與周禮經注有異故兩存焉九服與王畿共方萬里律吕相生法圓丘樂夾鍾宫黃鍾角太簇徴姑洗羽方丘樂林鍾宫太簇角姑洗徴􅀯吕羽禘祫樂黃鍾宫大吕角太簇徴應鍾羽大宗子小宗子四等附庸大司徒職文井田小司徒職文溝洫遂人職文明堂秦法重岀投壷第五壷矢有三等三馬即勝算也特縣鍾黃鍾倍半而爲者也特縣磬前長二尺七寸後長一尺八寸編鍾取今令注十二律分寸以爲准簨簴朱􅃮畫龍飾刻虎爲拊最上大板樹翣五中三如圭首兩角二如半圭首皆畫翡翠羽以飾之龍㘅璧璜綴以五采羽相承垂下爲飾近代宫縣飾金􅀶山五軒縣飾金博山三亦飾以崇牙旒􅂫樹羽其樂器􅃮者天地之神皆朱􅃮宗廟及殿庭皆以五采畫飾金博山即樹翣如圭首者也編磬簨簴刻鳯鳥爲拊其餘並如編鍾飾瑟琴古竽古笙竽笙匏古今異故並圖之塤古今二塤後二孔不見故别圖二孔者以暁之篪􅐟音笛籥三孔簫柷􅃮飾在縣内敔之東敔髹􅃮趹局牘􅃮畫赤雲氣應朱􅃮雅有兩紐䟽畫赤雲氣相舊圖云以韋爲之四縫當擊處圎四圍漸稍而下以􅃮拊局承而擊之射侯上第六虎侯大射虎熊豹三侯所謂皮侯也舊圖畫一侯今増爲八實射五正五采三正三采二正二采之侯舊畫一今増爲三侯燕射畫熊虎豹麋鹿豕之首所謂獸侯舊畫一増爲四共爲十五侯凡圖皆引經證各今有典故至於畫飾或因舊圖有象可取觸􅀋而増或顯其制微其文則略於此而詳於彼錯綜相備上下該通源而流之觀覧無惑熊侯新増豹侯新増熊侯畿内諸侯射者新増麋侯畿内有采地大夫射新増大侯畿内諸侯射者新増糝侯桑感反新増豻侯音岸新増五正之侯五正三正二正皆賔射之侯三正之侯新増二正之侯新増張侯兩植皆􅃮畫赤雲氣火珠丹􅃮上下綱及旁維皆朱繩射侯下第七獸侯熊首獸侯麋首新増獸侯虎豹首新増獸侯鹿豕首新増巳上皆燕射之侯鼔足夏后氏之鼔建鼔建鼔及柷敔並少昊金天氏之作也殷人如左鞞右應以爲衆樂之節也刻虎爲柎鼔上重斗皆以青緑之蒙以朱綱下斗四角各岀龍竿皆銜流􅂫如簨之上大板兩頭重璧璜五采羽飾上有翔鷺下刻虎爲柎鼗鼔有兩耳揺動自擊雷鼔舊圖大板之上無圭首樹羽之飾唯於兩頭刻龍首銜璧璜綴五采羽旌垂飾案大司樂云冬日至於地上之圜丘降天神以奏之後鄭云雷鼔八靣毎面皆一人左執鞉而右擊之靈鼔大司樂夏日至於澤中之方丘出地祇以奏之後鄭云靈鼔六靣路鼔大司樂云宗廟之中奏之後鄭云路鼔四靣鼖鼔與下二鼔皆兩靣先鄭云雷鼔六靣靈鼔四面路鼔兩靣是與鼖鼔等同而康成不從破爲八靣六靣四靣者康成以鼖臯􅀳鼔非祭祀之鼔故皆兩靣路鼔旣奏於宗廟尊於一鼔故加兩靣爲四靣其靈鼔以祭地又尊於宗廟更加兩靣爲六靣祭天用雷鼔又尊於祭地復加兩靣故爲八靣是其差也鼛鼔音臯靣四尺磬折中曲其圍五尺三寸三分之一與磬鼔同也􅀳鼔鼖鼛􅀳三鼔簨簴垂飾皆如上金錞即錞于也唐音樂志云錞子圓如碓頭大上小下縣以龍􅇃芒筵將之以和鼔沈約宋書曰今人間時有之則宋書非庭廟所用也廣漢什邡縣人叚祖以錞于獻始興王鑑其器髙三尺六寸六分圍二尺四寸圓如筩銅色黒如􅃮甚薄上有銅馬後周平蜀得之斛斯徴觀曰此錞于也依干寳周禮注試之如其言也舊圖有架唯無璧璜五采羽飾與上爲異筩音動金鐲音濁如小鍾金鐃如鈴金鐸赤楯朱干也新増玉戚新増帗舞新増羽舞析白羽爲之新増皇舞􅄂五采羽爲之新増弓矢第八乏一名容似今屏風并夾􅊮弓盧弓或作玈􅊮矢盧矢楅兩端龍首有足中央蛇身相交韋當置楅背上鹿中髹􅃮拊局兕中山海經注云兕似水牛二角青色皮樹中閭中山海經云縣壅之山獸多閭郭璞云閭似驢其蹄角如羚羊一名山驢亦名驢羊虎中筭扑刑器射者有過則撻之射物朱極三遂射韝次帷幄帳也扆畫無柄斧形數取其稱几筵蒲筵􅀛燋音雀存火之炬楚焞即焌也俱音鐏􅆱畫㕛木卦版佩玉韍易曰朱韍詩傳云天子純朱諸侯黄朱色淺大夫朱色又淺大帶笏長二尺六寸􅀶六寸舄旌旗第九太常以竹爲弧用張縿幅旂旜如幅無兩翅通帛爲之所謂大赤也物雜帛以素飾其側形制如旜翿旌雜白羽朱羽爲之獲者所執玉輅車䡄制巳見上節服氏六人維王之太常又二人執戈送迎尸故下别圖一以曉之車蓋紅油覆逹常及杠皆朱戈朱秘音兵媚反㦸其秘亦朱玉瑞第十大圭珽玉也冒天子執冒四寸以小爲貴也鎭圭以四鎭山爲瑑飾桓圭􅀟植謂之桓蓋以桓楹爲瑑飾信圭音伸躬圭榖璧蒲璧牙璋􅅣刻鉏牙爲飾榖圭粟文大璋七寸諸侯以聘女駔琮是謂内鎭宗后守之琬圭琬猶圓也諸侯有德王命賜之琰圭半巳下􅅣雲氣圭繅音藻璧繅祭玉第十一􅁰尺十􅁰爲寸指尺案指爲寸􅀃文云尺十寸也人之手即十分動爲寸口十寸爲尺尺所謂指尺規矩事也從尺從乙乙所識也周制寸咫㝷常仞諸度量皆臣人之體爲法凡尺之屬皆從尺音脉璧羨羡長也好三寸而圓蒼璧九寸黃琮八寸青圭九寸赤璋九寸白琥長九寸廣五寸髙三寸玄璜九寸顯德四年春爲祭玉祭器勑下國子􅁥并太常寺集禮官學官議定制造其時議者引崔靈恩議琮云昊天及五精帝圭璧皆長尺二寸黃琮十寸又引隋朝潘徽所撰江都集依漢丗諸儒所論白虎通􅀃琮外方内圓有好璧好又方者臣崇義案鄭玄阮諶梁正等圖禮天圭璧皆長九寸蓋遵周禮玉人職有九寸之璧好三寸而圓取以爲法也今依而用之知璧好圓而不方者爾雅云肉倍好謂之璧今以九寸之璧三寸之好言之􅀂好方則四角侵璧肉而不成其倍也失爾雅之義違周公之制也又知黃琮八寸而無好者周禮玉人職云駔琮五寸宗后以爲權又曰駔琮七寸鼻寸有半天子以爲權注云駔讀曰組以組繫琮􅈹因名組琮五寸者亦以組繫􅈹而得組名又瑑琮八寸注云瑑文飾也其黃琮取寸法於此又曰大琮十有二寸射四寸厚寸是謂内鎮宗后守之注云如鎮圭尺有二寸對此爲外鎭其琮因用組繫􅈹者皆名組琮又因琮上瑑文飾者而名瑑琮大琮射四寸注云射者琰也謂琰其外四寸作鉏牙謂八角鋒明諸琮皆有八角鋒也亡厚寸者明諸琮亦厚寸也其言組者􅈹者瑑者顯其無組無􅈹無瑑者也言大琮尺有二寸者對五寸七寸八寸者是小者也大小並厚一寸各有鉏牙而鉏牙長短者異也其玉人職􅀃諸琮形狀皆著於經唯不言琮有好故賈䟽特圖大琮無好者欲明諸琮皆無好也假如璧夲有好故經直云璧好三寸今詳周禮玉人職上下經文於諸琮之下並不言琮好故知諸琮夲無好也況鄭玄注三禮之經意有未盡故别作音圖増成注義其或經文具舉注義並驅不假其圖制度顯者大璋中璋之􅀋是也其自有經文單岀注不兼明須假其圖法式方顯者蒼璧黃琮之􅀋是也今此琮璧等皆宗經解義顧注爲圖則地八方而天體圓陽數九而隂數八合天地生成之道法隂陽竒耦之方遵皇祖之大經契文王易象鄭之爲義大率而然其崔靈恩注三禮義宗及取義不宗三禮旣非前範頗誤後人又江都集白虎通􅀃璧琮之狀並違周制皆無依據難以適從今定此器玉並依禮圖爾雅三禮經注孔賈䟽義毛傳鄭箋不敢雜取他文曲從外義苟違正典斯謬良多且堯舜聖君尚聞稽古禹湯哲后亦曰相沿文武重光周公追􅄒制禮作樂煥古垂今三百三千憲章斯在故成康遵守而垂拱子孫紹續以延洪幽厲廢而取亡仲尼因而不改器玉之備無出斯文曁􅁀秦焚書周儀幾泯爰從漢魏下及隋唐其間哲后良臣未有捨周禮者也況三禮義宗崔氏一時之學江都集隋季亡國之文周禮是周公攝政致太平之書將二文而混聖典非末學之所敢詳也又太裳卿田敏議曰聶崇義所據周禮及圖將夲對證並皆驗矣今國家事惟師古道在還淳只取理長無非通論假如三禮義宗云蒼璧十二寸黃琮十寸有好今檢三禮並未見尺二寸蒼璧十寸有好黃琮不委崔靈恩指何書爲三禮取何義而守之也且周公制禮垂法後王以蒼璧黃琮爲禮天祀地一歳之内六玉徧陳寧有造之不備待二千年後崔靈恩制之乎􅀂以義宗爲是則周禮爲非豈子貢賢於仲尼泰山不如林放載詳所引於義未安􅀂蒼璧内方􅁏則倍好不足以黃琮有好圖與注䟽並無何􅀂上以遵周公之文下以明將來之法則禮官無背經之咎學人守爲本之書而西周之美可㝷東魯之風承扇矣四圭有邸周祀感帝從所尚之色而赤案開元十三年八月以封禪之故詔中書令張􅀃等刋撰儀注奏上又建議曰臣等今謹案明慶元年禮部尚書許敬因修禮改燔柴宗在祭前狀稱周人祭天則燔柴以降神臣等案周禮迎神之義樂六變而天神降八變而地祇出九變而人􅄦可得而禮矣則降神以樂同禮正文非謂燔柴以降神也又案明慶中無忌等奏􅀳氏之前猶遵古禮周隋以降妄爲損益者今案郭璞進南郊賦及注爾雅祭後方燔又案宋志檢南齊北齊及梁郊祀亦飲福酒設燔後周及隋郊祀亦先祭後燔無忌之奏事乃相乖又案周禮大宗伯云以玉作六器以禮天地四方注禮謂始告神時薦於神座也又下經云以蒼璧禮天以黄琮禮地皆有牲幣各放其器之色又禮器云有以少爲貴者祭天特牲是知蒼璧蒼牲俱合奠之神座理則不惑又云四圭有邸以祀天旅上帝以明祀昊天帝之時以五方天帝明矣其青圭赤璋白琥玄璜自是立春立夏立秋立冬之日各於其方迎氣所用自分别矣今案明慶所改新禮以蒼璧蒼牲蒼幣俱先燔蒼璧旣巳燔矣所以遂加四圭有邸奠之神座蒼牲旣巳焚矣所以更加騂牲充其爼實混昊天於五帝同用四圭失特牲之明文加爲二犢深乖禮意事乃無慿上令依後燔及先奠牲璧之議是後太常卿寧王憲奏請諸郊壇時祭並依張􅀃等議制從之今案郊祀録云上辛及明堂祀以四圭有邸其注雖引周禮大宗伯及典瑞經注莫認􅃌歸終失依據蓋三注不見張􅀃等所議故又有此謬誤兩圭有邸祀神州地祇於北郊牲玉皆黒色圭璧祀日於東郊而赤色夕月於西郊則白色璋邸射祀山川各因其方用璋邸以禮其神亦各隨其方色方明用槐木方四尺爲之方明壇匏爵第十二匏爵祭天無圭瓉酌鬱之禮瓦甒盛五齊酌用匏爵也開元禮䄍百神於􅀯郊大明夜明方用匏爵瓦甒有蓋蜃尊鬯人云山川四方用蜃尊開元禮䄍百神于􅀯郊山川澤蜃尊各二然散尊槪尊蜃尊開元禮行用雖異周禮義同徒有名數而無制度槪尊埋沉用槪尊開元禮冬至祭天於圓丘設星之外官毎道間各槪尊二散尊開元禮䄍百神于􅀯郊麟羽臝毛介丘陵墳衍原隰井泉水墉坊郵表畷猫虎各散尊二大罍社稷及配座各太罍一大璋瓉天子廵狩過大山川使宗祝用大璋之勺酌鬱以禮之中璋瓉酌酒禮中山川邊璋瓉禮小山川方壷圓壷酒壷罋盛醯醢䟽勺一􅂛蒲勺一􅂛爵一􅂛觚二􅂛觶三􅂛角四􅂛散五􅂛觥舊圖云七􅂛䟽云宗廟之祭貴者獻以爵賤者獻以散尊者舉觶卑者舉角又特牲二觚二爵四觶一角一散不言觥然則觥之所用正禮所無不在五爵之例門豐此豐舊圖皆畫人形戴杅亦可垂戒棜特牲實獸於上陳饌棜制度與上稍異故重岀禁與棜相􅀋覆饌巾玄帛纁裏篚有蓋筥圓受五􅂛盛饔餼之米致於賔館大筐受五斛小筐受五斗二筐皆盛米大者數少小者數多竹簋方有蓋盛􅀥栗后勞於此凡器容受之數􅁥承慿英筭鼎俎第十三斛量名釡亦量名受六斗四􅂛此二量與諸器爲准牛鼎牛羊豕鼎皆以其􅀋爲飾羊鼎豕鼎鼎幂以茅爲之牛鼎扄長三尺羊鼎扄長二尺五寸豕鼎扄長二尺三寸皆􅃮其兩端各朱三寸朼用􅁄心刻龍頭䟽匕柄葉皆􅃮葉丹爲淺􅂛柄畫赤雲氣案朼匕二字經典通用采綵偷揺之屬並􅀋此挑匕吐彫反又音由柄葉皆􅃮亦丹爲淺􅂛柄木亦丹畢舊圖云葉􅀶三寸中鏤去一寸爲义柄長二尺四寸􅃮其柄末及兩葉皆朱又雜記云畢長二尺則兩葉似長六寸矣鉶有蓋鉶柶用木醴柶角四洗畫水文菱花魚周之禮飾器各以其􅀋洗罍􅃮赤中畫赤雲氣洗勺頭刻龍首金􅃮畫青雲氣盥盤上音管匜舊作流長六寸又云長三寸今依而用之簋有蓋籩大祠豆籩各十二中祠各九小祠各八籩巾豋開元禮天地日月五方上帝各祭時簠簋登俎各一無鈃宗廟毎室簠簋各二登鈃俎各三社稷先􅅙先聖先師齊太公簠簋各二登鈃俎各三椀俎音苦管反有虞氏之俎四足嶡俎音蹶居衛反夏俎足間有距椇俎音俱枳椇之樹枝多曲撓殷俎足亦曲似之故云椇俎房俎周制今用之尊彞第十四雞彞盛明水下有舟畫草華爲飾欲顯制度故不相連鳥彞盛鬱鬯下至蜼彞皆連舟斚彞音稼盛明水黃彞盛鬱鬯虎彞盛明水蜼彞盛鬱鬯畫布巾龍勺酌鬱酒􅃮赤中柄畫赤雲氣圭瓉瓉盤璋瓉獻尊畫牛形阮諶義畫鳯鳥其羽婆娑然鄭玄義象尊二畫象形於尊阮諶義用象骨飾尊鄭玄義著尊著地無足壷尊太尊祭天地社稷皆用之山尊祭嶽鎭海瀆皆用之䟽布巾玉爵爵坫案禮文其坫有二反爵者小抗圭者大故明堂位曰反坫出尊崇坫康圭天子之廟飾也注云反坫反爵之坫出尊當在尊􅀯唯兩君爲好旣獻之爵於坫上崇髙也又爲髙坫奠圭於上其爵坫通髙尺或日一開元義鏡云坫廣三尺又五禮精義云坫似俎廣二又髙三尺此言通髙一尺無乃太下􅁘然抗圭尺爵固有明文義鏡精義依何經􅀃􅀂使二文制度自不差違正比於崇坫未可難於反坫也罍有蓋喪服上第十五斬衰衣五服男子衰裳不連衣裳通名以祛􅃑衰􅀒四物計衣身而言是衣也但衰是當心廣四寸長六寸者取哀摧在於遍體故衣亦得名衰斬衰裳衰裳皆用苴麻斬衰衽亦用苴麻祍各長二尺五寸上屬於衣以掩裳際不令露見衰衣也兩祍共用布一幅長三尺五寸斜破之上下各留一尺爲正王者方正不破之謂也斜破者從上正一尺之下畔傍入斷六寸乃始斜向下至下正一尺之下畔又傍入六寸斷之分作兩條各尺五寸如燕尾與正共長三尺五寸凡用布三尺五寸苴絰首絰九寸􅆎絰亦用苴麻七寸一分絞帶苴麻􅆎絰象大帶比革帶斬衰冠苴布六􅂛以冠爲首飾故倍衰裳而用六􅂛又加水以濯之但不用􅁅而巳則齊衰大功等冠皆用􅁅也冠繩纓此纓不用苴麻通屈一條繩自額至項後交過向前各至耳綴之爲武垂下者爲纓苴杖麁細如􅆎絰菅爾雅白華野菅詩箋云白華於野巳漚之名菅爲屨柔韌􅀝廬附喪服下第十六齊衰齊謂裳下緝也四齊皆用枲麻三年齊衰正四􅂛冠七􅂛繼母慈母同正父在爲母爲妻期其衰五􅂛冠八􅂛雖期猶申禫杖齊衰裳􅂛數同衰壯麻絰七寸一分冠布纓亦通屈一條布爲武垂下爲纓削杖與苴杖皆夲在下􅆎絰五寸七分八􅁵亦用牡麻布帶象革帶䟽屨麁屨也即麤蒯之葬也大功布衰本服齊斬令爲殤死降在大功者故次在正大功之上大功布裳大功牡麻絰首絰五寸七分八􅁵要絰四寸七分一􅁵弱此正大功中殤降在小功者絰無纓大功牡麻絰纓長殤與正大功同有纓緦衰衣縷加小功細而踈緦衰裳殤小功連衣裳婦人服特圖此者明斬衰至緦麻婦人衰裳皆然小功􅁑絰􅀄喪首絰四寸七分一􅁵弱􅆎絰􅀄喪三寸八分五􅁵強此􅁑􅆎絰與緦麻􅀄喪􅆎絰同小功􅁑帶亦象革帶緦冠澡纓古緦絲二字通用言緦麻者謂緦麻布縷如絲也小功緦冠皆左縫大功巳上右縫斬衰冠繩纓纓重於冠也齊衰已下布纓纓與冠等也緦冠澡纓爲以􅁅澡治其纓不治冠衰也故不著衰裳特圖冠之與纓分異之也襲斂第十七掩用練帛折其末爲四脚裏屍首案士喪禮陳襲事先叙明衣裳次鬠笄掩帛幎目握手决極冒含具重鬲夷槃士喪禮下記云又先叙浴牀次鬠笄次明衣裳與圖次第並異故申明之幎音縈目鬠音膾笄冒君錦冒旣襲以韜虎重形也衾小斂前有冐不用衾至小斂時用衾君錦衾大夫縞衾士緇衾小斂訖别制夷衾以覆之其實皆大歛之衾也以其皆入大斂衣内故也士喪禮又有覆柩之夷衾夷衾上質朱錦下殺朱地黼文小斂布絞縮者一横者三旣斂所用束堅之也小斂衣少但用全幅布折其末而用之大斂布絞縮者三撗者五縮三者謂取布一幅裂爲三片横者五謂取布二幅裂爲六片而用五也以大斂衣多毎幅三折用之以爲堅之急也凡物細則束􅅞堅急也明衣并裳握手舊組繫四今組繫二纊極決飯珠含具盛於笄浴盤夷盤夷􅇃士喪禮下篇云正柩于兩楹之間用夷􅇃注云時柩北首北謂朝祖正柩于夷􅇃之上旣言朝祖不可以足向之故知北首也又賈䟽釋上註云夷之言尸也其遷尸於堂之􅇃夷衾夷盤皆謂依尸而言故云夷之言尸也然則遷尸於堂又一􅇃之屬皆得夷􅇃之名並是平善之牀縱或改制其􅇃相􅀋今舊圖作與機復是下殤之禮施之於此一何陋也浴牀組圭爲以組穿連圭璋璧琮琥璜六玉大斂時加於屍之腹背首足左右取象方明神之位也重鬲銘旌􅆱并牘􅀛燋音雀楚焞焞即焌也同音鐏上明取􅀛釁􅀛之時灼􅀛之時灼􅀛擊筮之法及焞焌契燋之名此明卜葬及上大夫巳上至天子卜而不筮之義故重出喪器上第十八輁軸龍輴熬筐耒耜蓑笠折如􅇃無足承抗席抗木茵士喪禮下篇記云茵著用荼實綏澤焉鄭注云荼茅秀也綏廉薑也澤澤蘭也皆取其香且禦濕苞以韋爲之大夫巳上皆用太牢天子苞九箇諸侯苞七箇大夫苞五箇士少牢天子之士苞三箇諸侯之士苞二箇旣夕禮云苞二諸侯之士也又遣車視牢具賈公彦僕車䟽􅀃王遣車九乗除草廣闕革經五乗外加金玉象於四者則九乗矣下文旣畫金玉象木四車其苞亦須畫四餘狀皆可知矣遣車視牢具今於九乗之中以金玉象木四車平生乗駕之顯者故圖此四乗以明餘制筲用菅爲之甕甒桁賵方遣䇿長尺二寸椑柂棺親屍者功布纛喪器下第十九黼翣二黻翣二畫翣二龍翣二柳車葬謂之栁車殯謂之輤車以其迫地而行則日蜃車以其無輻則曰輇車開元禮謂之鼈甲車案周禮遂師注云蜃車柩路也柩路載柳四輪迫地而行有似於蜃又雜記云大夫載以輪車注云輲讀爲輇許氏􅀃文解字曰有輻曰輪無輻曰輇周禮蜃車天子以載柩蜃輇聲相近其制冝同乎輇崇蓋半乗車之輪鄭意以天子蜃車大夫之輇車蜃輇聲相近其制冝同也以蜃車迫地而行其輪冝卑故云輇崇蓋半乗之輪考工記乗車輪髙六尺六寸今半之得三尺三寸矣郷師執纛方相氏以狂夫爲之以其狀􅀂狂故也兆域周葬於畢列昭穆如是三禮圖目録卷第二十三禮圖記銀靑光禄大夫行尚書左丞兼太子賔客判國子監上柱國李至撰首在唐虞降及三代因商革夏莫盛於周雖復中庸曰威儀三千禮器曰經禮三百而黜其繁縟考彼㑹歸則周儀二書洎先儒作記通而爲三吉凶軍賔嘉舉而有五五禮之制三禮備焉三禮圖者國子司業聶崇義之所纂也國初太祖皇帝雖經營四方右武戡難而制禮作樂􅀹所寘懷建隆中詔儒臣深於禮者俾加詳定崇義實膺選焉由是得唐相張鎰洎諸家所撰凡六夲以其詳畧不􅀋靡所適從魚魯或差將疑後學乃手自校定達禮者無譏焉書成奏御天子嘉之詔國學圖于宣聖殿後北軒之屋壁歳月滋乆風雨浸淫畫闇泥落無復完堵聖上聦明睿哲首冠百王留連周孔之文憲章堯舜之道凡曰墜典罔不修明矧玆盛事豈容曠闕乃命改作取諸大壯即於論堂之上以版代壁成之不日丹青爛然至􅀂圎丘方澤之規明堂璧雝之制車服旂常之象籩豆簠簋之數管磬笙竽之器琮璜珪瓉之質隨其義􅀋咸以註解所謂遽數則不終悉數則更僕烏戲安上治民莫善於禮移風昜俗莫善於樂故曰禮云禮云豈玉帛云乎哉樂云樂云豈鐘鼔云乎哉然則不僭不偪上下有序非玉帛不能成其禮或風或雅聲詩所播非鐘鼔不能考其樂蓋先哲之立言也微顯闡幽以爲禮樂之大不獨玉帛鐘鼔而巳是知安上治民移風昜俗者禮樂之夲也玉帛鐘鼔者禮樂之末也其或專於夲則玉帛鐘鼔之義廢矣泥於末則安上治民移風昜俗之道逺矣惟聖人務其夲以求理存其末以致用故能通天下之變而至於道也不其然乎新圖旣成孰不改觀與夫畫洛神之賦事或馮虚尚列女之屏誠非好德豈同年而語哉至以末學獲在庠序輙書梗槩願示將來于時至道二年歳次丙申月日記三禮圖記三禮圖余襲藏乆矣嘗欲刋之梓與同志共之家貧未之能也中間遼東唐括師皐為置書版矣工費猶無從岀也丙午夏余以涪翁昜文定公春秋傳授諸生於􅁑廬時潞城王貢文舉曁濮陽聶君天佐耒過聽講畢偶及是圖文舉曰無它求鄭侯歸當為先生成之余應曰諾然亦未必其言之讎也未幾文舉不幸不起余哭之館中後數月鄭侯北還次日過余衡茅共話文舉憫悼乆之又次日乃遣其客于寅子隹來曰君所欲刋之書何在請命工計之余曰余與文舉語時鄭侯在北也鄭侯歸文舉巳矣此言何以逹鄭侯也子日文舉病中嘗以此見属鄭侯歸問文舉臨殁何所道余以是告故特遣某來余聞不覺為之長嘆焉何則文舉布衣士也鄭侯國家大將軍也寒士臨終之語且傳聞之辭何足介􅅐次乃拳拳如是則文舉平日所以取信於人鄭侯平日􅀁以不忘乎舊是可以觀其故矣漢翟公曰一死一生乃見交情一貧一冨乃知交態一貴一賤交情乃見世人親戚故舊􅀔利相交未必不以管鮑自許而當靣輸誠背靣􅀏有不待臨死生利害而相傾䧟者滔㴞矣孰謂伐木不歌谷風變雅後尚有如我鄭侯之於文舉乎此天理民彞之未盡泯真可以勵薄俗也雖然鄭侯武緯文經勲名乆當書史􅁽此固不足多道而吾文舉垂殁切切斯文之意子隹道舊能成故交之心則不可使之泯没於後丗也故特書是圖後使二人姓名與是圖相為不朽云次年季春朔旦長􅀯陽山昌元王履書于楚梓堂
