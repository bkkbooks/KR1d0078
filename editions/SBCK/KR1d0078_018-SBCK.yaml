body:
  text: 甒旣夕禮云甕三醯醯屑幂用䟽布註云甕瓦器其容亦蓋一觳屑薑桂之屑也内則曰屑桂與薑幂覆同也賈釋云知甕瓦器者以甕甒二字皆從瓦故知是瓦器也云其容亦蓋一觳者亦上筲三註云其蓋與簋同一觳者也然豆實三而成觳以豆實四􅂛旣三豆成觳則觳受斗二􅂛則筲與甕俱容斗二􅂛矣旣夕禮云甒二醴酒幂用功布註云甒亦瓦器也容受冝與甕同中寛下直不銳平底其甕下銳與甒爲異桁賵方旣夕禮云皆木桁乆之註云桁所以􅍥苞筲甕甒也乆當爲炙炙謂蓋塞其口毎器異桁賈釋云皆木桁乆之者謂自苞筲以下皆炙塞之置於木桁也然苞筲等燥物直苞塞之無冪甕甒濕物非直灸塞其口又加幂覆之又孔義云桁以木爲之置於地所以􅍥甕甒也又阮氏梁正等圖云桁制􅀂今之几狹而長以承藏具實于見聞士喪禮下篇曰書􅈖於方􅀂九􅀂七􅀂五註云方板也書賵奠􅉠賵之人名與其物於板每板􅀂九行􅀂七行􅀂五行賈釋云以賔客所致有􅈖有􅉠有賵有奠直言書賵於方者舉首而言也但所送有多少故行數不同公羊榖梁皆云車馬曰賵禮志曰賵馬入廟門旣夕禮云君賵玄纁束馬兩註云賵所以助主人送葬也則賵者施於生及送死者其下註亦云賵者生死兩施是也兩馬士制也謂士在家常乗兩馬􅀂出使及征伐則乗四馬又􅉠之言􅀘也助也謂􅀘助主人之不足也公羊云貨財曰賻又下經云知生者􅉠然則􅉠者施於生者也贈者送也士喪禮下記云凡贈幣無常註云賔之贈也玩好曰贈在所有也玩好者謂生時玩弄之具與死者相知皆可以贈死者故經云􅀂就器則坐奠于陳就猶善也善器則玩好之器也以所贈無常唯玩好所有奠于明器之陳也奠者謂賔致之物或可堪爲奠􅀕者也然則四者或隨親䟽或各主於所知也是故小功兄弟有服之親且賵且奠許其厚也贈奠於死生兩施也所知則賵而不奠降於兄弟也所知通問相知者也奠施於死者爲多故不奠也知死者贈知生者賻以其各主於所知也君即位而爲椑歳一􅃮之􅀂木成然鄭又云椑謂棺親尸者椑堅著之言也言天子椑内又有水兕革棺喪大記曰君大棺八寸屬六寸椑四寸上大夫大棺八寸屬六寸下大夫大棺六寸屬四寸士棺六寸註云大棺棺之在表者也檀弓曰天子之棺四重水兕革棺􅀍之各厚三寸合六寸此爲一重柂棺一柂棺木所謂椑棺也梓棺二屬與大棺也四者皆周此從内􅀃而出也然則大棺及屬皆用梓椑用柂以是差之上公革棺不􅀍三重也諸侯無革棺再重也大夫無椑一重也士無屬不重也庶人之棺四寸棺束縮二横三祍毎束一祍今小要喪大記云士葬用國車音輇示專反或作團又誤作国二綍無碑比出宫御棺用功布註云比岀宫用功布則出宫而止至壙無矣舊圖云功布謂以大功之布長三尺以御柩居前爲行者之節度又隱義云羽葆功布等其象皆如麾則旌旗無旒者周謂之大麾旣夕禮云啇祝執功布以御柩執披賈釋云謂以葬時乗人故有柩車前執引者及在柩車傍執披者皆御治之又註云居柩車之前􅀂道有低仰傾虧則以布爲抑􅀭左右之節使引者執披者知之也道有低謂下坂時也道有仰謂上坂時也傾虧謂道之兩邊在柩車左右轍有髙下也􅀂道有低則抑下其布使執引者知其下坂也􅀂道有仰則􅀭舉其布使執引者知其上坂也􅀂柩車左邊右邊或髙下傾虧亦左右布使知道有傾虧也假令車之東轍下則抑下其及葬執纛以與匠師御柩註云翿羽葆幢也纛與翿義同鄭又引雜記云諸侯執綍五百人四綍皆銜枚司馬執鐸左八人右八人匠師執羽葆御柩孔義云羽葆者以鳥羽注於柄頭如蓋謂之羽葆葆即蓋也雜記云執羽葆是諸侯禮故匠師執之周禮執纛是天子禮故郷師執之下有執者相兼義備重校三禮喪器圖上第十八
