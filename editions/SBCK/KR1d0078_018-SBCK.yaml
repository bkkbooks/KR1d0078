front:
  text: 牀輁軸是也云軸狀如轉轔者此以漢法況之漢時名轉軸爲轔轔即輪也故士喪禮云􅂛棺用軸註云軸輁軸輁狀如􅇃軸其輪也挽而行是輪爲轔也云刻兩頭爲軹者以軸頭爲軹刻軸使兩頭細穿入輁之兩髀前後二者皆然云軹狀如長􅇃穿桯前後著金而􅀜軸焉者此輁旣云長如牀則有先後兩畔之木狀如􅇃髀厚大爲之兩畔爲孔著金釧於中前後兩畔皆然然後􅀜軸於其中言桯者以其厚大可以容軸故名此木爲桯云大夫諸侯巳上有四周謂之輴者大夫殯葬雖不用輴士朝廟皆用輁軸則大夫朝廟當用輴諸侯天子殯葬朝廟皆用輴但天子畫轅爲龍謂之龍輴大夫諸侯雖不畫轅以其皆有四周故同名爲輴案阮氏圖云輁軸與輴長一丈二尺廣四尺士漆大夫以朱飾與浴􅇃内六尺有六寸與歩相中也堅地欲直庇柔地欲句庇直則利推句庇則利發鄭玄讀庇爲刺音七賜切刺謂耒下前曲接耜者即耒靣也故賈公彦云耒靣謂之庇又云耒狀􅀂今曲柄杴又案鄭下註云耜異材據鄭意耜即金也又昜下繫云斵木爲耜者謂斵木爲受耜之處也然則除耜金也外緫謂之耒經云自庇縁其外以至於首者謂據庇下至手執句者之端逐曲量之有六尺六寸又云以弦其内者謂據庇靣至句下望直量之而有六尺與歩相中中應也故下註云耕者以田器爲度冝所謂在野度以歩以人歩或大或小恐其不平故以六尺之耒代歩以量地也􅀂兼耜金則稍長故毎量地周脫去耜而用之又匠人云耜廣五寸其庇亦廣五寸古者耜一金二耜爲耦人各執一耜爲耦人各執一耜􅀂折横覆之註云折猶􅄚也方鑿連木爲之蓋如牀而縮者三横者五無簀􅉎事畢加之壙上以承抗席賈釋云横覆之者加於壙時􅀯北長東西短是知狀如牀也陳時長者東西言覆者見其善靣在上也加在壙上時則反善靣向下云折猶􅄚藏物然加無簀者以其縮三横五以當簀處也旣夕禮云加抗席三註云席所以禦塵賈釋云旣陳抗木於折北又加抗席三領於抗木之上故云加抗席三知禦塵以抗木在上禦土其抗席在下隔抗木慮有塵向下故云禦塵然則在陳列之時抗席加於抗木之上茵又加於抗席之上及葬加折於壙口次加抗席於折上次加抗木於席上巾車職云大喪飾遣車遂廞之行之一註云廞興也謂陳駕也行之使人以次舉之以如墓一曰鸞車用䟽布爲輤鄭謂日蒨四靣有障置于四隅後鄭云輤其蓋也四靣皆有障蔽以隱翳牢肉置于椁中之四隅孔賈義云遣車謂將葬柩朝廟畢將行設遣奠意取遣奠之牲臂臑折之爲叚用此車載之遣送亡者之入壙也飾者還以金玉象革之如生存之車但麤小爲之耳知小者以其人各舉一置于椁中之四隅故也後鄭訓廞爲興即言陳駕者解廞爲陳駕也謂下車僕云大喪廞革車彼廞謂作之也此之旣言飾遣車巳是作之義更言遂廞之故以陳駕解廞也又云行之使人人以次舉如墓者雜記云遣車視牢具言車多少各如所苞牲體之數也天子太牢苞九箇遣車九乗諸侯太牢苞七箇遣車七乗大夫太牢苞五箇遣車五乗此謂當朝廟之時於始祖廟陳器之明旦大遣奠之後則以次抗舉之人各執一以如墓也一名鸞車者以遣車亦有鸞鈴故也案旣夕禮苞牲取下體註云下體脛骨象行又租實之終始也士三箇前脛折取臂臑後脛折取骼音格是一牲取三體士少牢二牲則六體也分爲二箇則一箇有二體然大夫巳上皆用太牢牲有三體凡九體大夫九體分爲十五叚三叚爲一苞凡爲五苞諸侯分爲二十一叚凡七苞天子分爲二十七叚凡九苞蓋尊者雖取三體其肉少鄭又云天子遣奠用焉牲其箇數未詳此遣奠所苞皆用左胖又車僕䟽􅀃王遣車九乗除革車廣闕苹輕五乗之外加以金玉象木四者則九乗矣今遣車特以金飾以見餘制後鄭云廣車横陳之車也闕車所用􅀘闕之車也苹猶屏也所用對敵自蔽隱之車也輕車所用馳敵致師之車也校人大喪則飾遣車之馬及葬而埋之則是塗車之芻靈與筲旣夕禮云筲三黍稷麥註云筲畚種􅀋也其容蓋與簋同一觳也賈釋云畚器所以盛種此筲與畨盛種同􅀋故舉爲況也又下記云菅筲三其實皆瀹音藥註云米麥皆湛之以湯未知神之所享不用食道所以爲敬甕
