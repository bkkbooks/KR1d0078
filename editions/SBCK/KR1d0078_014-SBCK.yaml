seq: 14
body:
  text: 也臣崇義先覽鄭圖形制如此案舊圖云於六彝之間唯雞鳥虎蜼四彝皆云刻木爲之其圖乃畫雞鳯虎蜼四物之形各於背上􅀒尊皆立一圎器之上其器三足漆赤中如火爐狀雖言容受之數並不􅀃所盛之物今見祭器中有如圖內形狀仍於雞鳯腹下别作鐡脚距立在方板爲别如其然則斝彝黃彝二器之上又何特畫禾稼眼目以飾尊乎形制二三皆非典實又案周禮司尊彝云春祠夏禴祼用雞彝鳥彝後鄭云謂刻而畫之爲雞鳯皇之形著於尊上考文審象法制甚明今以黍寸之尺依而計之口圎徑九寸底徑七寸其腹上下空徑髙一尺足髙二寸下徑八寸其六彝所飾各畫本象雖别其形制容受皆同周禮司尊彝云春祠夏禴祼用雞彝鳥彝皆有舟先鄭云尊下臺􅀂今承槃臣崇義先覽鄭圖頗詳制度其舟外􅃮朱中今以黍寸之尺審而計之槃口圎徑一尺四寸其舟髙厚各半寸槃下刻殺二等而漸大圎局足與槃通髙一尺足下空徑橫尺二寸六彝下舟形制皆同其舟足以各隨尊刻畫其􅀋以飾之此舟漆赤中唯局足内青油畫雞爲飾制度容受同雞彝用盛鬱鬯鳥彞下有舟司尊彝云春祠夏禴祼用雞彝鳥彝謂春夏將祭先於奏樂降神之後王始以圭瓉酌此鳥彝鬱鬯以獻尸祼神注云爲龍頭今以黍寸之尺計之柄長尺二寸口縱徑四寸半中央橫徑四寸兩頭橫徑各二寸又師儒相傳皆以刻勺頭爲龍頭狀又案阮氏圖􅀃蒲勺頭如鳬頭即知龍勺頭亦如龍頭明矣但以今圖與崇器内無此勺形故特圖於右用挹六彝之鬱鬯以注圭瓉王人云祼圭尺有二寸有瓉以祀廟後鄭云祼謂以圭瓉酌鬱鬯以獻尸也瓉如槃大五􅂛口徑八寸深二寸其柄用圭有流前注流謂􅈹也故下注云􅈹勺流也凡流皆爲龍口又案大雅旱麓箋云圭瓉之狀以圭爲柄黃金爲勺青金爲外朱中央凡圭􅀶三寸又肆師職云大祀用玉帛牲牷次祀用牲幣小祀用牲後鄭云大祀天地宗廟臣崇義謹詳䟽義自蒼璧以禮昊天至此圭瓉以祀宗廟於禮神玉帛牲牷之外别有燔瘞玉帛牲案明堂位云獻象周尊也司尊彝云春祠夏禴其朝踐用兩獻尊一盛玄酒一盛醴齊王以玉爵酌醴齊以獻尸也禮器曰廟堂之上犧尊在西注云犧周禮作獻又詩頌毛傳􅀃用沙羽以飾尊然則毛鄭獻沙二字讀與婆娑之娑義同皆謂刻鳯皇之象於尊其形婆娑然又詩傳䟽􅀃王肅注禮以犧象二尊並全刻牛象之形鑿背爲尊今見祭器内有作牛象之形背上各刻蓮華座又與尊不相連比其王義大同而小異案阮氏圖其義尊飾以牛又云諸侯飾口以象骨天子飾以玉其圖中形制亦於尊上畫牛爲飾則與王肅所􅀃全殊揆之人情可爲一法今與鄭義並圖於右請擇而用之象尊阮氏象尊鄭氏義酒一盛醴齊王以玉爵酌獻尸明堂位曰著殷尊也注云著著地無足今以黍寸之尺計之口圎徑一尺二寸底徑八寸上下空徑一尺五分與獻尊象尊形制容受並同但無足及飾耳壷尊受五斗周禮司尊彝云秋嘗冬烝其饋獻用兩壷尊一盛玄酒一盛盎齊王以玉爵酌獻尸注云壷尊以壷爲尊也左傳曰尊以魯壷今以黍寸之尺計之口圎徑八寸脰髙二寸中徑六寸半脰下橫徑八寸腹中橫徑一尺一寸底徑八寸腹上下空徑一尺二寸足髙二寸下橫徑九寸漆赤中舊圖文略制度之法無聞六尊用同盛受之數難異太尊山尊祭器内有刻木爲雀形腹下别以鐡作脚距立在方板一同雞彝鳥彝之狀亦失之矣臣崇義案漢書律曆志􅀃斛之制口足皆圎有兩耳而云其狀似爵又案士虞禮云賔長洗繶爵三獻尸鄭云繶爵口足之間有􅂐飾今取律曆志嘉量之􅀃厚康成解繶爵又言圖此爵形近得其實而況前代垂範觀象以制器服義非一揆或假名全畫其物或取􅀋半刻其形則雞鳥已下六彝禕䄖上音揮下音遥靑素二質是全畫其物著於服器者也觚爵柄尺之􅀋龍勺蒲勺之倫是半刻其形飾於器皿以􅀋取呼者也以此而言犧象二尊自然畫飾至於夏之九鼎鑄以象物取其名義亦斯􅀋也坫以致爵亦以承尊􅀂施於燕射之禮則曰􅞱音豐賈義云今諸經承尊爵之器不用本字之􅞱皆用豐年之豐蓋張鎰指此瓦罍爲諸臣所酢之罍誤之甚矣此瓦罍正謂祭社之太罍也又開元禮云宗廟春夏毎室雞彝一鳥彝一犧尊二象尊二山􅎆二但於罍上加一山字並不言容受之數案周禮六尊之下唯言皆有罍並無山罍瓦罍之名又不知張鎰等各何依據指此山瓦二罍以爲諸臣所酢者也況此六罍厠在六尊之間以盛三酒比於六尊設之稍逺案禮記以少爲貴則近者小而逺者大則此罍不得容五斗也又爾雅釋器云彝卣罍器也郭璞云皆盛酒尊又曰小罍謂之坎注云罍形似壷大者一斛又曰卣中尊也此欲見彝鳥上尊罍爲下尊也然則六彝爲上受三斗六尊爲中受五斗六罍爲下受一斛是其差也案詩周􅀯風我姑酌彼金罍孔䟽毛傳指此諸臣所酢之罍而受一石者也又引禮圖依制度刻木爲之又鄭注司尊彝云罍刻而畫之爲山雲之形旣言刻畫則用木矣又引韓詩􅀃士用梓無飾言其木體則士巳上同用梓而加飾耳又毛以金罍大一石禮圖亦云大一斛毛􅀃諸臣之所酢與周禮同天子用黃金爲飾今據孔賈䟽義毛鄭傳注此罍用木不用瓦受一石非五斗明矣謹以黍寸之尺依而計之口徑九寸五分脰髙三寸中徑七寸五分脰下横徑九寸底徑九寸腹中橫徑一尺四寸上下中徑一尺六寸足髙二寸下徑一尺畫山雲之形三禮尊彝圖卷第十四
