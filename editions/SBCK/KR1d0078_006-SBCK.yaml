  text: 卷第六
  hash: sha256:5795b6d61219d8f5b6dae3dfdce86952e0a56956870ee55267ebe1433aa93901
body:
  text: 通議大夫􅀦子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注虎侯熊侯豹侯熊侯畿內諸侯麋侯畿內有采地卿大夫所射大侯畿外諸侯所射糝侯豻侯五正侯三正侯二正侯射之所起在於黃帝故昜繫黄帝九事云古者弦木爲弧剡木爲矢弧矢之利以威天下又世夲以黄帝臣揮作弓夷牟作矢是弓矢起於此矣虞書曰侯以明之傳云當行射侯之禮以明善惡之教則射侯見於堯舜夏殷無文至周大備故禮有天子諸侯卿大夫大射賔射燕射之文各張其侯郷射記曰君國中射注云國中城中謂燕射也於郊謂大射也於竟音境謂與鄰國君射即賔射也天官司裘王大射則共音供虎侯熊侯豹侯設其鵠古毒反此所謂皮侯也皮侯者謂用虎熊豹之皮各飾侯側亦方制其鵠王將祀天地祭宗廟以射選諸侯卿大夫士所射之侯也又夏官射人王以六耦射五正三正二正之三侯者謂來朝諸侯賔射之侯也又郷射記云凡侯天子熊侯白質諸侯麋侯赤質大夫布侯畫以虎豹士布侯畫以鹿豕此獸侯者燕射所張之侯也凡侯以嚮堂爲靣侯道九十弓者用布三丈六尺此謂大侯也大侯上箇讀爲抯公幹之幹下箇各二丈八尺上箇最上幅下箇最下幅也三丈六尺各除左右岀舌而言也中丈八尺大射量人量侯道以貍歩注云貍之伺物毎舉足者止視逺近爲發必中也是以量侯道取象焉又郷射記云侯道五十弓弓二寸以爲侯中者以考工記弓之下制六尺與歩相應弓者侯之所取數冝於射器故侯道取於弓也古者布幅廣二尺二寸以二寸爲縫諸幅皆以二尺計之此侯九十弓弓二寸以爲侯中二九十八故中丈有八尺也侯中用布九幅幅有丈八尺緫十六丈二尺倍中以爲躬躬身也上躬上接上箇下接中下躬上接中下接下箇皆三丈六尺與上箇下箇緫十四丈四尺倍射以爲左右舌此謂最上幅通數七丈二尺者也左右舌即上兩箇也在躬兩傍謂之箇左右出謂之舌躬外兩廂各出丈八尺下舌半上舌左右各出九尺上舌則半岀於躬下舌上下舌共五丈四尺通上二揔共用布三十六丈也上綱與下綱出舌尋縜寸音筠綱者所以繫侯於植者也上下各出舌一尋者亦人張手之節也縜者籠綱維持侯者也亦謂之維故鄭云其邪制躬舌之角者爲維亦曰維耳舊圖唯著三侯取法不盡雖䌓解􅀃難辨指歸今於三侯之外更増十二件通前十五侯分爲上下卷所以盡正鵠之差見皮首之狀依經申義煥然可觀又舊圖云上紐皆十二下紐皆十而三侯數同此􅀃亦失知者九十七十五十弓之侯丈尺廣狹不同縜紐籠繫宜異今三侯一揆何所據乎且以大侯上舌七丈二尺以十二紐所􅀃計之上舌兩端共使四紐餘有八紐布在七丈二尺之間每九尺一紐則侯之緩縱上下不停旣非正文今亦不取其其侯道九十弓弓二寸以爲侯中中亦身也侯身廣丈八尺三分其侯而鵠居一焉則鵠方六尺矣此王之所射之侯也與梓人張皮侯而棲鵠共爲一事侯制上廣下狹蓋取象於人張臂八尺張足六尺是取象率焉樂以騶虞九節王大射司裘亦供熊侯此助祭諸侯所射之侯也亦以熊皮飾侯側兼方制其鵠侯道七十弓弓二寸以爲侯中廣丈四尺亦三分其侯而鵠居其一則鵠方四尺六寸大半寸者賈釋云以侯廣丈四取丈二三分之得四尺又於四尺之内取尺八寸得六寸有二寸在寸爲三分二寸揔六分取二分二分於三分爲三分寸之二也三分寸之二即是大半寸也故云鵠方四尺六寸大半寸又梓人爲侯廣朝崇方崇髙也上下爲崇横度爲廣鵠方三尺三寸少半寸者賈釋云以侯廣一丈內取九尺得三尺一尺取九寸得三寸一寸分爲三分取一分則一分於二分爲三分寸之三分寸之一則是少半寸故云鵠方三尺三寸少半寸也謂之鵠者取名於鳱鵠上古寒切下古沃切鳱鵠小鳥捷􅃛難中是以中之爲儁而取鵠之言較者直也射所以直巳志虎熊豹示伏猛言能伏得猛厲諸侯也麋者迷也以麋皮爲侯示能討擊迷惑之諸侯也射者大體故於三侯之上取義衆多又侯道九十七十五十弓逺近三等者以人有尊卑分爲三節尊者射逺卑者射近故也射人云􅀌卿大夫樂以采蘋五節士樂以采蘩五節士無大射而有賔射燕射之禮以士無臣可擇故無大射之禮司裘云諸侯則供熊侯豹侯此謂畿內諸侯大射將祀先祖亦與羣臣射以擇士熊侯則諸侯自射者也豹侯所選助祭臣下所射者也亦以熊豹皮各飾其侯側方爲之鵠其侯道鵠居皆與王之熊侯豹侯同㰍侯畿内有采地卿大夫所射大侯畿内諸侯所射司裘云卿大夫則供麋侯此謂王朝卿大夫畿內有采地者將祭先祖示行大射之禮張麋侯君臣共射焉亦以麋皮飾侯側又以皮方制其鵠著于侯中其侯道亦五十弓侯廣鵠方丈尺之數亦與王之豹侯同畿外諸侯將祭先祖亦行大射而射三侯與天子同畿内諸侯近尊不得同於天子三侯但射二侯而巳畿外諸侯逺尊故得申也三侯雖同而用皮別耳即大射大侯九十參侯七十干侯五十是也大射直言九十七十五十不云弓者案郷射記注云大侯九十弓糝侯七十弓豻侯五十弓是有弓可知也又大射注云參讀曰糝糝雜也干讀曰豻豻胡犬也畿外諸侯自射大侯即熊侯也云大侯者與天子大侯同九十弓也其糝侯助祭者所射也大侯與天子雖同其糝豻二侯用皮爲别糝侯豻侯此二正五十弓之侯亦三分其侯正居其一二正之侯又去白青直用朱緑而巳還用朱緑二色畫雲氣以飾其側此卿大夫聘㑹於王共射之侯也三禮射侯圖上卷第六
