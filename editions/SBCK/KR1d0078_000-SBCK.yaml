front:
  text: 新定三禮圗序
  hash: sha256:7cce71020d85711bcf1ebcdcf5700ad6a05deebac8403d25ca40c3d2ff89664c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1d0078_SBCK_000-1a}
body:
  text: 通議大夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注昔者秦始皇之重法術而天下貴刑名魏文帝之惡方嚴而人間尚通變上之化下下必從焉是以􅀟劒崇節飛白成俗挟琴飾容赴曲増抃自然之道也周世宗暨今皇帝恢堯舜之典則緫夏啇之禮文思隆大猷崇正舊物儀形作範旁詔四方常恨近代以來不能慕逺無所􅁵革溺於因循傳積丗之漸訛爲千載之絶軌去聖遼夐名實謬乖朱􅂵混淆鄭雅交雜痛心疾首求以正之而名儒嚮風適其所願國子司業兼太常博士聶崇義垂髦之嵗篤志於禮禮經之内㳺刃其間每謂春秋不經仲尼耻是􅀜雎既亂師摯憫之今吉㓙之容禮樂之噐制度舛錯失之甚焉施之於家猶曰不可朝廷之大寕容濫瀆御名欲正失於得返邪於正潜訪同志定其禮圗而所學有淺深所見有差異作舎道側三年不成衆口云云何所不至㑹國朝創制彛噐迨扵車服乃究其軌量親自規模舉之措之或㳂或革從理以變惟適其本時之學者曉然服義於是博采三禮舊圗凡得六本大同小異其猶面焉至當歸一之言豈容如是吾誰適從之歎盖起於斯何以光隆於一時垂􅁉於千古遂鑚研尋繹推較詳求原始以要終體本以正末躬命繢素不差豪􅁵率文而行恐迷其形以圗爲正則應若宫啇凡舊圗之是者則率由舊章順考古典否者則當理彈射以實裁量通者則惠朔用其互聞吕望存其兩􅀃非其學無以臻其極非其明無以宣其象遵其文譯其噐文象推合略無差較作程立制昭示無窮匪哲匪勤理無攸濟既勤且哲何􅆡不通有以見臨事盡心當宫御物官不同事人不同能得其能則成失其能則敗禮圗至此能事盡焉國之禮事之體既盡羙矣物之紀文之理又盡善矣其新圗凡二十卷附於古今通禮之中是書纂述之􅀄詔儼緫領其事故作序焉新
