front:
  text: 析城鄭氏家塾重校三禮射侯圖卷第七
  hash: sha256:d66dda191407a6196982b32947c767b6de1e07bb7814d842e7bf47cdace8c764
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1d0078_SBCK_007-1a}
body:
  text: 通議大夫􅀦子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注獸侯熊首獸侯麋首獸侯虎豹首獸侯鹿豕首鼓足建鼓鼗鼓雷鼓靈鼓路鼓鼖鼓鼛鼔音臯晉鼓金錞金鐲金鐃金鐸兵舞赤楯玉戚帗舞羽舞皇舞獸侯熊首雷鼓大司徒鼓人聀曰雷鼓鼓神祀後鄭云雷鼓八靣鼓也神祀祀天神也賈釋云但是天神皆用雷鼓靈鼓靈鼓鼓社祭後鄭云靈鼓六靣鼓也社􅀕􅀕地祗也賈釋云但是地祗皆用靈鼓鼖鼓兩靣鼓鼓人聀曰鼖鼓鼓軍事注云大鼓曰鼖長八尺案韗人云鼓長八尺鼓四尺謂鼓面也中圍加三之一謂之鼖鼓注云中圍加三之一者加於靣之圍以三分之一也靣四尺其圍十二尺加以三分之一四尺則中圍十六尺徑五尺三寸三分寸之一也今亦合十二板穹六寸三分寸之二耳即鏄師云凡軍之夜三鼜皆鼓之守鼜亦如之即此鼖鼓也故注云守鼜備守鼓也鼓之以鼖杜子春曰一夜三擊備守鼜也又瞽矇注杜讀鼜爲憂戚之戚謂夜戒守鼓也擊鼓聲疾數故曰戚又鼓人曰凡軍旅夜鼓鼜司馬法曰昏鼓四通爲太鼜夜半三通爲晨戒旦明五通爲發㫬軍動則鼓其衆注云動且行俱謂鼓鼖鼓也鼛鼓音臯鼓人聀曰鼛鼓鼓役事注鼓長丈二尺案韗人云爲臯鼔長尋有四尺鼓四尺倨句磬折注以臯鼓鼓役事磬折中曲之不參正也中圍與鼖鼓同以磬折爲異晉鼔金鐸鼓人以金鐸通鼓注鐸大鈴也振之以通鼓夏官司馬執鐸謂兩司馬執振之以通鼓兩司馬者二十五人之長也樂記曰天子夾振之注云王與大將夾舞者振鐸以爲節也赤楯朱干也玉戚羽舞皇舞案舞師注云羽析白羽爲之形如帗陳宛丘詩曰無冬無夏值其鷺羽值者持也鷺羽即鷺翿翿翳也謂舞者所持以指麾又蔽翳其身也樂師注云皇謂雜五采羽如鳯皇色持以舞籥師掌教囯子舞羽吹籥􅀕祀則鼓羽籥之舞注云鼓之者􅁪爲之節也又舞師掌教羽舞帥而舞四方之􅀕祀教皇舞帥而舞旱暵之事注云四方􅀕謂四望旱暵謂雩也暵謂􅀬氣音漢三禮射侯圗卷第七析城鄭氏家塾重校三禮弓矢圗卷第八通議太夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注
