seq: 9
body:
  text: 案巾車王乗玉路建太常十有二斿以祀又覲禮注云王建太常縿首畫日月其下及斿交畫􅂛龍降龍縿皆正幅用絳帛爲質斿則屬焉又用弧張縿之幅又畫枉矢於縿之上故輈人云弧旌枉矢是也凡旌旗之上皆注旄與羽於竿首故夏采注云緌以旄牛尾爲之綴於幢上其杠長九仞其斿曳地又左傳云三辰旂旗昭其明也據杜鄭二注皆以三辰爲日月星蓋太常之上又畫星也阮氏梁正等圖旂首爲金龍頭案唐志云金龍頭銜結綬及鈴緌則古注旄及羽於竿首之遺制也翿旌者雜用白羽朱羽以爲之案郷射記國君行燕射於城中命獲者執旌於乏南東靣偃旌而立􅀱射中者則舉旌而大聲言獲獲得也射者講武田之􅀋是以中爲獲也又上文云旌各以其物無物則以白羽與朱羽糅杠長三仭以鴻脰韜上二尋注云雜帛爲物大夫士之所建也不命之士無物此旌即翿旌也糅雜也杠橦也鴻鳥之長脰者且國君自有其旌而用不命之士旌者以其燕主歡心故用之也必以翿爲旌者尚文德也賈釋云以文德者舞文舞羽舞也以武德者舞武舞干舞也此翿旌旣用羽爲之故取尚文德也玉輅玉輅序巾車掌王之五輅玉金象革四輅其飾雖異其制則同今特圖玉輅之一兼太常之旂以備􅀕祀所乗其餘車式皆具考工記别録於下則輪軹之崇轛輢之狀輻內輻外之制大穿小穿之殊蓋之所居釳音迄之所在􅀂誠心觀之則諸輅皆可知矣考工記云乗車之輪六尺有六寸注云乗車玉路金路象路也軹崇三尺有三寸加軫與轐七寸共四尺人長八尺登下之以爲節也轐輿下伏兎也罔圍一尺一寸不􅃮其踐地者轂長三尺二寸圍徑一尺三分寸之二車藪空徑三寸九分寸之五大穿空徑四寸五分寸之二小穿空徑二寸十五分寸之四輻廣三寸半轂輻內九寸半輻外一尺九寸輻近罔處廣二寸六分寸之二轂鑿受輻􅀷三寸半又輿人云輪崇車廣衡長俱六尺六寸輿長四尺四寸式􅀷一尺四寸叄分寸之二式之髙二尺三寸較髙五尺五寸賈䟽云較今之平隔也孔䟽云式上二尺二寸别横一木謂之較輿後横木謂之軫圍尺二寸式圍七寸叄分寸之一較圍四寸九分寸之八軹圍叄寸二十七分寸之七轛圍二寸八十一分寸之十四轂輿皆以革鞔􅃮之玉路以玉飾諸末輈深四尺有七寸輈之長丈四尺四寸輈圍一尺四寸五分寸之二輈之頸圍九寸十五分寸之九頸當持衡之處輈之踵圍七寸七十五分寸之五十一踵承輿横軫者衡任圍一尺三寸五分寸之一任正圍尺四寸五分寸之二任正者輿下三靣材也節服氏六人與王同服衮冕掌􅀕祀朝覲維王之太常戈戈廣二寸内倍之胡三之援四之注云戈今之句孑㦸或謂之雞鳴或謂之擁頸內謂胡以內接柲者也長四寸胡六寸援八寸援直刃也胡其孑也廣二寸謂胡也其實援亦廣二寸䟽云胡子横歃微邪向上不倨不句似磬之折殺也重三鋝鋝重六兩大半兩三鋝重一斤四兩柲長六尺六寸㦸㦸廣寸半内三之胡四之援五之倨句中矩與刺重三鋝注云㦸今三鋒㦸也内長四寸半胡長六寸援長七寸半三鋒者胡直中矩言正方也刺者著柲直前如鐏者也㦸胡横貫之胡中矩則援之外句磬折與柲長一丈六尺三禮旌旗圖卷第九析城鄭氏家塾重校三禮玉瑞圖卷第十通議大夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注
