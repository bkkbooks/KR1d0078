front:
  text: 聶崇義集注
  hash: sha256:bd4776975df744fa026537af5285b5256104e6c43316173ac1ce252220b44df4
body:
  text: 掩幎目鬠笄冒衾衿夷衾小斂絞大斂絞明衣明衣裳握手纊極決飯珠含貝浴盤夷盤夷牀浴牀組圭重銘旌􅆱并牘􅀛燋音雀楚焞焞即焌俱音鐏掩按士喪禮云掩練帛也廣終幅長五尺析其末作此掩也其布幅二尺二寸凡用布皆削去邊幅旁各一寸爲二尺計之此則不削幅但繚之使相著爲二尺二寸云長下􅂰者謂制此衣長至􅂰下亦有裳前三幅後四幅不辟積􅆎間下至足跗亦不􅀍土也此不辟積􅆎間者以其一幅不動不假上狹下寛也今亦用生絹爲衣裳其衣大䄂與衣齊别以玄純領䄂其裳亦前三後四以纁純腰襴即士喪禮下篇云縓綼緆是裳之飾也緇純即此衣之飾也彼註云一染謂之縓今之紅也飾裳在輻曰綼在下曰緆緇也謂純領與􅃑也衣以緇裳以縓象天地也握手士喪禮云握手用玄纁裏長一尺二寸廣五寸牢中旁寸著組繫賈釋註云牢讀爲樓樓謂削約握之中央令狹小以安手之四指也以經云長尺二寸廣五寸樓去中央兩旁各一寸則中央廣三寸在於三寸中央湏容四指毎指一寸則中央兩邊各去四寸方安得手之四指於四指外仍共有八寸皆廣五寸又下記云握裏親膚繫鈎中指結于掔烏亂切鄭註云掔掌後節中也此據手内置之故言握裏親膚旣手内置之握長尺之寸中掩之手􅂊相對也兩端各有組繫先以一端繞掔一帀還從上自貫又以一端向上鈎中指反與繞掔者結於掌後節中然手無決者以握或云如平生以藻玉恐非纊極決士喪禮云貝三實于笲稻米一豆實于筐註云貝水物古者以爲貨江水出焉笲竹器名賈義云此貝三下有稻米則士飯含用米具也故檀弓云飯用米貝亦據士也此皆諸侯之士知者案喪大記君沐􅆝大夫沐稷士沐􅆝鄭以爲天子之士又云天子沐􅁰與然則天子之士含亦用􅆝天子飯用􅁰米明矣則諸侯飯用􅆝天子諸侯大夫同用稷也旣士飯用米貝不言兼有珠玉大夫巳上飯米兼珠玉也案典瑞云大喪供飯玉含玉是天子飯含用玉也又雜記云天子飯九貝巳下者鄭以爲夏殷禮也又雜記云含者執璧彼據諸侯也貝水物也岀於江淮故書傳云紂囚文王散冝生於江淮之間取大貝如車渠以獻於紂是貝出江淮也漢書食貨志有大貝牡貝之等以爲貨用是古者以貝爲貨於溝渠之兩畔稍髙爲眉琢故以組穿聮六玉溝琢之中以斂屍也其圭在左巳下皆約大宗伯青圭以禮東方之等以屍􅀯首而置此六玉然也䟽云璧琮通於天地者置璧於背以其屍仰璧在下也置琮於腹是琮在上也而不􅀋者以背爲陽以腹爲隂故隨屍腹背而置之天地爲隂陽之主人之腹背象之故䟽璧琮以通天地也士喪禮云重木刋鑿之甸人置重于中庭三分庭一在􅀯註云木也縣物焉曰重刋斵治之也鑿之爲縣簮孔士長三尺賈釋云木也縣物焉曰重者解名木爲重之意以其木有物縣於下相重累故得名重云簮孔者下繫用靲音琴靲即䈼音篾也䈼者竹之青皮以䈼貫二鬲内此孔中言簮者􅀂冠之簮使冠連屬於紒音髻此用靲䈼貫鬲連屬内於重木之孔故云簮孔又曰夏祝鬻餘飯用二鬲于西牆下註云夏祝祝習夏禮者也鬻餘飯謂以飯屍餘米爲鬻者也其鬲用䟽布炙塞其口以䈼屬於重幂用葦席謂以席覆重辟屈而反兩端交于後在祍西端在上此據人北靣以席先於重北而向南掩之於後以東端爲下向西西端爲上向東是爲辟屈而反兩端交於後爲左祍然後以䈼加束之結於後也賈釋云士重三尺則大夫巳上各有差當如銘旌之杠士三尺大夫五尺諸侯七尺天子九尺據竪者言之其横者冝半之雜記曰重旣虞而埋之註云就所􅀝處埋之也檀弓曰重主道也孔義云謂始死作重猶􅀂吉祭木主之道也吉祭木主所以依神在喪作重亦以依神故云主道也重起於殷代以含飯餘粥以鬲盛之名曰重今之粮甖即吉重之遺象也所以須設重者􅀑神或依飲食孝子兾親之精有所慿依也又鄭註士喪禮云士二鬲大夫四諸侯六天子八與簋同差者以其與簋同是飯食之道故也王者八簋故八重置於西階下三分庭一在􅀯竪一木長九尺午逹横鑿穿爲四孔貫四横木毎一横縣二鬲四横八鬲諸侯七尺三横六鬲大夫五尺二横四鬲士三尺一横二鬲並覆以䟽布裏以葦席而後代重與韋席爲二物重隨柩入壙横木等與葦席爲凶銘旌檀弓曰銘明旌也以死者爲不可别也故以其旗識之註云明旌神明之旌也士喪禮云爲銘各以其物周禮司常大喪則供銘旌註云王則太常又案司常職云王建太常諸侯建旂􅀌卿建􅎶大夫士建物則銘旌亦然但尺數異耳禮緯云天子之旌髙九仞諸侯七仞大夫五仞士三仞其士喪禮竹杠長三尺則死者以尺昜仞也天子九尺諸侯七尺大夫五尺士三尺其旌旗身亦以尺昜仞也又從遣車之差蓋以喪事略故也􅀂不命之士則士喪禮云以緇布半幅長一尺也頳其末長終幅長二尺也緇頳共長三尺廣三寸書銘于末曰某氏某之柩竹杠長三尺置于宇西階上註云杠銘幢也宇梠也音吕梠者端連綿木也􅆱將葬筮宅冢人營之註云宅葬居也營猶度也掘四隅外其壤掘中􅀯其壤爲葬將北首故也旣朝􅂘主人皆往兆􅀯北靣免絰兆所營域也免絰者求吉不敢純凶命筮者在主人之右命辭冝右純筮者東靣抽上韇兼筴執之􅀯靣受命曰哀子某爲其父某甫筮宅度玆幽宅兆基無有後艱度謀兹此基始也言爲父筮葬居今謀此以爲幽􅁳居兆域之始得無後將有艱難乎艱難謂有非常􅀂崩壞筮人許諸不􅄒命右還北靣指中封而筮之畫地識卦者在左旣受命而申言之曰􅄒不者士禮略也中封者中央壤也卒筮執卦以示命筮者及主人命筮者受視反之東靣旅占卒又進告于命筮者與主人占之日從猶從吉也􅀂不從更擇地筮如初儀桉上大夫巳上至天子卜而不筮故雜記云大夫卜宅與葬日下大夫與士則筮宅卜日此經是也又賈釋云不􅄒命士各士禮略者但士禮命筮辭有也吉服玄端占者三人掌玉瓦原三兆者也在塾西者􅀯靣東上席卜者于闑西閾外宗人告事具主人北靣免絰左擁之涖卜即位于門東西靣涖卜族長也更西靣者當代主人命卜卜人從塾上抱􅀛燋向閾外先奠􅀛于席上西首復奠燋在􅀛北旣奠燋又執􅀛以待之謂授宗人也故宗人受卜人􅀛示髙以􅀛腹甲髙起所當灼處以示涖卜也涖卜受視反之宗人還少退受涖卜者命命曰哀子某來曰某卜葬其父某甫考降無有近悔註云考登也鄭註周禮訓登爲上降下也言卜此日葬神之上下得無近於咎悔乎言􅀑神之上下緫指一切神無所偏指也咎悔亦謂墳冢有所崩壞也宗人許諾不􅄒命授卜人􅀛􅀒東扉立俟􅀛之兆卜人坐作􅀛興作猶灼也興起也宗人受􅀛示涖卜涖卜受視反之宗人宗人却受􅀛退東靣旅占卒不釋􅀛告于涖卜與主人占曰某日從不釋􅀛復執之重定三禮襲斂圖卷第十七
