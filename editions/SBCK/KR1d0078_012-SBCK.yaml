front:
  text: 析城鄭氏家塾重校三禮匏爵圖卷第十二
  hash: sha256:3103556da357f595126ed69e46c6b83c4e55e9bb67caa4f80ffa29a707b404da
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1d0078_SBCK_012-1a}
body:
  text: 通議大夫􅀦子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注匏爵瓦甒有盖蜃尊槪尊散尊大罍有盖大璋瓉中璋瓉邊璋瓉方壷圎壷酒壷罋䟽勺蒲勺爵觚觶角散觥豐棜陳饌棜禁覆饌巾篚有盖筥大筐小筐竹簋方有盖匏爵瓦甒有盖蕡膴鮑豆薦血腥醯醢瓦大瓦甒以盛五齊酌用匏爵而巳其匏爵遍檢三禮經注孔賈䟽義及開元礼崔氏義宗唯言破匏用匏片爲爵不見有􅃮飾之文諸家礼圗又不圗􅀃但陶匏是太古之器歷夏殷周隨所損益禮文不墜以至于今其間先儒不言有飾盖陶者資火化而就匏乃非人功所爲皆貴全素自然以象天地之性也案郊特牲䟽云􅀕天用瓦大瓦甒盛五齊舊圗云醴甒以瓦爲之受五斗口徑一尺脰髙二寸大中身兊下平底今依此以􅁰尺計之脰中横徑冝八寸腹横徑一尺二寸底徑六寸自脰下至腹横徑四寸自腹徑至底徑深八寸乃容五斗之数與瓦大并有盖蜃樽槪樽之數此蜃尊旣舊無圗載未詳蜃狀有監丞李佐堯家在湖湘斈亦該覧以聀分咨訪果得形制形制容受如蜃尊臣崇義按鬯人聀云凡祼事用槪祼音埋後鄭云槪􅃮尊以朱帶者賈義云槪尊朱帶玄纁相對旣是黒􅃮爲尊以朱絡腹故名槪尊取對槪之義也大宗伯云貍音埋沈􅀕山林川澤後鄭又云􅀕山林曰貍川澤曰沈然則貍沈之􅀋皆用槪尊散樽大罍有盖散尊形制容受如槪尊臣崇義按鬯人聀云凡疈事用散尊後鄭云散􅃮尊無飾曰散賈義云對槪蜃獻象等曰尊各有異物爲飾言此散尊唯􅃮而巳别無物飾故曰散大宗伯云疈辜􅀕四方百物後鄭又云疈疈牲􅇩也賈䟽云此無正文盖見當時疈磔牲体者皆從􅇩臆疈析之言此疈辜謂披析牲體磔禳及蜡􅀕也蜡􅀕百神與四方百物是其一事如此之􅀋乃用散尊大罍有盖􅀕社尊也鬯人云凡􅀕祀社壝用大罍注大罍瓦罍也賈䟽云壝謂委土爲墠墠内作壇而􅀕也􅀂三壇同墠之􅀋此經與封人及大司徒皆云社壝者但直見外壝而言也知大罍是瓦罍者瓬人爲瓦簋據外神明此罍亦用瓦取質略之意經及䟽并阮氏圗並不言三璋各有文飾惟後鄭云大璋加文飾中璋殺文飾邊璋半文飾但解三璋得名大中邊之義都不言文飾之物又按昜文言曰雲從龍風從虎又聘義􅀃玉之十德其一曰氣如白虹天也言玉之白氣明天之白氣也然則璋瓉旣以勺􅈹爲龍首其二璋半巳下皆冝瑑雲氣以爲飾其祼圭半巳下亦宜瑑鏤雲氣以飾之􅀂􅀕宗庿皇后亞獻即执此璋瓉以祼尸后有故則大宗伯執以亞祼中璋九寸其勺口徑亦四寸􅈹射寸數外内金色皆如大璋其文飾則殺焉天子廵守所過中山川殺牲以祈沈宗祝亦先用此中璋之勺酌酒以禮其神今按阮氏梁正圗内三璋之勺及祼圭所􅀃節略多不依經故後人圗􅀞皆失形制其圭勺之狀有如書䇶者有如羮魁舊圗云圎壷受一斛腹方口足皆圎畫雲氣又燕礼云司宫尊士旅食于門西兩圎壷鄭義以士旅食者用圎壷變於卿大夫用方壷也旅衆也士衆食者未得正禄所謂庻人在官者謂府史胥徒也士大夫巳上皆得正禄則王制云下士九人禄中士倍下士上士倍中士下大夫倍上士之等皆是正禄此云所謂王制文云庻人在官者其禄以是爲差謂府八人禄史七人禄胥六人禄徒五人禄皆非正禄號爲士旅食者也舊圗云方壷受一斛腹圎足口皆方按燕禮云司宫樽于東楹之西兩方壷左玄酒東上注云尊方壷爲卿大夫士也臣道直方故設此尊舊圗與下圎壷皆畫雲氣案周􅀯國風云我姑酌彼兕觥傳云兕觥角爵也箋云觥罰爵也孔䟽云兕似牛一角青色重千斤以其言兕必用兕角爲之觥者爵名故云角爵毛云兕觥角爵言其體也鄭言觥罰爵解其用也言兕表用其角言觥以顯其罰二者相挾爲義焉舊圖云觥大七􅂛以兕角爲之先師􅀃云刻木爲之形似兕角蓋無兕者用木也䟽云觥亦五􅂛所以罰不敬又許愼謹案觥罰有過一飲而盡七􅂛爲過多也由此言之則觥是爵觚觶角散之外别有此器故禮器曰宗廟之祭貴者獻以爵賤者獻以散尊者舉觶卑者舉角特牲二觚二爵四觶一角一散不言觥然則觥之所用正禮所無不在五爵之例夫斯禁亦無足似此木輿之棜故周公制禮或因名此斯禁爲棜耳故少牢禮云司宫尊兩甒於房户間共棜是周公之時巳名斯禁爲棜也又注云棜無足禁者酒戒也大夫去足改名優尊者也􅀂不爲之戒然今士禁有局足髙三寸但禮文棜禁相叅而有足無足爲異舊圖云覆饌巾士大夫以緇布頳裏諸侯天子以玄帛纁裏篚有篕筥舊圖云篚以竹爲之長三尺廣一尺深六寸足髙三寸如今小車笭臣崇義又案士冠禮云篚實勺觶角柶注云篚竹器如笭者少牢禮亦云勺爵觚觶實于篚又郷飲酒記云上篚有三爵􅀄主人獻賔及介又獻衆賔獻酬訖乃以爵奠于上篚又于上篚取他爵獻工與笙訖乃奠爵于下篚或有大夫來乃于上篚取大夫爵而獻大夫訖亦奠于上篚又燕禮及大射􅀃君臣異篚其單言篚者臣篚也言膳篚者君篚也注云膳篚者君象觚所饌也此明非獨君篚名膳其觚亦用象飾也又有玉幣之篚又士虞禮有盛食之篚錯于尸左尸飯播餘于篚古者飯用手􅀂吉時食則播餘于蓋又佐食以魚猪肺脊皆實于篚以此言之篚云又有蓋也采蘋詩傳曰圎曰筥受半斛主君致饔餼於賔與大夫二􅂛此用竹而方故云如簋而方受亦斗二􅂛如今寒具筥者謂實以冬食故云寒具筥但筥圎而此方以是爲異案玉人云案十有二寸􅀥栗十有二列注云王后勞朝諸侯皆九列聘大夫皆五列則十有二列者勞二王之後也后勞法有玉案并有竹簋方以盛􅀥栗加於桉上故彼引此爲證此謂諸侯夫人勞聘卿大夫故無案但有竹簋以盛􅀥執之以進三禮匏爵圖卷第十二
