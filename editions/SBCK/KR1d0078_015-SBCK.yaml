front:
  text: 析城鄭氏家塾重校三禮喪服圖上第十五
  hash: sha256:7d098f6a503e7e40e6379177585ef4c147e81fa6201fddb81f692bb071cd146b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1d0078_SBCK_015-1a}
body:
  text: 通議大夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注斬衰衣斬衰裳斬衰祍苴絰􅆎絰絞帶斬衰冠冠繩纓苴杖菅屨􅀝廬附喪者鄭目録云不忍言死而言喪也以喪是棄亡之辭􅀂全存居攸棄亡於此也案曲禮云天子曰崩諸侯曰薨大夫曰卒士曰不禄庶人曰死又爾雅云崩薨卒不禄皆死也是士巳上各爲義稱庶人言死得其緫名又鄭注曲禮云死言澌也精神澌盡也左傳魯昭公出居乾侯齊侯唁公於野井公曰喪人其何稱是喪爲棄亡之辭􅀂親棄於此而有存於彼是孝子不忍言父母精神盡也服者言死者旣喪生者制服但貌以表心服以表貌故禮記間傳曰斬衰何以服苴苴悪貌也所以首其内見諸外也斬衰貌􅀂苴齊衰貌􅀂枲大功貌􅀂止小功緦麻容貌可也然周公設經上陳其服下列其人此言父與諸侯爲天子者是下人爲服上服者也先言父者此章恩義並設忠臣出孝子之門義由恩岀故先言父也傳曰齊衰大功冠其受也然斬衰亦冠衣相受何者凡喪制服所以表哀哀有盛時殺時其服乃隨哀隆殺故初服麁悪至葬後練後大祥後漸細加飾是以冠受斬衰裳初三􅂛冠六􅂛旣葬以其冠受受衰六􅂛冠七􅂛小祥又以冠爲受受衰七􅂛冠八􅂛此是葬後祥後皆更以輕服受之故有受冠受服之名其降服齊衰初死衰裳四􅂛冠七􅂛父卒爲母亦四升七􅂛旣葬以其冠爲受受衰七􅂛冠八􅂛正服齊衰五􅂛冠八􅂛父在爲母爲妻俱禫杖及不杖者皆五􅂛八􅂛旣葬其冠爲受受衰八􅂛冠九􅂛義服齊衰六􅂛冠九􅂛旣葬以其冠爲受受衰九􅂛冠十􅂛降服大功衰七􅂛冠十􅂛旣葬以其冠爲受受衰十􅂛冠十一􅂛正服大功衰八􅂛冠十􅂛旣葬衰十􅂛冠十一􅂛義大功衰九􅂛冠十一􅂛旣葬衰十一􅂛冠十二􅂛以其初喪冠􅂛數皆與旣葬衰􅂛數同故云衰齊衰大功冠其受傳又曰小功緦麻冠其衰者謂降服小功衰冠皆十􅂛正服小功衰冠皆十一􅂛義服小功衰冠皆十二􅂛緦麻十五􅂛抽其半而七􅂛半衰冠􅂛數亦同斬衰衣斬衰裳斬衰至虞卒􅂘其衰六􅂛後袧曰三尺三寸先王未有麻絲衣其羽皮注云此上古之時也下云後聖有作謂黄帝也是黄帝時始治絲麻以爲布帛是時但以邊幅向外縫之於體爲便先知爲上者謂先知縫布衣向外以便體爲上也後知爲下者謂後知邊幅向内縫之比於向外覩之爲善稍似有飾故云後知爲下也後代聖人昜之以衣幅外殺裳幅三袧者爲喪服唐虞巳上冠衣皆白布吉凶同齊則緇之三代改制更制牟追章甫委貌爲行道朝服之冠其朝􅀕冠服皆辟積無數喪之冠裳但三襵耳緇布冠三代皆爲始冠之冠白布冠質乃爲喪冠􅀂然此言後丗聖人指夏禹身以其三代改先故也􅀒廣岀於適寸適者辟領也與闕中共一尺六寸􅀒用布方廣尺有八寸故得出適兩傍各寸也􅀒布縫於領下下垂放之以其置在背上故得􅀒名適音的適􅀶四寸出於衰者以衰長六寸􅀶四寸綴於外衿之上廣長當心􅀶即廣也適在􅀜領之外各廣四寸與闕領共有一尺六寸闕即領闕中也故兩適向前與衰相望兩傍各岀六寸適即辟領也故鄭注云前有衰後有􅀒左右有辟領者孝子哀戚無所不在也賈釋云衰之言摧也衰當心者明孝子有哀摧之志也􅀒在後者以其􅀒荷悲哀在於背也左右辟領謂之適者以哀戚之情當有指適縁於父母不兼念餘事以示四處皆有悲痛是其哀戚無所不在也衣自領至衣􅆎二尺二寸兩身前後四尺四寸此據脊縫一傍前後而言也兩傍共有八寸八寸加闕中與辟領尺有六寸然則此除祛􅃑衰􅀒四物唯計衣身而言凡用布一丈四寸闕中謂闕去中央安項處當脊縫兩廂緫闕去八寸􅀂去一廂則止去四寸􅃑者衣身兩傍岀者也故下云􅃑屬幅亦明與衣不别幅也􅃑屬幅而不削屬猶連也􅃑與衣身同是一幅連幅者謂整幅二尺二寸也言􅃑據從身向祛而稱也言衣據從上向腋下而云也凡用布爲衣及射侯皆折邊幅一寸爲縫殺今云屬連其幅則是不削去其邊幅取整幅爲􅃑也必不削幅者欲取與衣二寸同也􅃑所以連衣身者明兩􅃑與衣身參齊也兩傍􅃑與中央衣身緫爲參事下畔皆等謂􅃑與衣身俱二尺二寸事幅足以容中人之肱􅀷衣去􅃑中可以運肘是也􅃑尺二寸足以容中人之併兩手也吉時拱尚左手喪時拱尚右手是併兩手也祛䄂口也然則祛􅃑相接之處􅃑冝漸殺五寸令小祛令漸侈五寸令寛與今時喪服祛􅃑似異矣斬衰三􅂛正服爲父三􅂛半義服爲君謂縷如三􅂛半而不緝比正服微細其實二百四十縷父爲長子斬又爲人後者妻爲夫妾爲君女子子在室及嫁而反在父室者皆三年不言裁割而言斬者取痛甚之意知者案三年問云創鉅者其日乆痛甚者其愈遲又雜記縣子曰三年之喪如斬期之喪如剡謂哀有􅀷淺是斬爲痛􅀷之義故云斬也斬衰旣用苴麻則首絰􅆎絰及杖亦用苴麻苴竹爲之故下云苴絰杖絞帶以一苴自此三事也又註云凡服上曰衰下曰裳賈釋云言凡者鄭緫五服而解之也案大記云衰廣四寸長六寸綴之於心緫號爲衰非止當心而巳故諸言衰非止當心而巳故諸言衰者皆與裳相對至於弔服緦疑錫三者亦謂之爲衰也斬衰衽苴絰九寸實者舉􅀋而言也􅀂圓曰簞方曰笥鄭註論語簞笥也亦舉其􅀋也又傳曰苴絰大搹音革左夲在下賈釋云夲謂麻根也重服統於内而夲陽也父是陽左亦陽也下是内以言痛心内發故也此對母右夲在上輕服統於外而本隂也註云麻在首在􅆎皆曰絰絰之言實也明孝子有忠實之心故爲制此服名則斬衰貌􅀂苴則苴是惡也色貌象苴服因心而發故明孝子忠實之心首絰象緇布冠之頍去蘂反項􅆎絰象大帶又有絞帶象革帶齊衰巳下用布下齊衰章去削杖布帶是也下註云盈手曰搹搹扼也圍九寸斬衰之絰圍九寸者首是陽欲取陽數極於九也自齊衰巳下取降殺之義無所法象也小歛時纒絰即環絰也士則素委貌上加環絰大夫巳上素弁而加環絰成服後皆繆絰也􅆎絰絞帶虞後變麻服布於義可也絞帶如革帶大帶之下帶之斬衰冠冠繩纓冠六􅂛右縫外畢冠廣三寸落頂前後以紙糊爲材上以布爲三辟襵音輙兩頭皆在武下向外反屈之縫於武以前後兩畢之末而向外襵之故云外畢曲禮云猒冠不入公門註云猒猶伏也喪冠猒伏也謂反屈之故得猒伏之名以冠爲首飾故倍衰裳而用六􅂛布又加水以濯之但勿用􅁅而巳冠六升者勿用灰則七升巳上皆用􅁅也故大功章註云布功布其鍛冶之功麁治之是皆􅁅者也冠繩纓條屬註云屬猶著也通屈一條繩爲武垂下爲纓著之於冠也此繩纓不用苴麻又禮志云喪冠條屬以别吉凶言吉冠則纓武别材凶冠則纓武同材謂將一條繩從額上約之至項後交過前各至耳於武綴之各垂於頥下結之也三年之練冠亦條屬右縫至大祥除其衰杖則朝服縞冠當纓武異材從㔫縫法也賈釋曰大功巳上右縫小功巳下㔫縫故大戴禮云大功巳上唯唯小功巳下額額此據孝子朝夕哭在阼階之下西靣即賔從外來入門北而見之大功巳上哀重其冠三辟襵向右爲之從隂唯唯然順也小功緦麻哀輕其冠亦三辟襵向左爲之從陽即賔從外來入門北靣望之額額然逆向賔也二者繩纓皆條屬其冠辟襵或㔫從吉或右從凶不同也子爲父臣爲君各依親踈貴賤之序天官宫正云大喪授廬舎辨其親踈之居註云親者貴者居廬踈者賤者居堊室雜記云朝廷卿大夫士居廬都邑之士居堊室案唐大曆年中有楊垂撰喪服圖􅀃廬形制及堊室幕次序列次第云設廬次於東廊下無廊於牆下北上凡起廬先以一木横於牆下去牆五尺卧於地爲楣即立五椽於上斜􅀝東墉上以草苫蓋之其􅀯北面亦以草屏之向北開門一孝一廬門簾以縗布廬形如偏屋其間容半席廬間施苫􅒘其廬􅀯爲堊室以墼壘三靣上至屋如於牆下即亦如偏屋以瓦覆之西向戸室施薦木枕室􅀯爲大功幕次次中施蒲席次􅀯又爲小功緦麻次施牀並西戸如諸侯始起廬門門外便有小屏餘則否其爲母與父同爲繼母慈母不居廬居堊室如繼母有子即隨子居廬爲妻准母其堊室及幕次不必毎人致之共處可也婦人次於西廊下見時於由庭輦障中以葦薄覆爲之旣違古制故引唐礼以規之重校三禮喪服圖卷第十五
