front:
  text: 折城鄭氏家塾重校三禮投壷圖卷第五
  hash: sha256:0db624f4955782cb63e14d32f885fd00a33424c30ef42c2496f4f43ad7e87d2e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1d0078_SBCK_004-16b}
body:
  text: 通議大夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注壷矢有三等三馬特縣鐘特縣磬編鐘編磬瑟琴古竽古笙塤篪􅐟音笛籥簫柷敔牘應雅相投壷者大夫士與容燕飲講論才藝之禮故記云主人奉矢司射奉中使人執壷註云士則鹿中也明此投壷是大夫士之禮也大夫得用兕中不言者略之也左傳􅀃􅀳侯與齊侯燕設投壷此必言大夫士禮知非諸侯者按燕禮大射毎事云請於公此記言主人請賔故知矢以柘􅀂􅁄母去皮取其堅且重也舊􅀃云矢十七分或言去其皮節其壷置於賔主筵前邪行各去席二矢半投壷有三處日中則於室日晚則於堂太晚則於庭各隨光明也矢有五扶七扶長短之數各隨廣狹行用室中最狹矢長五扶堂上差寛矢長七扶庭中彌寛矢長九扶四指曰扶廣四寸五扶則二尺七扶則二尺八寸九扶則三尺六寸雖矢有長短而度壷皆使去賔主之席各二矢半也然則室中則去席五尺堂上則去席七尺庭中則去席九尺飲不勝者畢司射請爲勝者立馬當其所釋筭之前一馬從二馬必三馬者投壷如射亦三馬止也三者一黨不必三勝其一勝者并馬於再勝者三馬即勝筭也别岀此三筭以紀勝筭謂之馬者􅀂云技藝如此任爲將帥得乗馬也射與投壷皆所以習武因令樂郷射筭長尺四寸此云筭長尺二寸或者投壷射之細故筭差短特縣鐘此特縣鐘謂黄鐘律倍半而爲之者也鳬氏爲鐘兩欒謂之銑欒銑一物俱謂鐘口兩角古之楽器應律之鐘狀如今之鈴不圜銑間謂之于于上謂之鼔鼔上謂之鉦鉦上謂之舞此四者鐘之體對下甬衡非鐘體也于鐘脣之上祛也鐘脣厚褰祛然也鼔所擊処舞上謂之甬甬上謂之衡此二名者鐘柄鐘縣謂之旋旋蟲謂之幹旋屬鐘柄所以縣之也旋蟲者旋以蟲爲飾也漢法鐘旋之上以銅􅂐作蹲熊及盤龍辟邪古法亦當然三分甬衡之長二在上一在下以旋當甬之中央是其正也旋即環也形如璧羡隨鐘取稱此鐘旋内徑一寸鐘帶謂之􅂐􅂐間謂之枚枚謂之景帶所以分其名也介在于皷鉦舞甬行之間凡四介間也凡四者則中貳通上下畔折爲四処也漢時鐘乳俠鼔與舞毎処有九鐘有兩面面皆三十六于上之􅯖謂之隧􅯖所擊之処􅯖弊也隧在鼓中六分其厚以其一爲之􅀷而圜之窐而生光有似夫隧司烜氏夫隧􅀂鏡此窐圜擊乆而有光故云似夫隧窐音擕律曆志云以律各倍半而爲鐘黃鐘管長九寸其爲鐘也髙二尺二寸半厚八分註意厚五分强兩欒之間徑一尺四寸十六分分之十鉦之下帶横徑一尺一寸二分十六分分之八謂十分其銑間去二以爲鉦者也鼔間方八寸四分十六分分之六此謂以其鉦爲之銑間又去二分以爲之鼔間者也舞間方舞之中横徑八寸四分十六分分之六此謂以其鼓間爲之舞脩者也此謂舞上下促以横徑爲脩舞從爲廣也舊圖引樂經云黃鐘磬前長三律二尺七寸後長二律一尺八寸此謂特縣大磬配鏄鐘者也案周禮磬人云股爲二後長二律者也鼔爲三前長三律者也又曰其慱爲一謂股愽一律也下云三分其股愽去一以爲鼔愽三分其鼔愽以其一爲之厚又磬氏爲磬倨句一矩有半鄭云必先度一矩爲句一矩爲股以永其弦旣而以一矩有半觸其弦則磬之倨句也然則黃鐘之磬股長二尺八寸愽九寸厚二寸皷長二尺七寸愽六寸厚二寸兩弦之間三尺三寸七分半又曰巳上則摩其旁巳下則摩其耑音端後鄭云太上聲清也愽而廣則濁太下聲濁也短而厚則清也諸侯之大夫特縣磬天子之大夫兼有鐘及孔子在衛所擊皆謂編磬非此大磬也編鐘而由其簴鳴鄭註明堂位云横者簨飾之以鱗屬植曰簴飾之以臝屬羽屬編磬小胥職云凡縣鐘磬半爲堵全爲肆註云鐘磬編縣之二八十六枚而在一簨簴謂之堵鐘一堵磬一堵謂之肆十六枚之數起於八音倍而設之故十六也簨者下横者也簨上板曰業其邊植者爲簴梓人職云銳喙決吻數目顅脰小體騫腹􅀂是者謂之羽屬恒無力而輕則於任輕冝其聲清陽而逺聞於磬冝􅀂是者以爲磬簴故擊其所縣而由其簴鳴小首而長􅅮身而鴻􅀂是者謂之鱗屬以爲簨凢縣在東曰笙笙生也言生養之始也在西曰庸庸功也功成可頌也天子宫縣諸侯軒縣大夫判縣士特縣制度曰爲龍頭及顅衘璧璧下有旄牛尾飾簨簴鳥獸皆開動頰頏詩云設業設簴崇牙樹羽周禮小師掌教塤註云塤燒士爲之大如鴈􅆑謂之雅塤郭璞爾雅註云大如鵝子銳上平底形如稱錘六孔小者如鷄子謂之頌塤凡六孔上一前三後二又笙師掌吹塤丗夲云􅁀辛公作塤圍五寸半長三寸四分箎篴音笛舊圖云雅篪長尺四寸圍四寸翹長一寸三分圍自稱九孔頌篪尺二寸郭璞爾雅註云篪以竹爲之長尺四寸圍三寸一孔上出寸三分名翹横吹之小者尺二寸四簫之長由此也又風俗通云舜作竹簫以象鳯翼漢時賣飴􅄳者亦吹之柷敔爾雅云鼔柷謂之止郭璞註云柷如􅃮桶音動方二尺四寸􅀷一尺八寸中有椎柄連底挏之令左右擊止者椎名書曰合止柷敔鄭註云柷狀如􅃮筩而有椎合樂之時投椎其中而撞之冝從鄭註今太常樂亦人執其椎投而擊之爾雅云鼔敔謂之籈郭註云敔如伏虎背上有二十七鉏鋙刻以木長尺櫟之籈者其名也今唐禮用竹長二尺四寸破爲十莖於敔背横櫟之又鄭註云敔木虎也背有刻所以鼓之以止樂牘周禮笙師敎其舂牘先鄭云牘以竹大五六寸長七尺短者一二尺其端有兩空髤音休􅀞以兩手築地應笙師敎其舂應先鄭云應長六尺五寸其中有椎雅笙師掌教舂雅先鄭云雅狀如􅃮筩而弇口大二圍長五尺六寸以羊韋鞔之有兩紐䟽畫又後鄭謂牘應雅敎其舂者謂以築地笙師教之則三器在庭可知也賔醉而出奏祴夏以此三器築地爲之行節明不失礼也祴音垓又樂記云訊疾以雅孔䟽云雅樂器名舞者訊疾奏此雅器以節之也相樂記云治亂以相註云相即拊也亦節樂拊者以韋爲析城鄭氏家塾重校三禮射侯圖上
