front:
  text: 析城鄭氏重校三禮祭玉圖卷第十一
  hash: sha256:fa5652a70e6213dbde692a3ac7d67c952ca906ab6b3e5f092c4bedb4e00a7f1e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1d0078_SBCK_010-12b}
body:
  text: 通議大夫國子司業兼太常博士柱國賜紫金魚袋臣聶崇義集注􅁰尺指尺璧羨蒼璧黃琮靑圭赤璋白琥玄璜四圭有邸兩圭有邸圭璧璋邸射方明方明壇自周顯德三年冬十月奉堂帖令依故實模畫郊廟祭器祭玉至四年春以圖樣進呈㝷降勑命指揮昨聶崇義檢討禮書禮圖模畫到祭器祭玉數拾件仍令國子監太常禮院集禮官慱士同共考詳合得前代制度旣依典禮孰不僉同況臣崇義自叨受命敢不竭誠祖􅄒經文研覈法度由是玉瑞玉器之屬造指尺璧羨以規之冠冕鼎爼之屬設􅁰尺嘉量以度之其袤一尺而廣狹焉此璧羨天子以爲量物之度也按大宗伯云以蒼璧禮天牲幣亦如璧色後鄭云以冬至祭天皇大帝在北極者於地上之圜丘蒼璧者天之色圜璧圜丘皆象天體以禮神者必象其􅀋也下皆倣此臣崇義又案玉人云璧好三寸賈釋云玉人造璧應圜圜徑九寸其注又引爾雅云肉倍好謂之璧郭璞云肉邊也好孔也然則兩邊肉各三寸與此三寸之好共九寸也阮鄭二圖皆云蒼璧九寸厚寸是據此而言也又玉人璧好三寸之下云璧九寸諸侯以享天子玉人璧琮九寸琮以享后此唯取璧義故略琮字以此而言是有九寸之璧也案崔靈恩三禮義宗云昊天及五精之帝圭璧皆長尺二寸今檢周禮爾雅皆長尺二寸之璧未知崔氏據何文以爲􅀃黃琮色黄青圭色青大宗伯云以白琥禮西方牲幣皆如琥色注云以立秋祭白精之帝而少昊蓐収食焉琥猛象秋氣嚴鄭圖云以玉長九寸廣五寸刻伏虎形髙三寸臣崇義又桉孫氏符瑞圖云白琥西方義獸白色黒文一名騶尾倍其身故開元禮避諱而云禮西方白帝以騶虞是也又􅀳中興書云白琥尾叄倍其身又尚書大傳􅀃散冝生等之於陵氏取恠獸尾倍其身名曰虞後鄭云虞蓋騶虞也周書曰英林酋耳􅀂虎豹尾長參倍其身於陵英林音相近其是之謂乎大宗伯云以玄璜禮北方牲幣皆如璜色後鄭云以立冬祭黒精之帝而顓頊玄􅁳食焉半璧曰璜象冬閉藏地上無物唯天半見賈釋云列宿爲天文草木爲地文一圭皆長三寸以同鎭圭長尺二寸之制雖從權改作亦合古便今諸玉從冝下皆􅀋此又後鄭云祀天謂於夏正郊祀感生之帝也旅上帝謂祀五帝也大宗伯青圭等巳見祭五方天帝此又用四圭有邸而祭者彼即四時迎氣及揔享於明堂是其常也此因有故而祭之也感生之帝亦五帝别言爲天者以其祖感之而生故殊異之也臣崇義案郊特牲義云祭感生之帝玉與牲幣冝從所尚之色此四圭亦􅀶三寸厚寸玉人云兩圭五寸有邸以祀地旅四望此兩圭五寸亦冝於六寸璧兩邊各琢岀一圭俱長二寸半慱厚與四圭同典瑞注云兩圭以象地數二也僢音昌絹反而同邸又王制注云卧則同僢􅀍僢謂兩足相嚮此兩圭足同邸是足相嚮之義上四圭同邸亦是各自兩足相嚮故此玉人云圭璧五寸以祀日月星辰此一圭冝於六寸璧上􅅣岀一圭長五寸後鄭云圭有邸爲璧取殺於上賈釋云上四圭有邸以祀天旅上帝此一圭有邸言取殺者謂取降殺以三爲節也祀日月者􅀂春分朝日秋分夕月并大報天而主日以配月也其祀星辰􅀂小宗伯云兆五帝於四郊四􅀋亦如之彼注云四􅀋日月星辰運行無常以氣􅀋爲位兆日於東郊兆月與風師於西郊兆司命司中於􅀯郊兆雨師於北郊凡祭日月等用此圭璧以禮其神各隨方色賈釋云兆日於東郊者以大明生於東也兆月於西郊者以月生於西也知風師亦於西郊者以五行土爲風風雖屬土秋氣之時萬物燥落由風亦於西郊知兆司中司命於􅀯郊者以􅀯郊是盛陽之方司中司命是陽故兆於􅀯方也雨是水冝覲禮云方明者木也方四尺設六色東方青南方赤西方白北方黒上玄下黃設六玉上圭下璧南方璋西方琥北方璜東方圭注六色象其神六玉以禮之賈釋云大宗伯蒼璧以禮天黃琮以禮地後鄭注以天謂冬至祭天皇大帝於北極者地謂夏至祭神在崑崙者皆是天地至貴之神也然則此上冝用蒼璧下冝用黃琮而不用者則此上下之神是日月之神非天地之至貴者也典瑞云圭璧以祀日月故此上圭下璧是日月之神也注又云設玉者刻其木而著之也必知刻木著之者以其非置於坐以禮於神上下猶南北刻木安中央爲順餘四玉刻木著於四方亦順故知義然也舊圖云方明者四方神明之象用槐爲之案覲禮諸侯覲於天子爲宫方三百歩四門壇十有二㝷深四尺加方明于其上注云宫謂壝土爲埒以象墻壁也以宮方三百歩則築壇於國外也故司儀職注云合諸侯謂有事而㑹不恊而盟爲壇於國外以命事􅀂天子春帥諸侯拜日於東郊則爲壇於國東夏禮日於南郊則爲壇於國􅀯秋禮山川丘陵於西郊則爲壇於國西冬禮月與四瀆於北郊則爲壇於國北旣拜禮而還加方明於壇上而祀焉所以教尊尊也言天子親自拜日禮月之等是尊尊之法教諸侯巳下尊敬在上者也八尺曰㝷則方九十六尺深謂髙也從上曰深又司儀云爲壇三成成猶重也三重者自下差之爲三等而上有堂焉上方二丈四尺上等中等下等毎等兩廂各十二尺共二丈四尺三等則揔七丈二尺通堂上二丈四尺合爲九丈六尺也一等爲一尺發地一尺上有三成毎成一尺三成爲三尺揔四尺則諸侯各於等奠玉降拜􅂛成拜明臣禮也然則公奠玉於上等降拜中等侯伯奠玉於中等降拜於下等子男奠玉於下等降拜於地及􅂛成拜皆於奠玉之處􅂛成拜者􅀄奠玉降拜時王使人辭不拜臣乃􅂛而拜是成前拜也故云􅂛成拜或可降拜者皆降於地􅂛成拜於奠玉之處也三禮祭玉圖卷第十一
