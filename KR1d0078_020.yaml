body:
  text: 三禮圖集注卷二十宋聶崇義撰舊圖十卷形制闕漏文字省略名數法式上下差違既無所從難以取象蓋久傳俗不知所自也臣崇義先於顯德三年冬奉命差定郊廟器玉因敢刪改其或名數雖殊制度不别則存其名而略其制者瑚簋車輅之類是也其名義多而舊圖略振其綱而目不舉者則就而增之射侯喪服之類是也有其名而無其制者亦略而不圖仍别序目録共為二十卷凡所集注皆周公正經仲尼所定康成所注傍依疏義事有未達則引漢法以況之或圖有未周則於目録內詳證以補其闕又案詳近禮周知沿革至大宋建隆二年四月辛丑第敘既訖冠冕衣服見吉凶之象焉宮室車旗見古今之制焉弓矢射侯見尊卑之别焉鐘鼓管磬見法度之均焉祭器祭玉見大小之數焉圭璧繅藉見君臣之序焉喪葬飾具見上下之紀焉舉而行之易於詳覽冕服第一大裘冕無旒冕廣八寸長一尺六寸上玄下纁以綖覆飾之其板側則不用金飾有紐玉簪導以組為纓色如綬衣服令云大裘以黑羔皮為之玄領褾緣褾音必小反袖端也玉藻云羔裘豹飾緇衣以裼之詩唐風云羔裘豹祛此則云領褾及緣皆以玄朱裳白紗中單皂領青褾襈裾襈士眷切垂裾也革帶玉鈎䚢日列切觖也大帶天子素帶朱裏又上以朱下以緑終純之上外也朱正色故在外畔緑間色故在下畔諸侯大帶以素合之不朱裏亦朱緑終純與天子同大夫亦合素為帶純其垂外以玄內以華即黃也逺人為外近人為內玄天色故在外黃地色故在內士已下亦素練為帶皆單而不合惟繂下外內皆用緇紕之故士冠禮謂之緇帶據所純而言也紐約並用組紐謂帶之交結之處以屬其紐約者謂以物穿紐約結其帶天子以下紐約之物並用組為之也大帶濶四寸紐約之組濶三寸長齊於帶言約紐餘長三尺與帶垂齊者黻黻蔽膝也凡黻皆隨裳色他服謂之韠祭服謂之黻案易困卦九二朱黻方來利用享祀是祭服謂黻也案毛詩傳云天子純朱諸侯黃朱色淺大夫亦赤黻色又淺矣士緼黻緼赤黃之間色士冠禮爵辨韎韐即緼黻也鹿盧玉具劒火珠鏢首鏢音漂劒飾白玉雙珮玄組雙大綬六采玄黃赤白縹緑純玄質漢志乘輿黃赤綬四采黃赤紺鏢淳黃今圖依用長二丈四尺五百首廣一尺漢志大綬四采圭長二丈九尺九寸五分五百首與今文稍異今又云凡佩綬又有小雙綬長二尺六寸色同大綬而首半之間施三玉環諸臣一品者施二玉環今詳小綬漢志所謂縌也自青綬已上縌皆長三尺二寸與綬同采而半之縌綬古珮璲也與佩綬相迎受故曰縌也紫綬已上縌綬之間得施玉環璚黑綬已下縌綬皆長三尺縌音逆朱襪赤舄祀天神地祗則服之唐顯慶元年修禮官長孫無忌許敬宗等言準武德初撰衣服令乘輿祀天服大裘冕無旒雖憑周禮理極未備謹案郊特牲云周之始郊日以至祭之日被衮以象天戴冕藻十有二旒則天數也此二禮俱説周郊衮與大裘異又案月令冬天子始裘明以禦寒理非當暑若立夏迎氣龍見而雩炎熾方隆如何可服故歷代唯服衮章漢明帝永平二年詔採周官禮記始制祀天地之服唯天子備十二章魏晉宋齊周隋禮令祭服悉同是時造二冕呈進上以大裘朴略冕又無旒既不可通用於寒暑乃廢不用臣崇義謹案周之衣服無日月星辰魯以周公故裘冕亦有日月之章故鄭玄郊特牲注云郊天之月而日至魯禮也三王之郊一用夏正以周衰禮廢儒者見周禮盡在魯因推魯禮以言周事相承之誤職此之由孔疏中引庾蔚之熊安生説並云六冕皆用羔裘故司服説王祭昊天服大裘而冕已下五冕皆不言裘是皆用羔裘也又司裘掌為大裘以供王祀昊天之服仲秋獻良裘後鄭云良裘玉藻所謂黼裘與黼裘以黑羔與狐白雜為黼文視獮田以服之司裘又云季秋獻功裘後鄭云功裘人功微粗也所謂狐青裘之屬玉藻云狐青裘豹褒玄綃衣以裼之注云綃綺屬染之以玄狐青裘蓋玄衣之裘也此狐青裘周禮司裘謂之功裘者以其上承大裘在冕服之內人功微粗不如大裘良裘之美也鄭司農云大裘黑羔裘玉藻云羔裘緇衣以裼之論語曰緇衣羔裘案鄭志説大裘之上又有玄衣與裘同色但無文彩耳明衮冕以下之衣皆有文彩也然則自緇衣以下皆明裘上有衣裘亦黑羔皮為之也此大裘冕以裘為名已下五冕皆以衣為名衣裘互舉明皆有也然不總以衣為冕名者大裘上有玄衣質無文彩若又以衣為冕名當云玄冕則與祭羣小祀之冕何以别乎又冕服玄衣纁裳其來逺矣易繫辭云黃帝堯舜垂衣裳而天下治蓋取諸乾坤玄衣法天黃裳法地鄭注云土託位南方色黃而兼赤故為纁也今衣服令唯云大裘玄領褾緣下云朱裳不言裘上有衣故修禮者議之中廢及開元十四年集賢院學士張説奏以太宗朝所改舊儀著為五禮總百三十篇歷髙宗世已兩度增修頗有不同請與學士等更討論古今刪改行用制從之遂令徐堅等檢撰歷年不就説卒後蕭嵩代為集賢院學士始奏起居舍人王仲丘共修之二十九年新禮始成目為開元禮其大裘冕祀昊天上帝再見服用衮冕垂白珠十有二旒以組為纓色如綬黈纊充耳玉簪導板側金飾周制冕有紐禮緯曰旒垂曰纊纊即充耳也詩云充耳琇瑩毛傳云琇瑩美石也天子用純玉為瑱諸侯用美石次玉者也玄衣纁裳十二章八章在衣日月星辰山龍華蟲火宗彞四章在裳藻粉米黼黻其衣領褾為升龍皆織成為之臣崇義案尚書臯陶謨云豫欲觀古人之象日月星辰山龍華蟲作繪此六章皆畫於衣故言作繪其數六者法天之陽氣六律也宗彞藻火粉米黼黻絺繡此六章皆刺繡於裳故言絺繡絺鄭讀為黹絲刺以為繡文裳法地故繡此六章於裳以法地制陰氣六呂也至周以日月星辰畫於旌旗而冕服九章五章在衣四章在裳衣法天故章數竒裳法地故章數偶鷩冕七章華蟲為首毳冕五章宗彞為首鷩衣毳衣皆三章絺衣一章已下其數漸少裳上之章漸騰於衣事勢須然非有義意又六冕衣裳大夫已上皆織染絲為之故玉藻云士不衣織注云織染絲織之也以其前染後織功多色重故士已下皆染繒為之亦謂冕服玄上纁下皆染繒也山龍已下每章一行重以為等每行十二白紗中單黻領青褾襈裾黻衮冕黻加山龍火三章毳冕以上山火二章絺冕同舄加金飾絺冕山一章玄冕黻無章革帶劒玉佩綬襪與大裘冕同舄加金飾享廟謁廟及遣上將征還飲至踐位加元服納后元日受朝及臨軒册拜王公則服之歷代沿革制度或殊故備載禮令庶有區别他皆類此又案儀鳳二年太常博士蘇知機上言曰於龍朔中司禮少常伯孫茂道奏準令諸臣九章服君臣冕服章數雖殊飾龍名衮尊卑相亂請諸臣九章衣以雲及麒代龍仍改冕名當時紛議不定竟未施行今請依而制冕服十二章乘輿服之詔下有司詳議崇文館學星士楊炯奏議曰謹案虞書曰豫欲觀古人之象日月辰山龍華蟲作繪宗彝藻火粉米黼黻絺繡逮及有周乃以日月星辰為旌旗之飾又登龍於山登火於宗彝於是制衮冕以祀先王也九章者法陽也以龍為首章者衮卷也龍德神異應變潛見表聖王深沈逺智卷舒神化也又製鷩冕者鷩雉也雉有耿介表公有賢才能中耿介之節也夫以周公之多才也故治定制禮功成作樂夫以孔宣尼之將聖也故行夏之時服周之冕先王之法服乃其所自出也天下之能事又於是乎畢矣若夫禮唯從俗則命為制令為詔乃秦皇之故事猶可適於今矣若夫義取隨時則出稱警入稱蹕乃漢朝之舊儀猶可以行於世矣亦何敢變於周公之軌物改宣尼之法度者哉由是竟寢知機所請鷩冕有事於逺主則服之周則饗先公毳冕祭海嶽則服之周則四望山川毳衣畫虎蜼即宗彞也虎蜼山林之物是以取象絺冕絺冕三章粉米一章在衣亦繡焉衮衣鷩衣毳衣皆畫絺衣獨繡者粉米之物以其飬人服之以祭社稷社稷土榖之神粉米由成取象其功亦陰之類也玄冕蠟祭百神朝日夕月則服之百神異形難可遍祭但取黻之兩已相背異之也其六冕所祭依冕之先後祭神之尊卑大裘冕質故服以祭天衮冕服已下皆華故服以祭先王先公四望絺冕陰類故祭社稷玄冕亦質故祭羣小祀日月雖為天神之主從質故亦玄冕韋辨衣服令武臣當服韋辨司服鄭注辨與衣裳皆韎韋為之或説為素裳者冠辨即委貌也玄端冠辨素屨青絇繶純玄端即玄冠也黑舄絇繶純衣裳皆玄卒食燕居則朱裳三公毳冕八旒漢志云紫綬三采紫黃白淳紫圭長一丈七尺一百八十首令云首廣八寸上公衮冕九旒紫珮綬同三公令云皇太子垂白玉珠九旒青纊充耳犀簪導玄衣纁裳九章每章一行重以為等每行九亦依旒數山龍華蟲火宗彝此五章在衣藻粉米黼黻此四章在裳織成為之白紗中單黼領青褾襈裾革帶金絇䚢大帶素衣朱裏赤純以朱緑紐約用組諸臣二品已上同五品已下素帶紕其垂外以玄內以黃紐約皆用青組黻隨裳色加火山二章毳冕同絺冕之黻山一章玄冕無章玉具劒金寶飾玉鏢首瑜玉雙珮朱組雙大綬四采赤白縹紺純朱質一丈八尺三百二十首廣九寸白襪赤舄舄加金飾侍從皇帝祭祀及謁廟加元服納妃服之諸臣則垂青珠青衣纁裳角簪導亦可通用犀劒以金飾三品已上仍通用玉不得加珠寶凡佩綬皆雙綬親王纁朱綬四采赤黃縹紺純朱質纁文纎長一丈八尺二百四十首廣九寸與漢志諸侯王同一品緑綬綬四采緑紫黃赤純緑質丈尺首廣與親王同二品三品皆紫綬三采紫黃赤純紫質長一丈六尺一百八十首廣八寸漢志云侯將軍赤紫綬三采有白而無赤四品青綬三采青白紅純青質長一丈四尺一百四十首廣七寸與漢志九卿中二千石二千石青綬三采同五品黑綬二采青紺純紺質長一丈二尺一百首廣六寸漢志千石六百石赤黑綬而三采青赤紺淳青又漢志諸綬首皆廣一尺六寸比今丈尺又長諸有綬者則有紛皆長六尺四寸廣二寸四分各隨綬色以結環璚伯侯鷩冕五旒令云八旒二品服之漢志侯紫綬不及伯伯宜青綬今令二品三品皆紫綬子男毳冕五旒令云七旒三品者服之漢志九卿郡守國相河南尹皆青綬孤卿絺冕四旒令云六旒四品服之皆青綬爵辨青纓令云玄纓青衣纁裳白紗中單青領褾襈裾革帶鈎䚢大帶練紕其垂內外以緇約紐用青組爵赤襪履九品已上服之凡冕制以羅為之其服以紬爵辨用紬為之其服以繒為之此亦與圖異也皮辨令云以鹿皮為之簪導或犀或牙絳綃衣素裳革帶鞶囊小綬雙珮白襪烏皮履朔月及視事則兼服之一品九琪二品八琪三品七琪四品六琪五品五琪六品已下去琪諸侯朝服玉藻注云玄端素裳也孔義引王制玄衣而養老下注云衣素裳也準禮天子諸侯以朱為裳者則曰玄端不得云朝服諸侯玄端為祭服天子玄端朱裳或素裳以燕居士玄端疏云玄端賤於皮辨故次之上士玄端玄裳中士黃裳下士雜裳后服第二首飾副詩云副筓六珈笄長一尺二寸玉為笄首銜衡璜垂珠六道漢叔孫通制禮多依周法唯見冕板制度不見婦人首飾而後鄭云副筓若今步搖是至後漢始有其法也以此而言周之副笄漢之步搖所謂蔮紒上加鳳冠銜垂珠及有笄瑱步則搖故曰步搖自漢以降又有山題金鈿八爵九華鈿叉六翟之外首飾也今令皇后首飾花十二樹小花如大花之數并兩博鬢褘衣令云深青織成為之文為翬翟之形素質五色十二等素紗中單黼領羅縠褾襈皆用朱色蔽膝隨裳色以緅為領用翬雉為章三等大帶隨衣色朱裏紕其外上以朱綿下以緑綿紐約用青組以青衣革帶青襪舄舄加金飾白玉雙珮玄組雙大綬章綵尺寸與乘輿同受䇿助祭朝會諸大事則服之也揄翟青織成為之文為搖翟青質五色九等蔽膝搖雉為章二等大帶不朱裏已上皆同褘衣又瑜玉雙珮純朱雙大綬章綵尺寸與皇太子妃同首飾大花小花皆九樹并博鬢皇太子妃受策助祭朝會諸大事則服之皇后不制此服闕翟唐禮不制鞠衣黃羅為之其蔽膝大帶及衣革帶襪舄隨衣色餘與褘衣同唯無雉皇后親蠶則服之此上皆出唐禮令存今以見古展衣又作袒緣衣又作褖揄翟纁袡宵衣音綃墨車二墨車大夫之車也下有厭翟是王姬下嫁於諸侯所乘之車也諸侯之子合乘革路嫁於王者之後則乘金路此為墨車者以士之子親迎攝盛而乘大夫之車欲眀大夫已上親迎皆得攝盛也古今車軛不同駕馬法異故圖二車以曉之厭翟車案巾車王后之五路一曰重翟次曰厭翟以王姬下嫁於諸侯車服不繫其夫降王后一等故乘厭翟車以金飾諸末笲音煩竹器橋抗笲之具冠冕第三童子服將冠者緇布冠玉藻諸侯始加皆青組纓繢緌大夫士青組纓無緌纓結於頷下以固冠者結之餘者散而下垂謂之緌太古冠新增亦緇布冠禮記云太古冠布齊則緇之但直縫少􅙭與周為異耳緇布冠新增周制尚文辟􅙭多而橫縫頍項古作缺音丘蘂反青組纓欲見諸侯故亦繢緌纚韜髮為紒盧植云所以裹髻承冠全幅疊而用之皮辨次加皮辨黃帝已前則以羽皮為冠辨黃帝之後乃用布帛故三王共皮辨者重古也爵辨三加爵辨笄皮辨爵辨皆有笄故設之紘二辨皆有紘篋盛緇布冠已下及笄紘等物簞盛櫛蘇管反冠箱委貌形制有四母追音堆章甫前廣四寸髙五寸後廣四寸髙三寸落頂長短髙下取稱廣二寸方帔三寸其下漸狹屬於純周辨與殷冔夏收制相類通天冠衣服令云加金博山附蟬十二首施珠翠黑介幘組纓翠緌簪導若玉犀絳紗袍白紗中單朱領褾襈裾白裾襦亦裾衫也絳紗蔽膝白假帶方心曲領其蘋帶劒珮綬與大裘服同白襪黑舄若未加元服則雙童髻空頂黑介幘髮雙玉簪加寶飾祭還及冬至受朝元會冬會則服之逺遊冠令云具服逺遊三梁冠加金附蟬九首施珠翠黑介幘髮纓翠緌犀簪導絳紗中單皂領褾襈裾白裾襦白假帶方心曲領絳紗蔽膝革帶金鉤䚢大帶素不朱裏亦組以朱緑紐約用組玉具劒金飾玉鏢首瑜玉雙珮朱組雙大綬四采赤白縹緑純朱質長一丈八尺三百二十首廣九寸小綬亦雙長二尺六寸色同大綬而首半之間施二玉環白襪黑舄未冠則雙童髻空頂黑介幘雙玉導加寶飾謁廟還宫元日冬至朔日入朝釋奠則服之朔望日入朝通服袴褶五日常服當準此若公服逺遊冠簪導已上並同前絳紗單衣白裾襦革帶金鉤䚢假帶瑜玉雙珮方心紛鞶囊白襪烏皮履五日常朝元日冬至受宫臣朝則服之諸鞶囊二品已上金縷三品金銀縷四品銀縷五品綵縷諸珮一品珮山玄玉二品已下五品已上珮水蒼玉又文官七品已上服朝服者簪白筆武官及有爵者不簪髙山冠亦曰側注長冠漢祖受命創業始制長冠以入宗廟法冠一曰獬豸冠冠制作一角與今或異建華冠武辨大冠術氏冠方山冠巧士冠郤非冠樊噲冠郤敵冠章甫冠制别重出四冕叔孫通法周制進賢冠有三制宮室第四明堂明政教之堂漢東平王蒼議曰明堂宗廟圓明以法天方堂以法地宮寢制王六寢路寢在前是謂正寢五在後依五行位處之王隨時而居焉舊有王太子之宫詩禮有東宫之名别無制度故略之王城方九里天官序云惟王建國注云周公居攝而作六典之職謂之周禮營邑於土中鄭司農注云營國方九里九經九緯又鄭注尚書大傳云周禮匠人營國方九里謂天子城也或云天子實十二里城與周禮經注有異故兩存焉九服與王畿共方萬里律呂相生法圓丘樂夾鍾宫黃鍾角太蔟徴姑洗羽方丘樂林鍾宮太蔟角姑洗徵南呂羽禘祫樂黃鍾宮大呂角太蔟徵應鍾羽大宗子小宗子四等附庸大司徒職文井田小司徒職文溝洫遂人職文明堂秦法重出投壺第五壺矢有三等三馬即勝算特縣鐘黃鍾倍半而為者也特縣磬前長二尺七寸後長一尺八寸編鐘取今令注十二律分寸以為準簨簴朱漆畫龍飾刻虎為跗最上大板樹翣五中三如圭首兩角二如半圭首皆畫翡翠羽以飾之龍銜璧璜綴以五采羽相承垂下為飾近代宮縣飾金博山五軒縣飾金博山三亦飾以崇牙流蘇樹羽其樂器漆者天地之神皆朱漆宗廟及殿庭皆以五采畫飾金博山即樹翣如圭首者也編磬簨簴刻鳳鳥為拊其餘並如編鐘飾瑟琴古竽古笙竽笙匏古今異故並圖之塤古今二塤後二孔不見故别圖二孔者以曉之篪􅐟音笛籥三孔簫柷漆飾在縣內敔之東敔髹漆趹扃牘漆畫赤雲氣應朱漆雅有兩紐疏畫赤雲氣相舊圖云以韋為之四縫當擊處圓四圍漸稍而下以漆拊扃承而擊之射侯上第六虎侯大射虎熊豹三侯所謂皮侯也舊圖畫一侯今增為八賓射五正五采三正三采二正二采之侯舊畫一今增為三侯燕射畫熊虎豹麋鹿豕之首所謂獸侯舊畫一今增為四共為十五侯凡圖皆引經證各有典故至於畫飾或因舊圖有象可取觸類而增或顯其制微其文則略於此而詳於彼錯綜相備上下該通源而流之觀覽無惑熊侯新增豹侯新增熊侯畿內諸侯射者新增麋侯畿內有采地大夫射新增大侯畿內諸侯射者新增糝侯桑感反新增犴侯音岸新增五正之侯五正三正二正皆賔射之侯三正之侯新增二正之侯新增張侯兩植皆漆畫赤雲氣火珠丹漆上下綱及旁維皆朱繩射侯下第七獸侯熊首獸侯麋首新增獸侯虎豹首新增獸侯鹿豕首新增己上皆燕射之侯鼓足夏后氏之鼓建鼓建鼓及柷敔並少昊金天氏之作也殷人加左鞞右應以為衆樂之節也刻虎為跗鼓上重斗皆以青緣之蒙以朱綱下斗四角各出龍竿皆銜流蘇如簨之上大板兩頭重璧璜五采羽飾上有翔鷺下刻虎為跗鼗鼓有兩耳搖動自擊雷鼓舊圖大板之上無圭首樹羽之飾唯於兩頭刻龍首銜璧璜綴五采羽旌垂飾案大司樂云冬日至於地上之圜丘降天神以奏之後鄭云雷鼓八面每面皆一人左執鞉而右擊之靈鼓大司樂夏日至於澤中之方丘出地祗以奏之後鄭云靈鼓六面路鼓大司樂云宗廟之中奏之後鄭云路鼓四面鼖鼓與下二鼓皆兩靣先鄭云雷鼓六靣靈鼓四面路鼓兩面是與鼖鼓等同而康成不從破為八面六面四面者康成以鼖臯晉鼓非祭祀之鼓故皆兩面路鼓既奏於宗廟尊於鼖鼓故加兩面為四面其靈鼓以祭地又尊於宗廟更加兩面為六面祭天用雷鼓又尊於祭地復加兩面故為八面是其差也鼛鼓音臯面四尺磬折中曲其圍五尺三寸三分之一與鼖鼓同也晉鼓鼖鼛晉三鼓簨簴垂飾皆如上金錞即錞于也唐音樂志云錞于圓如碓頭大上小下縣以龍牀芒筒將之以和鼓沈約宋書曰今人間時有之則宋書非庭廟所用也廣漢什邡縣人段祚以錞于獻始興王鑑其器髙三尺六寸六分圍二尺四寸圓如筒銅色黑如漆甚薄上有銅馬後周平蜀得之斛斯徵觀曰此錞于也依干寶周禮注試之如其言也舊圖有架唯無璧璜五采羽飾與上為異筒音動金鐲音濁如小鐘金鐃如鈴金鐸赤楯朱干也新增玉戚新增帗舞新增羽舞析白羽為之新增皇舞雜五采羽為之新增弓矢第八乏一名容似今屏風并夾彤弓盧弓或作玈彤矢盧矢楅兩端龍首有足中央蛇身相交韋當置楅背上鹿中髹漆拊扃兕中山海經注云兕似水牛一角青色皮樹中閭中山海經云縣壅之山獸多閭郭璞云閭似驢其蹄角如羚羊一名山驢亦名驢羊虎中算撲刑器射者有過則撻之射物朱極三遂射韝次帷幄帳也扆畫無柄斧形數取其稱几筵蒲筵龜燋音雀存火之具楚焞即焌也俱音鐏蓍畫爻木卦板佩玉韍易曰朱韍詩傳云天子純朱諸侯黃朱色淺大夫朱色又淺大帶笏長二尺六寸博六寸旌旗第九太常以竹為弧用張縿幅旗旜如幅無兩翅通帛為之所謂大赤也物雜帛以素飾其側形制如旜翿旌雜白羽朱羽為之獲者所執玉輅車軌制已見上節服氏六人維王之太常又二人執戈送迎尸故下别圖一以曉之車蓋紅油覆達常及杠皆朱戈朱柲音兵媚反戟其柲亦朱玉瑞第十大圭珽也冒天子執冒四寸以小為貴也鎮圭以四鎮山為瑑飾桓圭雙植謂之桓蓋以桓楹為瑑飾信圭音伸躬圭榖璧蒲璧牙璋琢刻鉏牙為飾榖圭粟文大璋七寸諸侯以聘女駔琮是謂內鎮宗后守之琬圭琬猶圓也諸侯有德王命賜之琰圭半已下琢雲氣圭繅音藻璧繅祭玉第十一黍尺十黍為寸指尺案指為寸説文云尺十寸也人之手即十分動脈為寸口十寸為尺尺所以指尺規矩事也從尸從乙乙所識也周制寸咫尋常仞諸度量皆以人之體為法凡尺之屬皆從尺脈音脈璧羡羡長也好三寸而圓蒼璧九寸黃琮八寸青圭九寸赤璋九寸白琥長九寸廣五寸髙三寸玄璜九寸顯德四年春為祭玉祭器勑下國子監并太常寺集禮官學官議定制造其時議者引崔靈恩義宗云昊天及五精帝圭璧皆長尺二寸黃琮十寸又引隋朝潘徽所撰江都集依漢世諸儒所論白虎通説琮外方內圓有好璧好又方者臣崇義案鄭玄阮諶梁正等圖禮天圭璧皆長九寸蓋遵周禮玉人職有九寸之璧好三寸而圓取以為法也今依而用之知璧好圓而不方者爾雅云肉倍好謂之璧今以九寸之璧三寸之好言之若好方則四角侵璧肉而不成其倍也失爾雅之義違周公之制也又知黃琮八寸而無好者周禮玉人職云駔琮五寸宗后以為權又曰駔琮七寸鼻寸有半天子以為權注云駔讀曰組以組繫琮鼻因名組琮五寸者亦以組繫鼻而得組名又瑑琮八寸注云瑑文飾也其黃琮取寸法於此又曰大琮十有二寸射四寸厚寸是謂內鎮宗后守之注云如鎮圭尺有二寸對此為外鎮其琮因用組繫鼻者皆名組琮又因琮上瑑文飾者而名瑑琮大琮射四寸注云射者琰也謂琰其外四寸作鉏牙謂八角鋒明諸琮皆有八角鋒也云厚寸者明諸琮亦厚寸也其言組者鼻者瑑者顯其無組無鼻無瑑者也言大琮尺有二寸者對五寸七寸八寸者是小者也太小並厚一寸各有鉏牙而鉏牙長短者異也其玉人職説諸琮形狀皆著於經唯不言琮有好故賈疏特圖大琮無好者欲明諸琮皆無好也假如璧本有好故經直云璧好三寸今詳周禮玉人職上下經文於諸琮之下並不言琮好故知諸琮本無好也況鄭玄注三禮之經意有未盡故别作音圖增成注義其或經文具舉注義並驅不假其圖制度自顯者大璋中璋之類是也其有經文單出注不兼明須假其圖法式方顯者蒼璧黃琮之類是也今此琮璧等皆宗經解義顧注為圖則地八方而天體圓陽數九而陰數八合天地生成之道法陰陽竒耦之方遵皇祖之大經契文王易象鄭之為義大率而然其崔靈恩注三禮義宗及取義不宗三禮既非前範頗誤後人又江都集白虎通説璧琮之狀並違周制皆無依據難以適從今定此器玉並依禮圖爾雅三禮經注孔賈疏義毛傳鄭箋不敢雜取他文曲從外義苟違正典斯謬良多且堯舜聖君尚聞稽古禹湯哲后亦曰相沿文武重光周公追述制禮作樂煥古垂今三百三千憲章斯在故成康遵守而垂拱子孫紹續以延洪幽厲廢而取亡仲尼因而不改器玉之備無出斯文暨暴秦焚書周儀幾泯爰從漢魏下及隋唐其間哲后良臣未有捨周禮者也況三禮義宗崔氏一時之學江都集隋季亡國之文周禮是周公攝政致太平之書將二文而混聖典非末學之所敢詳也又太常卿田敏議曰聶崇義所據周禮及圖將本對證並皆驗矣今國家事惟師古道在還淳只取理長無非通論假如三禮義宗云蒼璧十二寸黃琮十寸有好今檢三禮並未見尺二寸蒼璧十寸有好黃琮不識崔靈恩指何書為三禮取何義而守之也且周公制禮垂法後王以蒼璧黃琮為禮天祀地一嵗之內六玉遍陳寧有造之不備待二千年後崔靈恩制之乎若以義宗為是則周禮為非豈子貢賢於仲尼泰山不如林放載詳所引於義未安若蒼璧內方肉則倍好不足以黃琮有好圖與注疏並無何若上以遵周公之文下以明將來之法則禮官無背經之咎學人守為本之書而西周之美可尋東魯之風承扇矣四圭有邸周祀感生帝從所尚之色而赤案開元十三年八月以封禪之故詔中書令張説等刋撰儀注奏上又建議曰臣等今謹案明慶元年禮部尚書許敬宗因修禮改燔柴在祭前狀稱周人祭天則燔柴以降神臣等案周禮迎神之義樂六變則天神降八變則地祗出九變而人鬼可得而禮矣則降神以樂周禮正文非謂燔柴以降神也又案明慶中無忌等奏晉氏之前猶遵古禮周隋以降妄為損益者今案郭璞進南郊賦及注爾雅祭後方燔又案宋志檢南齊北齊及梁郊祀亦飲福酒設燔後周及隋郊祀亦先祭後燔無忌之奏事乃相乖又案周禮大宗伯云以玉作六器以禮天地四方注禮謂始告神時薦於神座也又下經云以蒼璧禮天以黃琮禮地皆有牲幣各放其器之色又禮器云有以少為貴者祭天特牲是知蒼璧蒼牲俱合奠之神座理上帝則不惑又云四圭有邸以祀天旅上帝以明祀昊天之時無五方天帝明矣其青圭赤璋白琥玄璜自是立春立夏立秋立冬之日各於其方迎氣所用自分别矣今案明慶所改新禮以蒼璧蒼牲蒼幣俱先燔蒼璧既已燔矣所以遂加四圭有邸奠之神座蒼牲既已焚矣所以更加騂牲充其爼實混昊天於五帝同用四圭失特牲之明文加為二犢深乖禮意事乃無憑上令依後燔及先奠牲璧之議是後太常卿寧王憲奏請諸郊壇時祭並依張説等議制從之今案郊祀録云上辛及明堂祀以四圭有邸其注雖引周禮大宗伯及典瑞經注莫認指歸終失依據蓋王涇不見張説等所議故又有此謬誤兩圭有邸祀神州地祗於北郊牲玉皆黑色圭璧祀日於東郊而赤色夕月於西郊則白色璋邸射祀山川各因其方用璋邸以禮其神亦各隨其方色方明用槐木方四尺為之方明壇匏爵第十二匏爵祭天無圭瓉酌鬱之禮瓦甒盛五齊酌用匏爵也開元禮䄍百神於南郊天明夜明亦用匏爵瓦甒有蓋蜃尊鬯人云山川四方用蜃尊開元禮䄍百神於南郊山川澤蜃尊各二然散尊概尊蜃尊開元禮行用雖異與周禮義同徒有名數而無制度概尊埋沈用概尊開元禮冬至祭天於圓丘設星之外官每道間各概尊二散尊開元禮䄍百神於南郊麟羽裸毛介丘陵墳衍原隰井泉水墉坊郵表畷貓虎各散尊二大罍社稷及配座各大罍一大璋瓉天子巡狩過大山川使宗祝用大璋之勺酌鬱以禮之中璋瓉酌酒禮中山川邊璋瓉禮小山川方壺圓壺酒壺甕盛醯醢疏勺一升蒲勺一升爵一升觚二升觶三升角四升散五升觥舊圖云七升疏云宗廟之祭貴者獻以爵賤者獻以散尊者舉觶卑者舉角又特牲二觚二爵四觶一角一散不言觥然則觥之所用正禮所無不在五爵之列與豐此豐舊圖皆畫人形戴杅亦可垂戒棜特牲實獸於上陳饌棜制度與上稍異故重出禁與棜相類覆饌巾玄帛纁裏篚有蓋筥圓受五升盛饔餼之米致於賓館大筐受五斛小筐受五斗二筐皆盛米大者數少小者數多竹簋方有蓋盛棗栗后勞賔客用此凡器容受之數皆依禮注鼎俎第十三斛量名釜亦量名受六斗四升此二量與諸器為準牛鼎牛羊豕鼎皆以其類為飾羊鼎豕鼎鼎幂以茅為之牛鼎扃長三尺羊鼎扃長二尺五寸豕鼎扃長二尺三寸皆漆其兩端各朱三寸朼用棘心刻龍頭疏匕柄葉皆漆葉丹為淺升柄畫赤雲氣案朼匕二字經典通用采綵揄搖之屬並類此挑匕吐雕反又音由柄葉皆漆亦丹為淺升柄木亦丹畢舊圖云葉博三寸中鏤去一寸為叉柄長二尺四寸漆其柄末及兩葉皆朱又雜記云畢長三尺則兩葉似長六寸矣鉶有蓋鉶柶用木醴柶角洗畫水文菱花魚周之禮飾器各以其類洗罍漆赤中畫赤雲氣洗勺頭刻龍首金漆畫青雲氣盥盤上音管匜舊作流長六寸又云長三寸今依而用之簋有蓋籩大祠豆籩各十二中祠各九小祠各八籩巾登開元禮天地日月五方上帝各祭時簠簋登爼各一無鈃宗廟每室簠簋各二登鈃俎各三社稷先蠶先聖先師齊太公簠簋各二登鈃俎各三梡俎音苦管反有虞氏之俎四足嶡俎音蹶居衛反夏俎足間有距椇俎音俱枳椇之樹枝多曲撓殷俎足亦曲似之故云椇俎房俎周制今用之尊彝第十四雞彝盛明水下有舟畫草華為飾欲顯制度故不相連鳥彝盛鬱鬯下至蜼彝皆連舟斚彝音稼盛明水黃彞盛鬱鬯虎彞盛明水蜼彞盛鬱鬯畫布巾龍勺酌鬱酒漆赤中柄畫赤雲氣圭瓉瓉盤璋瓉獻尊畫牛形阮諶義畫鳯鳥其羽婆娑然鄭玄義象尊二畫象形於尊阮諶義用象骨飾尊鄭玄義著尊著地無足壺尊太尊祭天地社稷皆用之山尊祭嶽鎮海瀆皆用之疏布巾玉爵爵坫案禮文其坫有二反爵者小抗圭者大故明堂位曰反坫出尊崇坫康圭天子之廟飾也注云反坫反爵之坫出尊當在尊南唯兩君為好既獻之爵覆於坫上崇髙也又為髙坫奠圭於上其爵坫通髙一尺或曰開元義鑑云坫廣三尺又五禮精義云坫似俎廣二尺髙三尺此言通髙一尺無乃太下邪然抗圭反爵固有明文義鑑精義依何經説若使二文制度自不差違正比於崇坫未可難於反坫也罍有蓋喪服上第十五斬衰衣五服男子衰裳不連衣裳通名以袪袂衰負四物計衣身而言是衣也但衰是當心廣四寸長六寸者取哀摧在於遍體故衣亦得名衰斬衰裳衰裳皆用苴麻斬衰衽亦用苴麻衽各長二尺五寸上屬於衣以掩裳際不令露見衰衣也兩衽共用布一幅長三尺五寸斜破之上下各留一尺為正正者方正不破之謂也斜破者從上正一尺之下畔傍入六寸斷之乃始斜向下至下正一尺之下畔又傍入六寸斷之分作兩條各尺五寸如燕尾與正共長二尺五寸凡用布三尺五寸苴絰首經九寸腰絰亦用苴麻七寸一分絞帶苴麻腰絰象帶大帶此象革斬衰冠草布六升以冠為首飾故倍衰裳而用六升又加水以濯之但不用灰而已則齊衰大功等冠皆用灰也冠繩纓此纓不用苴麻通屈一條繩自額至項後交過向前各至耳綴之為武垂下者為纓苴杖粗細如腰絰菅爾雅白華野菅詩箋云白華於野已漚之名菅為屨柔韌倚廬附喪服下第十六齊衰齊謂裳下緝也四齊皆用枲麻三年齊衰正四升冠七升繼母慈母同正父在為母為妻期其衰五升冠八升雖期猶申禫杖齊衰裳升數同衰牡麻絰七寸一分冠布纓亦通屈一條布為武垂下為纓削杖與苴杖皆本在下腰絰五寸七分八釐亦用牡麻布帶象革帶疏屨粗屨也即藨蒯之菲也大功布衰本服齊斬今為殤死降在大功者故次在正大功之上大功布裳大功牡麻絰首絰五寸七分八釐腰絰四寸七分一釐弱此正大功中殤降在小功者絰無纓大功牡麻絰纓長殤與正大功同有纓緦衰衣縷加小功細而踈緦衰裳殤小功連衣裳婦人服特圖此者明斬衰至緦麻婦人衰裳皆然小功葛絰初喪首絰四寸七分一釐弱腰絰初喪三寸六分五釐強此葛腰絰與緦麻初喪腰絰同小功葛帶亦象革帶緦冠澡纓古緦絲二字通用言緦麻者謂緦麻布縷如絲也小功緦冠皆左縫大功已上右縫斬衰冠繩纓纓重於冠也齊衰已下布纓纓與冠等也緦冠澡纓為以灰澡治其纓不治冠衰也故不著衰裳特圖冠之與纓分異之也襲斂第十七掩用練帛析其末為四腳裹尸首案士喪禮陳襲事先敘明衣裳次鬠笄掩帛瞑目握手決極冒含貝重鬲夷盤士喪禮下記云又先敘浴牀次鬠笄次明衣裳與圖次第並異故申明之幎音縈目鬠音膾笄冒君錦冒既襲以韜尸重形也衾小斂前有冒不用衾至小斂時用衾君錦衾大夫縞衾士緇衾小斂訖别制夷衾以覆之其實皆大斂之衾也以其皆入大斂衣內故也士喪禮又有覆柩之夷衾夷衾上質朱錦下殺朱地黼文小斂布絞縮者一橫者三既斂所用束堅之也小斂衣少但用全幅布析其末而用之大斂布絞縮者三橫者五縮三者謂取布一幅裂為三片橫者五謂取布二幅裂為六片而用五也以大斂衣多每幅三析用之以為束之急也凡物細則束縛堅急也明衣并裳握手舊組繫四今組繫二纊極決飯珠含貝盛於笄浴盤夷盤夷牀士喪禮下篇云正柩於兩楹之間用夷牀注云時柩北首北首者謂朝祖正柩於夷牀之上既言朝祖不可以足向之故知北首也又賈疏釋上注云夷之言尸也其遷尸於堂之牀夷衾夷盤皆謂依尸而言故云夷之言尸也然則遷尸於堂又一牀之屬皆得夷牀之名並是平善之牀縱或改制其牀相類今舊圖作輿機復是下殤之禮施之於此一何陋也浴牀組圭為以組穿連圭璋璧琮琥璜六玉大斂時加於尸之腹背手足左右取象方明神之位也重鬲銘旌蓍并牘龜燋音雀楚焞焞即焌也同音鐏上明取龜釁龜之時灼龜之時灼龜擊筮之法及焞焌契燋之名此明卜葬及上大夫已上至天子卜而不筮之義故重出喪器上第十八輁軸龍輴熬筐耒耜蓑笠折如牀無足承抗席抗木茵士喪禮下篇記云茵著用荼實綏澤焉鄭注云荼茅秀也綏廉薑也澤澤蘭也皆取其香且禦濕苞以葦為之大夫已上皆用太牢天子苞九箇諸侯苞七箇大夫苞五箇士少牢天子之士苞三箇諸侯之士苞二箇既夕禮云苞二諸侯之士也又遣車視牢具賈公彥車僕疏説王遣車九乘除革廣闕蘋輕五乘外加金玉象木四者則九乘矣下文既畫金玉象木四車其苞亦須畫四餘狀皆可知矣遣車視牢具今於九乘之中以金玉象木四車平生乘駕之顯者故圖此四乘以明餘制筲用菅為之甕甒桁賵方遣䇿長尺二寸椑杝棺親尸者功布纛喪器下第十九黼翣二黻翣二畫翣二龍翣二栁車葬謂之栁車殯謂之輤車以其迫地而行則曰蜃車以其無輻則曰輇車開元禮謂之鱉甲車案周禮遂師注云蜃車柩路也柩路載栁四輪迫地而行有似於蜃又雜記云大夫載以輲車注云輲讀為輇許氏説文解字曰有輻曰輪無輻曰輇周禮蜃車天子以載柩蜃輇聲相近其制宜同乎輇崇蓋半乘車之輪鄭意以天子蜃車大夫之輇車蜃輇聲相近其制宜同也以蜃車迫地而行其輪宜卑故疑輇崇蓋半乘車之輪考工記乘車輪髙六尺六寸今半之得三尺三寸矣鄉師執纛方相氏以狂夫為之以其狀若狂故也兆域周葬於畢列昭穆如是三禮圖集注卷二十
