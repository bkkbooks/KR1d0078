body:
  text: 三禮圖集注卷七宋聶崇義撰獸侯熊首獸侯麋首獸侯虎豹首獸侯鹿豕首鼓足建鼓鼗鼓雷鼓靈鼓路鼓鼖鼓鼛鼓音臯晉鼓金錞金鐲金鐃金鐸兵舞赤楯玉戚帗舞羽舞皇舞梓人云張獸侯則王以息燕注云獸侯畫獸為侯鄉射記曰凡侯天子熊侯白質諸侯麋侯赤質白質者謂以蜃灰塗之使白為地正面畫其熊之頭狀亦象正鵠三分其侯而處其一亦各畫雲氣飾其側燕謂王勞使臣與羣臣飲酒而射也息謂王休農息老物之後亦行此燕射之禮王自射此五十弓熊首之侯也諸侯麋侯赤質謂以赤塗之使赤為地正面畫其麋之頭狀必知然者案貍首者射不來者之首也明熊麋以下皆正面畫其頭也王燕勞之時諸侯射此五十弓麋首之侯也亦畫雲氣飾其側卿大夫布侯畫以虎豹言布侯者謂不采其地直於布上正面畫虎豹頭狀亦畫雲氣飾其側王燕射則卿大夫射此五十弓虎豹首之侯也燕射必射此熊虎豹之首者不忘上下相犯也言此三獸皆猛不苟相下若君臣之道獻可者替否者不苟相從輒當犯顔而諫似此獸也故用之王燕射士射五十弓鹿豕之布侯者亦謂不采其地直於布上面畫鹿豕頭狀及畫雲氣以飾其側諸侯必射麋士必射鹿豕者志在君臣相養也案內則云麋鹿豕皆有軒並是可食之物故知相養也天子諸侯特射熊麋之首卿大夫士兼射虎豹鹿豕之首所謂君畫一臣畫二陽竒隂偶之數也此燕射自天子已下尊卑皆用一侯其侯道又皆五十弓弓二寸以為侯中同方一丈者降尊就卑之義以燕禮主於歡心故也夏后氏謂之鼓足鄭注云足謂四足大射云建鼓在阼階西南鼓注云建猶樹也以木貫而載之樹之跗也南鼓謂所伐面也賈釋云周人縣鼓今言建鼓用殷法也主於射略於樂故用先代鼓此亦諸侯卿大夫射之所用也小師職掌教鼓鼗注云出音曰鼓鼗如鼓而小持其柄搖之旁耳還自擊又大射注云鼗如鼓而小有柄賔至搖之奏樂也又視瞭掌凡樂事播鼗擊頌磬笙磬磬言擊鼗言播播即搖之可知也鼗所以節樂賔至乃樂作故知賔至搖之以奏樂也又鼗導也所以導鼓聲或節一唱之終也大司徒鼓人職曰雷鼓鼓神祀後鄭云雷鼓八面鼓也神祀祀天神也賈釋云但是天神皆用雷鼓靈鼓鼓社祭後鄭云靈鼓六面鼓也社祭祭地祇也賈釋云但是地祇皆用靈鼓路鼓鼓鬼享後鄭云路鼓四面鼓也鬼享享宗廟也鼖鼓兩面鼓鼓人職曰鼖鼓鼓軍事注云大鼓曰鼖長八尺案韗人云鼓長八尺鼓四尺謂鼓面也中圍加三之一謂之鼖鼓注云中圍加三之一者加於面之圍以三分之一也面四尺其圍十二尺加以三分之一四尺則中圍十六尺徑五尺三寸三分寸之一也今亦合十二板穹六寸三分寸之二耳即鎛師云凡軍之夜三鼜皆鼓之守鼜亦如之即此鼖鼓也故注云守鼜備守鼓也鼓之以鼖杜子春曰一夜三擊備守鼜也又瞽矇注杜讀鼜為憂戚之戚謂夜戒守鼓也擊鼓聲疾數故曰戚又鼓人曰凡軍旅夜鼓鼜司馬法曰昏鼓四通為大鼜夜半三通為晨戒旦明五通為發昫軍動則鼓其衆注云動且行俱謂鼓鼖鼓也鼓人職曰鼛鼓鼓役事注鼓長丈二尺案韗人云為臯鼓長尋有四尺鼓四尺倨句磬折注以臯鼓鼓役事磬折中曲之不參正也中圍與鼖鼓同以磬折為異鼓人職曰晉鼓鼓金奏注云晉鼓長六尺六寸金奏謂樂作擊編鐘也三鼓皆革面四尺圍丈二案韗人云長六尺有六寸左右端廣六寸中尺厚三寸穹者三之一上三正注云穹隆者居鼓面三分之一則鼓面四尺者版穹一尺三寸三分寸之一也倍之為二尺六寸三分寸之二加鼓四尺穹徑六尺六寸三分寸之二此鼓合二十板板上三正者正直也三直者穹上一直兩端又直各居二尺二寸不弧曲也鼓人以金錞和鼓注云錞錞于也圓如碓頭大上小下樂作鳴之與鼓相和鼓人職曰以金鐲節鼓注云鐲鉦也形如小鐘軍行則鳴之以為鼓節公司馬執之公司馬伍長也鼓人以金鐃止鼓注云鐃如鈴無舌有秉執而鳴之以止擊鼓司馬職曰鳴鐃且卻卒長執之百夫長也樂記曰復亂以武復謂反復也亂理也武謂金鐃也謂舞畢之時舞人必反復鳴此金鐃而治理之欲退之時亦擊此金鐃以限之鼓人以金鐸通鼓注鐸大鈴也振之以通鼓夏官司馬執鐸謂兩司馬執振之以通鼓兩司馬者二十五人之長也樂記曰天子夾振之注云王與大將夾舞者振鐸以為節也兵舞帗舞後鄭云兵謂干戚也帗列五采繒為之有秉音柄皆舞者所執大司徒鼓人曰凡祭祀百物之神鼓兵舞帗舞又舞師職掌教兵舞帥而舞山川之祭祀教之帗舞帥而舞社稷之祭祀羽舞皇舞案舞師注云羽析白羽為之形如帗陳宛丘詩曰無冬無夏值其鷺羽值者持也鷺羽即鷺翿翿翳也謂舞者所持以指麾又蔽翳其身也樂師注云皇謂雜五采羽如鳯皇色持以舞籥師掌教國子舞羽吹籥祭祀則鼓羽籥之舞注云鼓之者恆為之節也又舞師掌教羽舞帥而舞四方之祭祀教皇舞帥而舞旱暵之事注云四方祭謂四望旱暵謂雩也暵謂熱氣音漢三禮圖集注卷七
