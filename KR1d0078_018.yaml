body:
  text: 三禮圖集注卷十八宋聶崇義撰輁軸龍輴熬筐耒耜蓑笠折抗席抗木茵苞遣車筲甕甒桁賵方遣策椑功布纛既夕禮云遷于祖用軸注云遷徙也徙于祖謂朝祖廟也檀弓曰殷朝而殯于祖周朝而遂葬焉蓋象平生將出必辭尊者軸輁軸也軸狀如轉轔刻兩頭為軹軸輁狀如長牀穿桯前後著金而關軸焉大夫諸侯已上有四周謂之輴天子畫之以龍疏云軸輁軸者下記云夷牀輁軸是也云軸狀如轉轔者此以漢法況之漢時名轉軸為轔轔即輪也故士喪禮云升棺用軸注云軸輁軸輁狀如牀軸其輪也挽而行是輪為轔也云刻兩頭為軹者以軸頭為軹刻軸使兩頭細穿入輁之兩髀前後二者皆然云輁狀如長牀穿桯前後著金而關軸焉者此輁既云長如牀則有先後兩畔之木狀如牀髀厚大為之兩畔為孔著金釧於中前後兩畔皆然然後關軸於其中言桯者以其厚大可以容軸故名此木為桯云大夫諸侯已上有四周謂之楯者大夫殯葬雖不用輴士朝廟皆用輁軸則大夫朝廟當用輴諸侯天子殯葬朝廟皆用輴但天子畫轅為龍謂之龍輴大夫諸侯雖不畫轅以其皆有四周故同名為輴案阮氏圖云輁軸與輴長一丈二尺廣四尺士漆大夫以朱飾與浴牀同則天子畫轅為龍加赤雲氣龍輴其制似輁軸亦長丈二尺廣四尺取稱於柩前一轅畫龍於轅加赤雲氣君殯以輴車備火之虞上有四周熬者以火熬榖使香以筐盛之將塗設於棺傍所以惑蚍蜉使不至棺也喪大記曰熬君四種八筐大夫三種六筐士二種四筐加魚臘焉鄭引士喪禮曰熬黍稷各二筐又曰設熬傍各一筐大夫三種加以粱君四種加以稻四筐則手足各一餘設於左右加魚臘者案特牲士臘用兔少牢大夫臘用麋天子諸侯無文當用六獸之屬耒耜象生時田器既夕禮耒耜在用器之中案周禮車人職云車人為耒庛長尺有一寸中直者三尺有三寸上句者二尺有二寸自其庛緣其外以至於首以弦其內六尺有六寸與步相中也堅地欲直庛柔地欲句庛直庛則利推句庛則利發鄭玄讀庛為刺音七賜切刺謂耒下前曲接耜者即耒面也故賈公彥云耒面謂之庛又云耒狀若今曲柄杴又案鄭下注云耜異材據鄭意耜即金也又易下繫云斫木為耜者謂斫木為受耜之處也然則除耜金也外總謂之耒經云自庛緣其外以至於首者謂據庛下至手執句者之端逐曲量之有六尺六寸又云以弦其內者謂據庛面至句下望直量之而有六尺與步相中中應也故下注云耕者以田器為度冝所謂在野度以步以人步或大或小恐其不平故以六尺之耒代步以量地也若兼耜金則稍長故每量地用脫去耜而用之又匠人云耜廣五寸其庛亦廣五寸古者耜一金二耜為耦人各執一耜為耦人各執一耜若長沮桀溺耦而耕至漢耜歧頭兩金象古之耦耕用牛引也又山虞職説耒耜之木須堅韌依時取季材少木以為之既夕禮記云稿車載蓑笠注云稿猶散也周禮司常斿車以田以鄙與此散車同是木輅也蓑笠備雨服笠亦以禦暑折橫覆之注云折猶屐也方鑿連木為之蓋如牀而縮者三橫者五無簀窆事畢加之壙上以承抗席賈釋云橫覆之者加於壙時南北長東西短是知狀如牀也陳時長者東西言覆者見其善面在上也加在壙上時則反善靣向下云折猶屐藏物然知無簀者以其縮三橫五以當簀處也既夕禮云加抗席三注云席所以禦塵賈釋云既陳抗木於折北又加抗席三領於抗木之上故云加抗席三知禦塵以抗木在上禦土其抗席在下隔抗木慮有塵向下故云禦塵然則在陳列之時抗席加於抗木之上茵又加於抗席之上及葬加折於壙口次加抗席於折上次加抗木於席上既夕禮云抗木橫三縮二注云抗禦也所以禦土橫與縮各足以掩壙茵用疏布緇翦有幅亦縮二橫三注云茵所以藉棺者也翦淺也幅緣之也亦者亦抗木也及其用之木三在上茵二在下象天三合地二人藏其中賈釋云緣之者每用一幅粗疏之布不去邊乃合縫之為袋實以茅莠又别用物緣此兩邊幅縫合之處使之牢固因為飾也既夕禮云苞二所以裹奠羊豕之肉也下記云葦苞長三尺一編以此羊豕之肉即遣奠所苞牲之下體也又注云用便易者謂以葦長難用截取三尺一道編之用苞牲體為便易也巾車職云大喪飾遣車遂廞之行之鄭注云廞興也謂陳駕也行之使人以次舉之以如墓一曰鸞車用疏布為輤鄭讀曰蒨四面有障置於四隅後鄭云輤其蓋也四面皆有障蔽以隱翳牢肉置於槨中之四隅孔賈義云遣車謂將葬柩朝廟畢將行設遣奠竟取遣奠之牲臂臑折之為段用此車載之遣送亡者入壙也飾者還以金玉象革飾之如生存之車但粗小為之耳知小者以其人各舉一置於槨中之四隅故也後鄭訓廞為興即言陳駕者解廞為陳駕也謂下車僕云大喪廞革車彼廞謂作之也此文既言飾遣車已是作之義更言遂廞之故以陳駕解廞也又云行之使人以次舉之以如墓者雜記云遣車視牢具言車多少各如所苞牲體之數也天子太牢苞九個遣車九乘諸侯太牢苞七個遣車七乘大夫太牢苞五個遣車五乘此謂當朝廟之時於始祖廟陳器之明旦大遣奠之後則以次抗舉之人各執一以如墓也一名鸞車者以遣車亦有鸞鈴故也案既夕禮苞牲取下體注云下體脛骨象行又俎實之終始也士三箇前脛折取臂臑後脛折取骼音格是一牲取三體士少牢二牲則六體也分為三箇則一箇有二體然大夫已上皆用太牢牲有三體凡九體大夫九體分為十五段三段為一苞凡為五苞諸侯分為二十一段凡七苞天子分為二十七段凡九苞蓋尊者所取三體其肉多卑者雖取三體其肉少鄭又云天子遣奠用馬牲其箇數未詳此遣奠所苞皆用左胖又車僕疏説王遣車九乘除革車廣闕蘋輕五乘之外加以金玉象木四者則九乘矣今遣車特以金飾以見餘制後鄭云廣車橫陳之車也闕車所用補闕之車也蘋猶屏也所用對敵自蔽隱之車也輕車所用馳敵致師之車也校人大喪則飾遣車之馬及葬而埋之則是塗車之芻靈與既夕禮云筲三黍稷麥注云筲畚種類也其容蓋與簋同一觳也賈釋云畚器所以盛種此筲與畚盛種同類故舉為況也又下記云菅筲三其實皆瀹音藥注云米麥皆湛之以湯未知神之所享不用食道所以為敬既夕禮云甕三醯醢屑冪用疏布注云甕瓦器其容亦蓋一觳屑薑桂之屑也內則曰屑桂與薑幂覆同也賈釋云知甕瓦器者以甕甒二字皆從瓦故知是瓦器也云其容亦蓋一觳亦上筲三注云其蓋與簋同一觳者也然豆實三而成觳以豆實四升既三豆成觳則觳受斗二升則筲與甕俱容斗二升矣既夕禮云甒二醴酒冪用功布注云甒亦瓦器也容受宜與甕同中寬下直不鋭平底其甕下鋭與甒為異既夕禮云皆木桁久之注云桁所以庋苞筲甕甒也久當為灸灸謂蓋塞其口每器異桁賈釋云皆木桁久之者謂自苞筲以下皆灸塞之置於木桁也然苞筲等燥物直苞塞之無幂甕甒濕物非直灸塞其口又加幂覆之又孔義云桁以木為之置於地所以庋甕甒也又阮氏梁正等圖云桁制若今之几狹而長以承藏具實未見聞士喪禮下篇曰書賵於方若九若七若五注云方板也書賵奠賻贈之人名與其物於板每板若九行若七行若五行賈釋云以賓客所致有賵有賻有贈有奠直言書賵於方者舉首而言也但所送有多少故行數不同公羊榖梁皆云車馬曰賵禮記曰賵馬入廟門既夕禮云君賵玄纁束馬兩注云賵所以助主人送葬也則賵者施於生及送死者其下注亦云賵者生死兩施是也兩馬士制也謂士在家常乘兩馬若出使及征伐則乘四馬又賻之言補也助也謂補助主人之不足也公羊云貨財曰賻又下經云知生者賻然則賻者施於生者也贈者送也士喪禮下記云凡贈幣無常注云賓之贈也玩好曰贈任所有也玩好者謂生時玩弄之具與死者相知皆可以贈死者故經云若就器則坐奠于陳就猶善也善器則玩好之器也以所贈無常唯玩好所有奠於明器之陳也奠者謂賓致之物或可堪為奠祭者也然則四者或隨親踈或各主於所知也是故小功兄弟有服之親且賵且奠許其厚也賵奠於死生兩施也所知則賵而不奠降於兄弟也所知通問相知者也奠施於死者為多故不奠也知死者贈知生者賻以其各主於所知也士喪禮下篇云書遣於策注云策簡也遣猶送也賈釋云策簡也者編連為策不編為簡上云書賵於方此云書遣於策者聘禮記云百名以上書之於策不及百名書之於方上以賓客賵贈物名字少故書於方則盡也今主人自遣送亡者於苞筲以下明器用器之等并死者玩好之物名字數多故書於策釋器云簡謂之畢郭璞云今簡札也説文云簡牒也牘書板也蔡雍獨斷曰策簡也其制長二尺短者半之然則單執一札謂之簡禮記云執簡記奉諱惡連編諸簡乃名為策故於文策或作册象其編簡之形句命決云春秋二尺四寸書之孝經一尺二寸書之故六經之策皆稱長二尺四寸蔡雍言二尺者謂漢世天子策書所用故與六經異也一行可盡者書之於簡數行乃盡者書之於方方之數不容者乃書之於策孔義云牘方版然則牘與方似同一物而異其名也君即位而為椑歲一漆之若未成然鄭又云椑謂杝棺親尸者椑堅著之言也言天子椑內又有水兕革棺喪大記曰君大棺八寸屬六寸椑四寸上大夫大棺八寸屬六寸下大夫大棺六寸屬四寸士棺六寸注云大棺棺之在表者也檀弓曰天子之棺四重水兕革棺被之各厚三寸合六寸此為一重杝棺一杝棺木所謂椑棺也梓棺二屬與大棺也四者皆周此從內説而出也然則大棺及屬皆用梓椑用杝以是差之上公革棺不被三重也諸侯無革棺再重也大夫無椑一重也士無屬不重也庶人之棺四寸棺束縮二橫三祍每束一祍今小要喪大記曰士葬用國車音輇示専反或作圑又誤作國二綍無碑比出宫御棺用功布注云比出宫用功布則出宫而止至壙無矣舊圖云功布謂以大功之布長三尺以御柩居前為行者之節度又隱義云羽葆功布等其象皆如麾則旌旗無旒者周謂之大麾既夕禮云商祝執功布以御柩執披賈釋云謂以葬時乘車故有柩車前引柩者及在柩車傍執披者皆御治之又注云居柩車之前若道有低仰傾虧則以布為抑揚左右之節使引者執披者知之也道有低謂下坂時也道有仰謂上坂時也傾虧謂道之兩邊在柩車左右轍有髙下也若道有低則抑下其布使執引者知其下坂也若道有仰則揚舉其布使執引者知其上坂也若柩車左邊右邊或髙下傾虧亦左右其布使知道有傾虧也假令車之東轍下則抑下其布向東使西邊執披者持之若車之西轍下則抑下其布向西使東邊執披者持之所以然者使車不傾虧也大夫御柩以茅諸侯以羽葆天子以纛指引前後左右皆如功布之施為也又既夕禮將葬啓肂音異時商祝免袒執功布入升自西階注云功布灰治之布也執之以接神為有所拂芳勿反㧍芳罔反賈釋云拂㧍猶言拂拭也故下經云商祝拂柩用功布是拂拭去塵也此始告神而用功布拂拭謂拂㧍去凶邪之氣也謂功布有此三用故廣述而辨之喪大記云君葬用輴四綍二碑御棺用羽葆周禮鄉師及葬執纛以與匠師御柩注云翿羽葆幢也纛與翿義同鄭又引雜記云諸侯執綍五百人四綍皆銜枚司馬執鐸左八人右八人匠師執羽葆御柩孔義云羽葆者以鳥羽注於柄頭如蓋謂之羽葆葆即蓋也雜記云執羽葆是諸侯禮故匠師執之周禮執纛是天子禮故鄉師執之下有執者相兼義備三禮圖集注卷十八
