body:
  text: 三禮圖集注卷十五宋聶崇義撰斬衰衣斬衰裳斬衰衽苴絰腰絰絞帶斬衰冠冠繩纓苴杖菅屨倚廬附喪者鄭目録云不忍言死而言喪也以喪是弃亡之辭若全存居彼弃亡於此也案曲禮云天子曰崩諸侯曰薨大夫曰卒士曰不祿庶人曰死又爾雅云崩薨卒不祿皆死也是士已上各為義稱庶人言死得其總名又鄭注曲禮云死言澌也精神澌盡也左傳魯昭公出居乾侯齊侯唁公于野井公曰喪人其何稱是喪為弃亡之辭若親弃於此而有存於彼是孝子不忍言父母精神盡也服者言死者既喪生者制服但貌以表心服以表貌故禮記閒傳曰斬衰何以服苴苴惡貌也所以首其內見諸外故斬衰貌若苴齊衰貌若枲大功貌若止小功緦麻容貌可也然周公設經上陳其服下列其人此言父與諸侯為天子者是下人為服上服者也先言父者此章恩義並設忠臣出孝子之門義由恩出故先言父也傳曰齊衰大功冠其受也然斬衰亦冠衣相受何者凡喪制服所以表哀哀有盛時殺時其服乃隨哀隆殺故初服粗惡至葬後練後大祥後漸細加飾是以冠受斬衰裳初三升冠六升既葬以其冠為受衰六升冠七升小祥又以冠為受受衰七升冠八升此是葬後祥後皆更以輕服受之故有受冠受服之名其降服齊衰初死衰裳四升冠七升父卒為母亦四升七升既葬以其冠為受受衰七升冠八升正服齊衰五升冠八升父在為母為妻俱禫杖及不杖者皆五升八升既葬以其冠為受受衰八升冠九升義服齊衰六升冠九升既葬以其冠為受受衰九升冠十升降服大功衰七升冠十升既葬以其冠為受受衰十升冠十一升正服大功衰八升冠十升既葬衰十升冠十一升義服大功衰九升冠十一升既葬衰十一升冠十二升以其初喪冠升數皆與既葬衰升數同故傳云齊衰大功冠其受傳又曰小功緦麻冠其衰者謂降服小功衰冠皆十升正服小功衰冠皆十一升義服小功衰冠皆十二升緦麻十五升抽其半而七升半衰冠升數亦同斬者不緝也斬衰裳者謂斬三升苴麻之布以為衰裳也凡衰外削幅裳內削幅幅三袧音鉤賈疏袧如脯屈中曰朐之朐削猶殺也凡者總五服而言也袧者辟褶之屈中也其裳前三幅後四幅每幅辟褶三包斬象喪冠之辟積三也袧為辟褶屈中者謂辟兩側空中央也以袧讀與屈中曰朐義同則每布凡三處屈之辟兩邊相著自然中央空闕也注云大古冠布衣布先知為上外殺其幅以便體也後知為下內殺其幅有飾也郊時牲曰太古冠布注云唐虞已上曰太古是太古冠布衣布也此先知為上後知為下亦謂唐虞已上黃帝已下故禮運云昔者先王未有麻絲衣其羽皮注云此上古之時也下云後聖有作謂黃帝也是黃帝時始治絲麻以為布帛是時但以邊幅向外縫之於體為便先知為上者謂先知縫布衣向外以便體為上也後知為下者謂後知邊幅向內縫之比於向外觀之為美稍似有飾故云後知為下也後代聖人易之以衣幅外殺裳幅三袧者為喪服唐虞已上冠衣皆白布吉凶同齊則緇之三代改制更制牟追章甫委貌為行道朝服之冠其朝祭冠服皆辟積無數喪之冠裳但三褶耳緇布冠三代皆為始冠之冠白布冠質乃為喪冠若然此言後世聖人指夏禹身以其三代最先故也負廣出於適寸適者辟領也與闕中共一尺六寸負用布方廣尺有八寸故得出適兩傍各寸也負布縫於領下下垂放之以其置在背上故得負名適音的適博四寸出於衰者以衰長六寸博四寸綴於外襟之上廣長當心博即廣也適在闕領之外各廣四寸與闕領共有一尺六寸闕即領闕中也故兩適向前與衰相望兩傍各出六寸適即辟領也故鄭注云前有衰後有負左右有辟領者孝子哀戚無所不在也賈釋云衰之言摧也衰當心者明孝子有哀摧之志也負在後者以其負荷悲哀在於背也左右辟領謂之適者以哀戚之情當有指適緣於父母不兼念餘事以示四處皆有悲痛是其哀戚無所不在也衣自領至衣腰二尺二寸兩身前後四尺四寸此據脊縫一傍前後而言也兩傍共有八寸八寸加闕中與辟領尺有六寸然則此除袪袂衰負四物唯計衣身而言凡用布一丈四寸闕中謂闕去中央安項處當脊縫兩廂總闕去八寸若去一廂則止去四寸袂者衣身兩傍出者也故下云袂屬幅亦明與衣不别幅也袂屬幅而不削屬猶連也袂與衣身同是一幅連幅者謂整幅二尺二寸也言袂據從身向袂而稱也言衣據從上向腋下而云也凡用布為衣及射侯皆削去邊幅一寸為縫殺今云屬連其幅則是不削去其邊幅取整幅為袂也必不削幅者欲取與衣二尺二寸同也袂所以連衣身者明兩袂與衣身參齊也兩傍袂與中央衣身總為三事下畔皆等謂袂與衣身俱二尺二寸其袖足以容中人之肱深衣云袂中可以運肘是也袪尺二寸足以容中人之併兩手也吉時拱尚左手喪時拱尚右手是併兩手也袂袖口也然則袪袂相接之處袂冝漸殺五寸令小袪冝漸侈五寸令寬與今時喪服袪袂似異矣斬衰三升正服為父三升半義服為君謂縷如三升半而不緝比正服微細其實二百四十縷父為長子斬又為人後者妻為夫妾為君女子在室及嫁而反在父室者皆三年不言裁割而言斬者取痛甚之意知者案三年問云創巨者其日久痛甚者其愈遲又雜記縣子曰三年之喪如斬期之喪如剡謂哀有深淺是斬為痛深之義故云斬也斬衰既用苴麻則首絰腰絰及杖亦用苴麻苴竹為之故下云苴絰杖絞帶以一苴目此三事也又注云凡服上曰衰下曰裳賈釋云言凡者鄭總五服而解之也案下記云衰廣四寸長六寸綴之於心總號為衰非止當心而已故諸言衰非止當心而已故諸言衰者皆與裳相對至於弔服緦疑錫三者亦謂之為衰也衽長二尺有五寸上屬於衣所以掩裳際也其裳前三幅後四幅開兩邊露見裏衣是以須衽屬衣兩傍垂之掩裳交際處也一幅長二尺五寸斜破之上下各留一尺為正正者方正不破之謂也斜破者從上正一尺之下畔傍入繼六寸乃始斜向下至下一尺之下畔又傍入六寸繼之分作兩條各一尺五寸如燕尾共長二尺五寸凡用布三尺五寸此二衽上已屬於衣此别出制度以曉之苴絰者麻之有蕡者也爾雅云蕡枲實孫炎曰蕡麻子也以色言之謂之苴以實言之謂之蕡下云牡麻者對蕡為名言枲麻者對苴生稱也故閒傳云斬衰貌若苴齊衰貌若枲若然枲是雄麻蕡是子麻爾雅云蕡枲實者舉類而言也若圎曰簞方曰笥鄭注論語云簞笥也亦舉其類也又傳曰苴絰大搹音革左本在下賈釋云本謂麻根也重服統於內而本陽也父是陽左亦陽也下是內以言痛心內發故也此對母右本在上輕服統於外而本隂也注云麻在首在腰皆曰絰絰之言實也明孝子有忠實之心故為制此服名則斬衰貌若苴則苴是惡也色貌象苴服因心而發故明孝子忠實之心首絰象緇布冠之頍去蘂反項腰絰象大帶又有絞帶象革帶齊衰已下用布下齊衰章去削杖布帶是也下注云盈手曰搹搹扼也圍九寸斬衰之絰圍九寸者首是陽欲取陽數極於九也自齊衰已下取降殺之義無所法象也小斂時纒絰即環絰也士則素委貌上加環絰大夫已上素辨而加環絰成服後皆繆絰也腰絰大七寸五分寸之一而繆之謂兩股相交兩頭結各存麻本散垂三尺雜記曰麻者不紳鄭𤣥云喪以腰絰代大帶故喪服注云腰絰象大帶既象大帶亦於絰交繫處兩傍各綴組象大帶之組約婦人亦服苴絰并腰絰絞帶絞帶者繩帶也謂絞苴麻為繩以作帶故云絞帶王肅以帶如腰絰亦七寸五分寸之一亦用苴麻為之馬鄭不言當從王義但絰帶至虞後變麻服葛絞帶虞後雖不言所變案公士大夫之衆臣為君服布帶又齊衰已下亦云布帶則絞帶虞後變麻服布於義可也絞帶如革帶大帶之下帶之冠六升右縫外畢冠廣三寸落頂前後以紙糊為材上以布為三辟褶音輒兩頭皆在武下向外反屈之縫於武以前後兩畢之末而向外褶之故云外畢曲禮云厭冠不入公門注云厭猶伏也喪冠厭伏也謂反屈之故得厭伏之名以冠為首飾故倍衰裳而用六升布又加水以濯之但勿用灰而已冠六升者勿用灰則七升已上皆用灰也故大功章注云大功布其煆治之功粗治之是皆灰者也冠繩纓條屬注云屬猶著也通屈一條繩為武垂下為纓著之於冠也此繩纓不用苴麻又雜記云喪冠條屬以别吉凶言吉冠則纓武别材凶冠則纓武同材謂將一條繩從額上約之至項後交過前各至耳於武綴之各垂於頤下結之也三年之練冠亦條屬右縫至大祥除其衰杖則朝服縞冠當纓武異材從吉法也賈釋云大功已上右縫小功已下左縫故大戴禮云大功已上唯唯小功已下額額此據孝子朝夕哭在阼階之下西面弔賔從外來入門北面見之大功已上哀重其冠三辟褶向右為之從隂唯唯然順也小功緦麻哀輕其冠亦三辟褶向左為之從陽弔賔從外來入門北面望之額額然逆向賔也二者繩纓皆條屬其冠辟褶或左從吉或右從凶不同也苴杖竹也為父所以杖用竹者父是子之天竹圎亦象天竹又外內有節象子為父亦有外內之痛又能貫四時而不變子之為父哀痛亦經寒溫而不改故用竹也菅屨謂以菅草為屨毛傳云白華野菅也巳漚為菅箋云白華於野已漚名之為菅漚菅柔韌中用矣此菅亦是巳漚者用之為屨又下傳云菅屨者菅菲外納也然則周公時謂之屨子夏時謂之菲子夏作喪服傳故也外納者外其飾也謂向外編之也倚廬謂倚木為廬在中門外東方北户喪服傳孝子居倚廬寢苫枕塊不脫絰帶居門外之廬哀親之在外也寢苫枕塊者哀親之在草土也苫編藁塊墼也既虞翦屏柱楣寢有席九虞七虞五虞三虞之後乃改舊廬西向開户翦去户傍兩廂屏之餘草柱楣者前梁謂之楣楣下兩頭豎柱施梁乃夾户傍之屏寢有席者閒傳云既虞芐翦不納鄭云芐今之蒲蘋即此寢有席謂蒲席加於苫上也既練舍外寢此寢謂中門外於屋下壘墼為之不塗塈之堊室也屋下對廬偏倚東壁而言也初喪居廬堊室子為父臣為君各依親踈貴賤之序天官宫正云大喪授廬舍辨其親踈貴賤之居注云親者貴者居廬踈者賤者居堊室雜記云朝廷卿大夫士居廬都邑之士居堊室案唐大厯年中有楊垂撰喪服圖說廬形制及堊室幕次序列次第云設廬次於東廊下無廊於牆下北上凡起廬先以一木橫於牆下去牆五尺卧於地為楣即立五椽於上斜倚東墉上以草苫蓋之其南北面亦以草屏之向北開門一孝子一廬門簾以縗布廬形如偏屋其閒容半席廬間施苫凷其廬南為堊室以墼壘三面上至屋如於牆下即亦如偏屋以瓦覆之西向戶室施薦木枕室南為大功幕次次中施蒲席次南又為小功緦麻次施牀並西户如諸侯始死廬門外便有小屏餘則否其為母與父同為繼母慈母不居廬居堊室如繼母有子即隨子居廬為妻準母其堊室及幕次不必每人致之共處可也婦人次於西廊下見時於中庭輦障中以藁薄覆為之既違古制故引唐禮以規之三禮圖集注卷十五
