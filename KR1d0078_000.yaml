body:
  text: 御製題宋版聶從義三禮圖尚忠尚質尚乎文三代因之政以分何必衣冠定相襲要知和敬有尊聞觀圖可識關雎意撫册猶欣舊繭芬汲黯讜言對漢武懷哉那復更云云欽定四庫全書經部四三禮圖集注禮類四三禮總義之屬提要臣等謹案三禮圖集注二十卷宋聶崇義撰崇義洛陽人周顯德中纍官國子監司業世宗詔崇義參定郊廟祭玉因取三禮圖凡得六本重加考訂宋初上於朝太祖覽而嘉之詔頒行考禮圖始於後漢侍中阮諶其後有梁正者題諶圖云陳留阮士信受學於潁川綦母君取其説為圖三卷多不按禮文而引漢事與鄭君之文違錯正稱隋書經籍志列鄭元及阮諶等三禮圖九卷唐書藝文志有夏侯伏朗三禮圖十二卷張鎰三禮圖九卷崇文總目有梁正三禮圖九卷宋史載吏部尚書張昭等奏云四部書目內有三禮圖十二卷是開皇中敕禮部修撰其圖第一第二題云梁氏第十後題云鄭氏今書府有三禮圖亦題梁氏鄭氏則所謂六本者鄭元一阮諶二夏侯伏朗三張鎰四梁正五開皇所撰六也然勘驗鄭志元實未嘗為圖殆習鄭氏學者作圖歸之鄭氏歟今考書中宫室車服等圖與鄭注多相違異即如少牢饋食敦皆南首鄭注云敦有首者尊者器飾也飾蓋象龜周之制飾器必以其類龜有上下甲此言敦之上下象龜上下甲蓋者意擬之辭而是書敦與簠簋皆作小龜以為蓋頂是一器之微亦失鄭意沈括夢溪筆談譏其犧象尊黃目尊之誤歐陽修集古録譏其簋圖與劉原父所得真古簋不同趙彥衛雲麓漫鈔譏其爵為雀背承一器犧象尊作一器繪牛象林光朝亦譏之曰聶氏三禮圖全無來厯榖璧則畫榖蒲璧則畫蒲皆以意為之不知榖璧止如今腰帶上胯上粟文耳是宋代諸儒亦不以所圖為然然其書抄撮諸家亦頗承舊式不盡出於杜撰淳熙中陳伯廣嘗為重刻題其後云其圖度未必盡如古昔苟得而考之不猶愈於求諸野乎斯言允矣今姑仍其舊帙録之以備一家之學此書世所行者為通志堂刋本或一頁一圖或一頁數圖而以説附載圖四隙行欵參差尋覽未便惟內府所藏錢曽也是園影宋抄本每頁自為一圖而説附於後較為清整易觀今依仿繕録焉乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀三禮圖集注原序昔者秦始皇之重法術而天下貴刑名魏文帝之惡方嚴而人間尚通變上之化下下必從焉是以雙劔崇節飛白成俗挾琴飾容赴曲增抃自然之道也周世宗暨今皇帝恢堯舜之典則總夏商之禮文思隆大猷崇正舊物儀形作範旁詔四方常恨近代以來不能慕逺無所釐革溺於因循傳積世之漸訛為千載之絶軌去聖遼敻名實謬乖朱紫混淆鄭雅交雜痛心疾首求以正之而名儒嚮風適其所願國子司業兼太常博士聶崇義垂髦之嵗篤志於禮禮經之內遊刃其間每謂春秋不經仲尼恥是關雎既亂師摯憫之今吉凶之容禮樂之器制度舛錯失之甚焉施之於家猶曰不可朝廷之大寧容濫瀆義欲正失於得返邪於正潛訪同志定其禮圖而所學有淺深所見有差異作舍道側三年不成衆口云云何所不至會國朝創制彞器逮於車服乃究其軌量親自規模舉之措之或沿或革從理以變惟適其本時之學者曉然服義於是博采三禮舊圖凡得六本大同小異其猶面焉至當歸一之言豈容如是吾誰適從之歎蓋起於斯何以光隆於一時垂裕於千古遂鑽研尋繹推較詳求原始以要終體本以正末躬命繢素不差毫釐率文而行恐迷其形範以圖為正則應若宫商凡舊圖之是者則率由舊章順考古典否者則當理彈射以實裁量通者則惠朔用其互聞吕望存其兩説非其學無以臻其極非其明無以宣其象遵其文譯其器文象推合略無差較作程立制昭示無窮匪哲匪勤理無攸濟既勤且哲何滯不通有以見臨事盡心當官御物官不同事人不同能得其能則成失其能則敗禮圖至此能事盡焉國之禮事之體既盡美矣物之紀文之理又盡善矣其新圖凡二十卷附於古今通禮之中是書纂述之初詔儼總領其事故作序焉
