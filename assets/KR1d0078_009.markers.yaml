  - {type: variant, offset: 239, length: 721, content: 司常云交龍為旂注云一象其升朝一象其下復亦謂交畫升龍降龍也此諸侯所建杠長七仞而上公九斿以象大火故輈人注云大火蒼龍宿之心其屬有尾尾九星若侯伯則七斿子男五斿上得兼下下不得僭上其斿長短諸侯齊軫卿大夫齊較士齊肩若天王所建其斿與杠長短一如太常司常云通帛為旜注云通帛謂大赤從周正色無飾長尋正幅賈釋云以周建子為正物萌色赤今旌旂通體盡用絳之赤帛是用周之正色無他物之飾也然仍注旄羽於杠首亦繫斾於末若燕尾也司常云雜帛為物大夫士之所建注云雜帛以帛素飾其側白殷之正色以先王正道佐職也賈釋云雜帛者謂中央赤傍邊白白者殷之正色而在傍故云以先王正道佐職也輈人云鳥旟七斿以象鶉火注云鳥隼為旟鶉火朱鳥宿之栁其屬有星星七星故七斿此亦王者所建又案司常云州里建旟且鄉之州長是中大夫四命遂之里宰是下士一命皆不得建此七斿之旟又後鄭云鳥隼象其勇捷也賈釋云以熊虎龜蛇既各為兩物則隼當謂鷹隼是勇者也鳥謂鳥之捷疾者也輈人云熊旗六斿以象伐注云熊虎為旗伐屬白虎宿與參連體而六星故六斿此王者所建也其斿與杠長短亦如太常若臣下則各依命數然則遂大夫四命四斿鄉大夫六命則為六斿斿之與杠長短則不得如王者之數司常云龜蛇為旐又輈人云龜蛇四斿以象營室注云營室𤣥武宿與東壁連體而四星故四斿此亦王者所建也又鄙師是上士三命雖得建旐而三斿其縣正是下大夫四命旐雖四斿其斿與杠長短亦不得與王者同又案司常九旗之數又有全羽為旞析羽為旌注云全羽析羽皆五采繫之於旞旌之上所謂注旄於竿首也凡九旗之帛皆用絳賈釋云全羽析羽直有羽而無帛鄭云九旂之帛者據衆有者而言也又左傳襄十四年范宣子假羽毛於齊定四年晉人假羽旄於鄭雖毛旄二字不同杜注皆以析羽為旌孔義以全羽析羽之下皆有其帛鄉射記曰君射於境則虎中龍旃注云於境謂與鄰國君射也畫龍旃尚文章也此亦通用絳帛為之, SBCK: ''}
