  - {type: variant, offset: 3120, length: 651, content: 行色也巧士冠後漢志云前髙七寸本或作五寸繞後相通直竪不常服唯郊天黄門從官四人冠之在鹵簿中次乘輿前以備宦者四星也郤非冠後漢志云制似長冠下促宫殿門吏僕射冠之舊圖云髙五寸樊噲冠後漢志云樊噲造次所冠以入項羽軍廣九寸髙七寸前後各出四寸制似冕司馬殿門衞士服之或曰樊噲常持鐵楯聞項羽有意殺漢王噲裂裳裹楯冠之入羽軍立漢王側視項羽舊圖如巧士冠既違漢志不敢依從卻敵冠後漢志云前髙四寸後髙三寸通長四寸註舊圖通作纓制似進賢衞士服之禮無明文舊圖云章甫殷冠亦名冔紵中冒上黒屋十月行禮服之臣崇義案王制云夏后氏收而祭殷人冔而祭周人冕而祭又郊特牲云委貌周道也章甫殷道也毋追夏后氏之道也然則章甫是殷之行道之冠冔是殷之祭冕朝祭異服顯有明文而梁正等皆云章甫亦名冔誤之甚也言行道及朝皆冠章甫不可更名為冔也今依紵中冒上以黒屋之制別存章甫之一法不可更有冔名兼諸狀雜亂亦不重出世本云黄帝造冕王制云有虞氏皇冕論語云禹致美乎黻冕孔子曰服周之冕此明至周冕始加旒藻玉皆五采前後各十二叔孫通制禮多依周法又漢制度古今之冕略等俱廣八寸長尺六寸前圓後方漢用白玉珠各十二三公九旒青珠中二千石七旒黒珠然冕服之飾周最為備故孔子有服周之冕云舊圖云古三冠梁數雖異俱曰進賢前髙七寸纓長八寸後髙三寸一梁下大夫一命所服兩梁再命大夫二千石所服三梁三命上大夫公侯所服禮不記今案唐典三品已上三梁五品已上兩梁九品已上一梁臣崇義案漢明帝永平二年春正月辛未宗祀光武皇帝於明堂帝及公卿列侯始服冠冕衣裳玉佩絇屨以行事又漢官儀曰天子冠通天諸王冠逺遊三公諸侯冠進賢三梁卿大夫尚書二千石博士冠兩梁千石以下至, SBCK: ''}
