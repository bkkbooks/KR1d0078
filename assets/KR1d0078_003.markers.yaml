  - {type: variant, offset: 2074, length: 794, content: 下皆有收如東道笠下收矣又後漢志云爵弁一名冕廣八寸長尺二寸如爵形前小後大繪其上似爵頭色有收持笄所謂夏收殷冔者也祠天地五郊明堂雲翹舞樂人服之禮曰朱干玉戚冕而舞大夏此之謂也又案士冠禮云周弁殷冔夏收註云其制之異未聞謂夏殷禮亡其制與周異同未聞故下不圖夏殷二冠之象張鎰亦略而不取後漢志云通天冠髙九寸正竪頂少斜郤乃直下為鐵卷梁前有山有展筩乘輿常服服深衣制如袍隨五時五色漢受於秦禮無文或曰周公抱成王燕居故施袍兩存者圖制或殊更存一法他皆類此逺遊冠後漢志云如通天冠有展筩無山題又案唐典云逺遊三梁冠黒介幘青緌諸王服之若太子及親王即加金附蟬九首施珠翠纓翠緌犀簪導漢志曰髙山冠一曰側注冠制如通天頂不斜郤直竪無山題展筩蔡邕獨斷曰鐵為卷梁髙九寸胡廣曰髙山冠蓋齊王冠也秦滅齊以其君冠賜近臣謁者服之又史記酈生謁髙祖其冠側注漢舊儀曰乘輿冠髙山冠幘耳赤丹紈裏丹色之纓後漢志云長冠一曰齊冠前髙七寸廣三寸而後促漆纚為之制如版以竹為裏初髙帝微時以竹皮為之謂之劉氏冠楚冠制也祀宗廟諸祀則冠之皆袀𤣥袀居匀反獨斷曰紺繒也吳都賦注云袀皁服也法冠後漢志一曰柱後冠髙五寸以纚為之展筩以鐵為卷柱取其直而不橈也又唐志云法冠一名獬豸冠以鐵為柱上施珠二枚或曰獬豸神羊取別曲直楚王獲之故以為冠秦滅楚以其君服賜執法者侍御史廷尉正監平皆服之建華冠後漢志云以鐵為柱卷貫大銅珠九枚前圓又飾以鷸羽於頂祀天地五郊八佾舞人服之武冠後漢志云一曰武弁大冠武官冠之其制古緇布之象也侍中中常侍加黄金璫附蟬為文貂尾為飾胡廣曰趙武靈王效胡服以金璫飾首前歃貂尾為貴職秦滅趙以其冠賜近臣以金蟬貂尾飾者金取堅剛百鍊而不耗蟬取居髙飲露而不食貂取内勁捍而外温潤毛采紫蔚而不彰灼術氏冠即鷸冠也前漢書五行志註云鷸知天將雨之鳥也故司天文者冠鷸冠吳制差池四重髙下有行畫鷸羽為飾紺色又註云此術氏冠即鷸冠也新圖誤題為術士冠太子詹事尹拙議云舊圖皆為術氏冠仍案顔師古刊謬正俗云鄭子華之弟子臧出奔宋好聚鷸冠刊, SBCK: 刋}
