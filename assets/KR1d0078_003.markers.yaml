  - {type: line-break, offset: 168, content: '', id: KR1d0078_WYG_003-2a08}
  - {type: variant, offset: 168, length: 464, content: 皮弁等服張鎰圖以童子服連緇布冠下盡殷冔夏收以通天逺遊已下為不出三禮經義別編於下卷今案士冠禮云將冠者采衣紒其將冠者即童子二十者也將行冠禮始加緇布次加皮弁次加爵弁若本其行事敘將冠之服列於緇布之上於理爲當今依而次之仍升童子之服為卷首下梁之古冠庶得兩從知禮之自也童子采衣紒故士冠禮云將冠者采衣紒注云采衣未冠者所服玉藻云童子之飾也緇布衣錦縁錦紳并紐錦束髮皆朱錦也紒結髮也賈疏云將冠者即童子二十者也以其冠事未至故言將冠童子既不帛襦袴不裘裳故以錦為緇布衣縁飾又以錦為大帶及結紳之紐故云錦紳并紐也紐長與紳齊又以錦為之束髮總此紒紒謂結髮也詩云總角丱兮是也皆用朱錦飾者以童子尚華示將成人有文徳故皆用錦示一文一質之義衣襦袴并緇布是質也黒屨無絇青繶純又盧植云童子紒似刀環舊圖云始冠緇布今武士冠則其遺象也大小之制未聞梁正又云師說不同今傳疏二冠之象又下有進賢皆云古之緇布冠之遺象其張鎰重修亦云舊圖有此三象其本狀及制之大小未聞此皆不本經義務在相沿疾速就事今別圖於左庶典法不墜緇布冠始冠之冠也記曰太古冠布齊則緇之其緌也孔子曰吾未之聞也此主謂大夫士無緌耳諸侯始加, SBCK: ''}
