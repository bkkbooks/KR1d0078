  - {type: variant, offset: 1103, length: 201, content: 以起軍旅以治兵守先鄭云牙璋瑑以為牙牙齒兵象故以牙璋𤼵兵若今銅虎符𤼵兵也後鄭云牙璋亦王使之瑞節兵守用兵所守也若齊人戍遂諸侯戍周之類又玉人云牙璋中璋七寸厚寸以起軍旅以治兵守後鄭云二璋皆有鉏牙之飾於琰側知然者以其二璋同起軍旅故也蓋大軍旅則用牙璋以起之小軍旅則用中璋以起之也首言牙璋中璋不言牙者但牙璋文飾多故得牙名而先言之也中璋次於牙璋明亦有牙也以文飾差少故惟有中璋之名不言牙也典瑞不言中璋者以其大小等故不見也, SBCK: ''}
