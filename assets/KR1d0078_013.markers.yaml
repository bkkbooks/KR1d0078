  - {type: variant, offset: 3387, length: 274, content: 之外兼用敦也又少牢禮曰主婦執一金敦黍有蓋凡設四敦皆南首注云敦有首者尊器飾也飾象龜形周之禮飾器各以其類賈䟽云鄭必知飾象龜形者以其經云敦皆南首明象蟲獸之形以龜有上下甲故知敦蓋象之亦取其類也又司尊彞叙雞鳥虎蜼之等梓人職說外骨内骨注鳴旁鳴之類謂之小蟲之屬以為雕琢刻畫祭器以博庶物是周之禮飾器各以其類者也又明堂位曰有虞氏之兩敦夏后氏之四璉殷之六瑚哀十一年傳杜預以瑚為夏之禮器杜既不信禮記未知别有何據周之八簋鄭注云皆黍稷器制之異同未聞其瑚璉與牟案諸圖形制既同於簠簋故略而不取其敦今依孝經緯說與簠簋容受並同上下内外皆圎為異九嬪主婦賛執有儀故特圖之次於簠簋舊圖云豆, SBCK: 足}
