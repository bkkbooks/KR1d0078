  - {type: variant, offset: 2499, length: 676, content: 宫設罍水於洗東有枓鄭注云凡設水用罍沃盥用枓禮在此欲見罍洗枓三器唯少牢禮俱有餘文不具之意也案舊圖云勺五升口徑六寸曲中博三寸長三寸柄長二尺四寸漆赤中柄末亦丹臣崇義案鄭注士冠禮云勺尊升所以㪺酒音俱挹酌也賈䟽引少牢禮云罍枓音注彼枓與此勺為一物但彼枓所以㪺水此勺所以㪺酒又案周禮梓人為勺受一升酌之人情依梓人職受一升為是亦冝畫勺頭為龍頭柄依舊圖長二尺四寸自餘制並同鬱勺盥謂用匜沃盥洗手也盤謂承盥洗者棄水之器也故謂之盥盤舊圖云口徑二尺一寸受二斗漆赤中並不言深淺之數今以黍寸之尺依此二尺二寸口徑計之其底徑八寸深二寸乃容二斗之數足髙二寸下徑一尺匜者盥手澆水之器故孔義云匜似羮魁柄中有道可以沃盥洗手也又公食大夫禮云小臣具盤匜注云君尊不就洗故設盤匜賈䟽云知此盤匜為君設者案特牲禮云尸尊不就洗而盥用匜故知此設盤匜亦為君也今開元禮皇帝皇后太子行事皆有盤匜亞獻已下及攝事者皆無盤匜亦君尊設洗而不就洗之義也案梁正張鎰修阮氏等圖云匜受一斗流長六寸漆赤中諸侯以象飾天子以黄金飾皆畫赤雲氣今以黍寸之尺計之口徑八寸深四寸五分底徑六寸微殺乃容一斗之數流口徑可一寸然圖本又有作流長三寸者案鄭注既夕禮云流匜口也又士虞禮注云流匜吐水口也並不言流口寸數揆之人情流長三寸於義為近但周監二代損益可知當國家沿革之初庶為永式舊圖云内方外圎曰簋足髙二寸漆赤中臣崇義案鄭注地官舍人秋官掌客及禮器云圎曰簋盛黍稷之器有蓋象龜形外圎函方以中規矩天子飾以玉諸侯飾以象又案考工記旊人為簋受一斗二升髙一尺厚半寸脣寸又以黍寸之尺較之口徑五寸二分深七寸二分底徑亦五寸二分厚八分足底徑六寸又案賈䟽解舍人注云方曰簠圎曰簋皆據外而言也, SBCK: ''}
