  - {type: variant, offset: 1188, length: 373, content: 䟽匕注云挑謂之敮讀如或舂或抌之抌音由字或作挑者秦人語也注冩也鄭意以䟽匕挑匕皆有淺升狀如飯音鍫挑長柄可以抒物於器中者也抒直吕反取也挹也又引詩或舂或抌今詩抌作揄音由箋云舂而抒出之彼箋此注以抒為取挹兩義無差舊圖挑匕漆柄末及淺升中皆朱柄葉長短廣狹與䟽匕同雜記云畢用桑長三尺刊其柄與末孔䟽云主人舉肉之時以畢助主人舉肉也用桑者亦謂喪祭也吉時亦用棘末謂畢叉末頭亦刊削之也又特牲禮云宗人執畢先入鄭云畢狀如叉蓋為形似畢星故名焉舊圖云葉博三寸中鏤去一寸柄長二尺四寸漆其柄末及兩葉皆朱臣崇義案畢朼二制禮有明文喪祭用桑取其同名表有哀素吉祭用棘取其赤心盡其至敬蓋聖人制禮有以故興物者如此之深也今若以畢朼二物桑之與棘皆漆而丹之則亡哀素之情遐棄赤心之敬既無所法實謂不經今亦並圖於右兾擇而用之鉶以盛羮受一升口徑六寸有三足足髙一寸有兩耳有蓋士以鐡大夫以銅諸侯以白金飾天子以黄金飾舊, SBCK: 􅁥}
