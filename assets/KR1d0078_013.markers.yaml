  - {type: variant, offset: 551, length: 456, content: 凖案聘禮云餁一牢鼎九設于西階前九鼎者牛一羊二豕三魚四腊五腸胃同鼎六膚七鮮魚八鮮腊九設扃幂今謂牛羊豕三鼎有圖各自象其形自魚腊已下並無其制以其物之細雜無所象故也蓋所用者常鼎而已又舊圖瑚璉及牟形制容受與簠簋相同且瑚璉夏殷之禮器其牟在禮記内則是人之用器圖制既同今畧而不出牛鼎受一斛天子飾以黄金諸侯飾以白金今以黍寸之尺計之口徑底徑及深俱一尺三寸三足如牛每足上以牛首飾之羊豕二鼎亦如之此所謂周之禮飾器各以其類之義也羊鼎受五斗大夫亦以銅為之無飾今謂大夫祭用少牢故無牛鼎今以黍寸之尺計之口徑底徑俱一尺深一尺一寸豕鼎受三斗口徑底徑皆八寸深九寸彊士以鐡為之無飾今謂士祭用特牲故無羊鼎或說三牲之鼎俱受一斛案下有牛羊豕鼎扃長短不同鼎宜各異或說非也案公食大夫禮云幂者若束若編注云凡鼎幂蓋以茅為之長則束本短則編其中央此蓋令其緻密不洩氣也扃以舉鼎鄭注匠人云牛鼎之扃長三尺羊鼎之扃長二尺五寸豕鼎之扃長二尺漆丹兩端各三寸天子以玉飾兩端諸侯以黄金飾兩端亦各三寸丹飾雜記云朼以桑長三尺注云朼所以載牲體者也䘮祭用桑吉則用棘孔䟽引特牲記曰匕也舊圖下別有刻, SBCK: 准}
