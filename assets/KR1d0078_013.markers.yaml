  - {type: variant, offset: 93, length: 205, content: 者量名也依法制曰嘉量案漢書律厯志云本起於黄鍾之龠音籥以秬黍中者千有二百實其龠十龠為合十合為升十升為斗十斗為斛五量嘉矣其法用銅欲取同名所以同天下齊風俗也深尺六寸二分内方尺而圜其外旁有庣時彫反量耳其上為斛其下為斗其上謂仰斛也其下謂覆斛謂斛底受一斗左耳為升右耳為合其狀似爵以縻爵祿縻散也圜而函方左一右二隂陽之象也函音含其圜象規其重二鈞三十斤為鈞聲中黄鍾始於黄鍾而反覆焉君制器之象也此與周禮㮚氏為鬴法制頗同而容受各別釜, SBCK: 釡釡}
