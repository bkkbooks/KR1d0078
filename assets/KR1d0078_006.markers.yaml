  - {type: variant, offset: 2098, length: 282, content: 者外諸侯之士助君祭所射之侯也豻胡地野犬以豻皮飾侯亦方制為鵠其侯道五十弓侯鵠方廣並與天子豹侯同天子賔射射五正三正二正之侯若諸侯朝㑹於王張此三侯與之共射謂之賔射五正之侯九十弓亦三分其侯正居一焉凡畫正五正五采三正三采二正二采五采者先從中畫朱方二尺次白次蒼次黄次黑皆充尺寸使大如鵠蒼即青也以射者是相克相伐之事故還以南方為本其外白青等皆相克為次也又畫此五色雲氣以飾其側樂以騶虞九節此三正七十弓之侯亦三分其侯正居一焉三正之侯去𤣥黄餘同五正還以朱白青三色畫雲氣以飾其側此是諸侯朝王為賔所射之侯也凡畫雲氣用丹為地以丹淺於赤也故於丹上得見赤色之雲諸侯於已國射三正二正之侯樂以貍首七節, SBCK: ''}
