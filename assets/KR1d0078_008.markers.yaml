  - {type: variant, offset: 836, length: 531, content: 士之中長尺二寸首髙七寸背上四寸穿之容筭長尺二寸鄉射記曰鹿中髤前足跪鑿其背容八筭注云前足跪者象教擾之獸受負也賈釋云服不氏教擾猛獸有堪受負有不合受負者若今駞受負則四足俱屈又投壺禮孔義云其中之形尅木為之狀如鹿兕而伏鑿背盛筭大夫射於庠用兕中鄉射禮注云庠之制有堂有室也舊圖云兕似牛一角大小之制如鹿中鄉射記云君國中射則皮樹中注云國中城中也謂燕射也皮樹獸名賈釋云知城中是燕射者以下有賔射大射不在國故知城中是燕射也張鎰圖云皮樹人面獸形今文樹作豎諸侯立大學於郊若行大射於此大學則閭中鄉射記注云閭獸名如驢一角或曰如驢歧蹄諸侯與鄰國君射於境則虎中賈釋云與鄰國君射則賔射也以其主君有送賔之事因送則射舊圖云筭長尺二寸以實於中人四筭一偶八筭其數無常隨偶多少若鄉射記云籌八十謂十偶而言是數無常也又此云筭長尺二寸與投壺禮同其鄉射記筭長尺有握握四指也一指一寸是尺四寸也鄉射記曰楚扑長如笴刋本尺又曰射者有過則撻之注云刋其可持處扑刑器司射常佩之過謂矢揚中人也凡射時矢中人當刑之今鄉㑹衆賢以禮樂勸民而射者中人本意在侯去傷害之心逺是以輕之扑撻於中庭而已書曰扑作教刑案鄉射大射之義其射物在庠之楹間若丹若黒而午畫之從者長三尺横者曰距隨長尺二寸言距隨者謂先以左足履射物東頭為距後以右足來合而南面並立曰隨舊圖云決, SBCK: 决}
