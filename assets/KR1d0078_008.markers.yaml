  - {type: variant, offset: 1838, length: 797, content: 阮氏圖几長五尺髙尺二寸廣二尺兩端赤中央黒漆馬融以為長三尺案司几筵掌五几左右玉彫彤漆素詳五几之名是無兩端赤中央黒漆矣蓋取彤漆類而髤之也下云左右五几此經所云王皆立不坐設左右几者優至尊也祀先王唯言昨席不言几左者王馮之右者神所依詳此經義則似生人几在左鬼神几在右即下云右彫几右漆几右素几俱為神設也又云筵國賔左彤几為生者設也舊圖云士蒲筵長七尺廣三尺三寸無純其司几筵祀先王設莞繅次三種之席皆有純也又鄉射記蒲筵用緇布純又公食大夫記云蒲筵常注云丈六曰常又文王世子注云席之制廣三尺三寸三分龜人云取龜用秋時攻龜用春時上春釁龜祭祀先卜鄭以秋萬物成故取龜攻治也治龜骨以春者是時乾解不𤼵傷也上春謂夏正也釁之以卜神之也其卜即春灼後左夏灼前左秋灼前右冬灼後右燋存火之炬當灼龜之時用然楚焞也賈釋云燋鄭音雀者取莊子爝火之義熒熒然不絶菙氏音時髓反掌供燋契凡卜以明火爇燋遂龡其焌契然則焞焌契三字二名俱是一物皆用楚為之楚荆也當灼龜之時其菙氏以荆之焞契柱燋火之炬吹之其契既然乃授卜師灼龜開兆也明火以陽燧於日所取之火也易曰蓍之徳圓而神少牢禮史西面于門西抽下韇左執筮右兼執韇以擊筮注云將問吉凶故擊之以動其神韇藏簭之器賈釋云韇有二亦用皮為之其一從上向下韜之其一從下向上韜之士冠禮注云卦者有司所以畫地記爻也賈釋云古者用木畫地今則錢故少牢云卦者左坐卦以木故知古者畫卦以木也士冠禮云卒簭畫卦執以示主人注云畫卦者簭人以方冩所得卦賈釋云言所簭六爻俱了卦體得成更以方版畫卦體示主人也玉府職云共王之佩玉注云佩玉王之所帶者玉藻曰君子以玉比徳天子佩白玉而𤣥組綬詩傳曰佩玉上有葱衡下有雙璜衝牙蠙珠以納其間賈釋云佩玉王所帶玉謂佩於革帶之上者也所佩白玉謂衡璜琚瑀也𤣥組綬者用𤣥組絛穿連衡璜等使相承受所引韓詩傳佩玉上有葱衡者衡横也謂葱玉為横梁下有雙璜衝牙者謂以組縣於衡之兩頭兩組之末皆有半璧之璜故曰雙璜又以一組縣於衡之中央於末繫玉其狀如牙使前後衝突雙璜故曰衝牙案毛傳云衡, SBCK: ''}
