  - {type: line-break, offset: 74, content: '', id: KR1d0078_WYG_008-3b01}
  - {type: variant, offset: 74, length: 500, content: 舊圖云乏一名容似今之屏風其制從廣七尺以牛革鞔漆之今案大射禮謂之乏射人職謂之容鄭之兩注謂唱獲者所蔽以禦矢也賈釋云以容蔽其身故得禦矢言乏者矢至於此乏匱不去也又下文云凡乏用革即大射賔射等乏皆用革也司弓矢云大射燕射共弓矢并夾注云并夾矢籋音聶賈釋云矢籋之言出於漢時若王射則射鳥氏主取矢其矢著侯髙人手不能及則以并夾取之司弓矢掌王弧夾庾唐大六等之弓孔義以晉文公受王弓矢之賜以此唐大當彼彤玈以往來之體若一謂之唐大然則唐大是彊弱之名彤玈是弓所漆之色又弓人職云弓長六尺有六寸謂之上制上士服之弓長六尺有三寸謂之中制中士服之弓長六尺謂之下制下士服之此取人形貌長短與弓相稱為上中下三等各服其弓也又往體寡來體多謂之王弧當天子之弓合九而成規者也往來之體若一謂之唐大當諸侯之弓合七而成規者也往體多來體寡謂之夾庾當大夫之弓合五而成規者也六弓各有其名但赤漆者曰彤弓黒漆者曰玈弓彤矢玈矢各隨弓漆色為名射用乘矢象有事於四方也其笴皆長三尺羽六寸刃二寸又司弓矢有枉矢絜矢五分二在前三在後利火射用諸守城車戰其恒矢庳矢軒輖中用諸散射注云散射謂禮射及習射孔義云但弓矢相配彊弓用重矢弱弓用輕矢既唐大彊弱中恒矢軒輖中則彤玈二矢當恒矢若用之於戰則當枉矢矣鄉, SBCK: 郷}
