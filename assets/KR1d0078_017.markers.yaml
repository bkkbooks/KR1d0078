  - {type: variant, offset: 92, length: 844, content: 為裹屍首故也析其末者以後二脚於頤下結之既瑱幎目之後乃以前二脚倒結於項中瑱充耳也用白新緜為之幎目用緇方尺二寸赬裏著以絮注云幎目覆面者四角各有組繫皆於後結之幎鄭讀若詩云葛藟縈之之縈鬠笄用桑長四寸纋中鬠結也取㑹聚之義謂先以組束髮乃笄也注云桑之為言喪也為喪所用故以桑為笄取聲名之也笄長四寸者不冠故也若冠則笄長也古之死者但鬠笄而不冠婦人但鬠而無笄案下篇記云其母之喪鬠無笄注云無笄猶丈夫之不冠也王肅撰家語云孔子喪有冠者妄也纋中謂兩頭濶中央狹狹則於髮安故注云以安髮也喪大記云君錦冒黼殺綴旁七大夫𤣥冒黼殺綴旁五士緇冒赬殺綴旁三凡冒質長與手齊殺三尺註云既襲所以韜屍重形也殺冒之下帬韜足上行者也又士喪禮云冒緇質長與手齊赬殺掩足註云冒韜屍者制如直囊上曰質下曰殺質正也其用之先以殺韜足而上後以質韜首而下齊手上𤣥下纁象天地也孔義云於不縫之邊上下安七帶綴以結之綴旁五綴旁三尊卑之差也又賈釋云質正也者以其在上故以正為名質與殺相接之處則以線綴之使相連而不用帶二義相兼乃備言衾者今之被案喪大記小斂君錦衾大夫縞衾士緇衾皆一至大斂又制二衾君大夫士一也凡衾皆五幅布於絞上鄭云紟襌被也五幅白布為之别無縁飾也喪大記云紟五幅無紞註云紞被識生時禪被有識死則去之異於生也喪大記曰小斂以徃用夷衾夷衾質殺之裁猶冒也註云冒既襲所以韜屍重形也小斂又覆以夷衾裁猶制也孔義云小斂以往用夷衾者往猶後也小斂前有冒故不用夷衾自小斂後衣多不可用冒故用夷衾覆之其夷衾所用繒色及長短制度與質殺同但不復為囊及旁綴耳喪大記云小斂布絞縮者一横者三註云絞既斂所用束堅之者也縮從也孔義云謂從者一幅置於尸下横者三幅亦在尸下從者在横者之上每幅之末析為兩片以結束為便也喪大記云大歛布絞縮者三横者五布紟二衾君大夫士一也絞紟如朝服註云二衾者或覆之或薦之如朝服者謂布精麤如朝服十五升小斂之絞廣終幅析其末大斂之絞取布一幅直裂作三片而用之其横者五者亦謂取布二幅直裂為六片而用五片置於縮三之下皆欲其束之急也士喪禮云明衣裳用布又下記云明衣裳用幕布袂屬幅長下膝注云幕布帷幕之布升數未聞屬幅不削幅, SBCK: ''}
