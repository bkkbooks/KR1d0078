  - {type: variant, offset: 1736, length: 370, content: 也浴盤長九尺廣四尺深一尺有四周似輿漆赤中浴於中霤以此盤承牀下周禮淩人大喪共夷盤冰註云夷之言尸也實冰於夷盤中置之尸牀之下所以寒尸也尸之盤曰夷盤牀曰夷牀衾曰夷衾皆依尸而為言者也漢禮器制度大盤廣八尺長丈二尺深三尺漆赤中諸侯謂之大盤故喪大記云君設大盤造冰夷牀以遷尸長丈二尺廣七尺旁為四鐶前後亦有鐶為鈕於兩旁以繩直貫中欲下屍則引其直繩諸鈕悉解矣浴牀亦曰夷牀夷之為言屍也長丈二尺廣四尺有四横上有木策設欄于前面及後兩端士漆之大夫加珠飾諸侯畫雲氣天子加禾稼百草華也駔圭璋璧琮琥璜之渠眉䟽璧琮以斂尸註云以歛尸者於大斂時加之也駔讀為祖渠眉玉飾之溝瑑也以組穿聨六玉溝瑑之中以斂尸圭在左璋在首琥在右璜在足璧在背琮在腹蓋取象方明神之也䟽璧琮者通於天地䟽云知於大斂加之者以其六玉所與為飾明在衣裳之外故知在大斂後加之也云渠眉玉飾之溝瑑者此六玉兩頭皆有孔又於兩孔之間為溝渠, SBCK: ''}
