  - {type: variant, offset: 2927, length: 765, content: 司服云侯伯之服自鷩冕而下弁師注云侯伯繅七就繅玉皆三采每繅七成則七斿每斿亦貫七瑉玉計用玉九十八韍帶綬舄皆與上公同王祀昊天上帝助祭及朝王皆服之王者之後方伯王之子弟封為侯伯者皆服之以助王祭先公及饗射司服云子男之服自毳冕而下又弁師注云子男繅五就繅玉皆三采每繅五成則五斿每斿亦貫五瑉玉計用五十韍帶綬舄皆與侯伯同若朝王及助王祀昊天上帝祭先王先公饗射祭四望山川及自祭四望山川皆服之王者之後方伯王之子弟封為侯伯者皆服之以助王祭四望山川典命云公之孤四命以皮帛視小國之君又司服云孤之服自絺冕而下鄭注弁師云孤繅四就繅玉皆朱緑用玉三十二其服三章𤣥衣纁裳朱韍素帶𤣥華裨垂佩水蒼玉緇組綬赤舄黒絇繶純服以助祭社稷又張鎰圖云天子孤及卿皆六命則同絺冕之服三章小章則畫六上公及王之三公二王之後二伯九州之牧侯伯王之同姓封為侯伯者服之以助王祭社又玉藻云笏大夫魚鬚文竹孤亦同焉司服云卿大夫之服自𤣥冕而下注云朝聘天子及助祭之服諸侯非二王之後其餘皆𤣥冕而祭又弁師注云三命之卿繅三就繅玉亦朱緑用玉十八再命之大夫繅再就繅玉亦朱緑用玉八若王朝之大夫上公之卿得用三就之繅玉公之大夫子男之卿再命者得同再就之繅玉其服皆𤣥冕一章小章各依命數𤣥衣纁裳朱韍素帶𤣥華裨垂佩水蒼玉緇組綬赤舄黒絇繶純二伯九州之牧王之同姓封為侯伯者助王祭羣小祀視朔朝日皆服之爵弁制如冕但無旒為異士冠禮注云爵弁者冕之次謂尊卑次冕也張鎰退於韋弁之下亦非宜也其弁板亦廣八寸長尺六寸前圓後方弁上覆大冕俱用三十升布其色赤而微黒如爵頭然裏亦纁色一命大夫之冕亦無旒其制與爵弁不殊得名冕者一命大夫之冕雖無旒亦前低一寸二分故得冕稱其爵弁則前後平故不得冕名又士冠禮云爵弁服纁裳純衣緇帶韎韐注云此與君祭之服如自祭廟則服𤣥冠𤣥端純衣絲衣也衣皆用布唯冕與爵弁服用絲耳韎韐緼韍也士緼韍幽衡合韋為之士染以茅蒐因以名焉又士佩瓀玟玉而緼組綬纁屨黒絇繶純, SBCK: ''}
