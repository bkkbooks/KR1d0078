  - {type: variant, offset: 1292, length: 1398, content: 並畫充耳以合正文鷩冕七章享先公饗射之服鄭注弁師云鷩衣之冕繅九旒亦以五采繅繩貫五采玉每旒各十二玉垂於冕前後共一十八旒計用玉二百一十六鷩雉名即華蟲也華蟲五色蟲也故一曰華蟲二曰火三曰宗彝皆畫於衣四曰藻五曰粉米六曰黼七曰黻皆刺於裳韍帶綬舄皆與衮冕同毳冕五章祀四望山川之服案鄭義毳冕七旒亦合五采絲繩貫五采玉每旒各十二玉前後共十四旒計用玉百六十八毳畫虎蜼謂宗彝也故此五章初曰宗彝二曰藻三曰粉米皆畫於衣四曰黼五曰黻皆繡於裳藻水草也取其文如華蟲之義粉米取其潔又取其養人也粉米不可畫之物故皆刺繡於衣與裳也黼諸文亦作斧案繪人職據采色而言白與黒謂之黼若據繡於物上即為金斧之文近刃白近銎黒則曰斧取金斧斷割之義也青與黒為黻形則兩已相背取臣民背惡向善亦取君臣離合之義絺冕三章祭社稷五祀之服孔安國以絺為細葛上刺繡後鄭讀絺為紩或作黹本有此二文取紩為正既讀絺為紩紩刺也絺之三章粉米在衣是不可畫之物乃刺於衣上故得絺名則黼黻二章凖繡於裳也其冕五旒亦五采藻繩十有二就每旒各貫五采玉十二用玉百二十𤣥冕一章祭羣小祀之服賈疏云上四衣皆𤣥而有畫此衣不畫而無文其衣本是一𤣥故獨得𤣥名一章唯裳刺黻而已其冕三旒五采藻十二就每旒亦貫五采玉十二計用玉七十二羣小祀謂林澤墳衍四方百物之屬韋弁服者王及諸侯卿大夫之兵服後鄭云韋弁以韎韋為弁又以為衣裳春秋𫝊曰晉郤至衣韎韋之跗注是也今時伍伯緹衣古兵服之遺色矣其跗注賈服等以跗為足跗注為注袴而屬於跗後鄭讀跗為幅注為屬以韎韋如布帛之幅而連屬以為衣而表裳賈疏云伍行也伯長也謂鄭見漢時宿衞者之行長服此重赤之衣是古兵服赤色之遺象也天子亦以五采玉十二飾弁之縫諸侯以下各依命數玉飾之皮弁玉飾亦然士冠禮皮弁服素積緇帶素韠注云以白鹿皮為冠象上古也此明上古未有布帛衣其羽皮也又云積猶辟也以素為裳辟蹙其要中也亦用十五升布為衣以象弁色蓋天子素帶素韠朱裏朱緑終辟佩白玉白舄青絇繶純又弁師云王之皮弁㑹五采玉璂象邸玉笄注云㑹縫中也璂讀為綦綦結也邸謂下柢梁正張鎰圖云弁縫十二賈疏引詩㑹弁如星謂於弁十二縫中結五采玉落落而處狀似星也又於弁内頂上以象骨為柢至三王重質不變故王服之以日視朝燕諸公甥舅視學祭菜皆服焉賈疏云皮弁韋弁同但色異耳田獵則冠弁服後鄭云冠弁委貌也委安也服之所以安正容體也若以色言之則曰𤣥冠故士冠禮云主人𤣥冠朝服緇帶素韠其注云𤣥冠委貌也朝服則十五升緇布衣素裳白舄養老燕羣臣亦服之其諸侯不限畿内畿外視朝行道皆服之天子諸侯之卿大夫祭其廟亦皆同服之但白屨為別然則周之委貌殷之章甫夏之毋追並用緇布為之故有𤣥冠之名三代諸侯各為朝服以行道端取其正也士之𤣥端衣身長二尺二寸袂亦長二尺二寸今以兩邊袂各屬一幅於身則廣袤同也其袪尺二寸大夫以上侈之蓋半而益一然則其袂三尺三寸袪尺八寸司服云齊有𤣥端張鎰圖云天子齊𤣥衣𤣥冠𤣥裳黒韠素帶朱緑終辟佩白玉黒舄赤絇繶純諸侯唯佩山𤣥玉為別燕居朱裳朱韠赤舄黒絇繶純卿大夫素裳上士𤣥裳中士黄裳下士雜裳前𤣥後黄大夫以上朝夕服之唯士夕服之夕者若今晡上視事耳三公八命而下服毳冕者案射人職掌三公孤卿之位三公北面孤東面卿大夫西面以三公臣中最尊故屈使北面荅君也其摯執璧與子男同制故服毳冕與子男同也雖從毳冕五章其旒與小章皆依命數此所謂屈而伸者也玉繅亦皆三采每繅八成則八旒每旒八玉計用瑉玉百二十八諸家禮圖皆不載三公之冕臣崇義案弁師注於命爵之中獨著孤繅四就用玉三十二仰推王之三孤六命上極三公繅玉形制彩繪章數觸類可知故特圖於上公衮冕之右亦内外之次也, SBCK: ''}
