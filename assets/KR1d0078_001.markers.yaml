  - {type: variant, offset: 3878, length: 228, content: 別圖玉藻云朝服以日視朝於内朝鄭云朝服冠𤣥端素裳也又王制云周人𤣥衣而養老注云天子燕服為諸侯朝服彼云𤣥衣即此𤣥端也張鎰圖云緇𤣥二服素韠素帶朱緑終裨佩山𤣥玉白舄青絇繶純天子之卿服以從燕諸侯諸侯之孤卿大夫服以朝君士冠禮云𤣥端𤣥裳黄裳雜裳緇帶爵韠注云此暮夕於朝之服賈疏云謂嚮暮之時夕君之服也𤣥端即朝服十五升布衣也不言朝服而言𤣥端者欲見色而取其正也上云主人𤣥冠朝服此唯云𤣥端不言𤣥冠者但冠者三加冠始加緇布次皮弁次爵弁不加𤣥冠故不言也又說諸侯之士有三等之裳上士𤣥裳中士黄, SBCK: 别圗}
