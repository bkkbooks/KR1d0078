  - {type: variant, offset: 190, length: 582, content: 所謂繩墨誠陳不可欺以曲直䂓矩誠設不可欺以方圜也勅下諸官考詳後便下少府監依式樣製造其祭器則六尊六彝六罍鉶俎柶簋簠籩豆登爵玉爵坫圭瓉璋瓉并盤洗篚洗罍洗勺匜盤太罍龍勺概尊蜃尊散尊共四十三其玉器則蒼璧黄琮青圭赤璋白琥𤣥璜四圭有邸兩圭有邸圭璧璋邸射共十至六年並依定式様修訖已於郊廟行用案漢書律厯志云一黍之廣為分十分為寸十寸為尺一黍之廣謂以子穀秬黍中者孟康曰子北方也北方黒謂黒黍也師古曰此說非也子穀猶言穀子耳秬即黒黍也無取北方號中者不大不小者也言取黒黍穀子大小中者率為分寸也秬音巨又雜令云積秬黍為度者冕制則使之投壺記曰籌室中五扶注云籌矢也鋪四指曰扶一指案一寸又公羊傳曰膚寸而合何休云側手為膚案指為寸膚扶音義同又家語曰布指知尺然則爰自周世厯秦漢以及魏晉黍分指寸之尺見於禮志但禮神之玉冝眞比珉難得今自蒼璧以下圭玉之屬請依指寸之尺冠冕尊彝用木之類請用黍寸之尺黍有横竪故樞宻使王朴亦令定黍尺取竪黍尺以校管律典瑞云璧羨以起度先鄭云羨長也此璧徑長尺以起度量後鄭云羨不圜之貌蓋廣徑八寸袤一尺又案玉人職云璧羨度尺好三寸以為度先鄭解羨徑也好璧孔也爾雅云肉倍好謂之璧好倍肉謂之瑗肉好若一謂之環賈釋云引爾雅者欲見此璧好三寸也好即孔也兩畔肉各三寸則兩畔肉共六寸是肉倍好共為九寸也又後鄭云羨猶延也其袤一尺而廣狹焉是羨為不圜之貌也玉人造此璧之時應圜圜徑九寸今減廣一寸以益上下之袤一寸則上下一尺廣有八寸故云, SBCK: ''}
