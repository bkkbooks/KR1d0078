  - {type: variant, offset: 1809, length: 486, content: 世本云庖犧氏作五十絃黄帝使素女鼓瑟哀不自勝乃破為二十五絃具二均聲爾雅云大瑟謂之灑郭云長八尺一寸廣一尺八寸二十七絃舊圖云雅瑟長八尺一寸廣一尺八寸二十三絃其常用者十九絃其餘四絃謂之畨畨贏也頌瑟長七尺二寸廣尺八寸二十五絃盡用樂記云清廟之瑟朱絃疏越謂歌清廟之詩所彈之瑟練朱絲為絃不練則體勁聲清練則絲熟聲濁越瑟底孔熊氏以為瑟本兩頭有孔通疏相連使聲遲也以瑟孔小則聲急大則聲遲故疏之琴操曰伏羲造廣雅云琴長三尺六寸六分象三百六十六日廣六寸象六合又風俗通曰七絃法七星禮樂記曰舜作五絃之琴以歌南風舊圖云周文王又加二絃曰少宫少商蔡伯喈復増二絃故有九絃者二絃大次三絃小次四絃尤小蔡邕本傳無文未知舊圖據何為說又桓譚新論云今琴四尺五寸法四時五行亦練朱絲為絃周禮笙師掌教龡音吹竽笙先鄭云竽三十六簧賈疏引通卦驗云竽長四尺二寸註云竽管類用竹為之形參差象鳥翼鳥火禽火數七冬至之時吹之冬水用事水數六六七四十二竽之長取數於此也竽象笙三十六管宫管在中央舊圖云笙長四尺諸管參差亦如鳥翼禮記云女媧之笙簧爾雅云大笙謂之巢小者謂之和郭註云列管匏中施簧管端大者十九簧小者十三簧梁正意疑古之竽笙與今世竽笙不同恐誤故皆圖古今之法, SBCK: ''}
