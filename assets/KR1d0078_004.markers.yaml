  - {type: variant, offset: 2482, length: 497, content: 以絲多後生先用也祭人鬼四聲足矣路鼓路鼗四面鼓隂竹生於山北者龍門亦山名別子為祖此謂諸侯適子之弟別於正適故稱別子為祖者謂此別子子孫為卿大夫者立此別子為始祖也註云謂之別子者公子不得禰先君也此決上庶子王今諸侯庶子乃謂之別子是別為始祖若其世子不立庶子公子得有禰先君之義今云別子明適子在故謂之別子者公子不得禰先君也又云繼別為大宗此謂別子之世長子恒繼別子與族人為百世不遷之大宗繼禰者為小宗禰謂別子之庶子其庶子所生長子繼此庶子與兄弟為小宗故云繼禰為小宗也謂之小宗者以其五世則遷比大宗為小也即下云有五世則遷之宗其繼髙祖者也五世謂上從髙祖下至𤣥孫之子即合遷徙不得與族人為宗也知此五世則遷之宗是繼髙祖之子者以其繼髙祖者之身未滿五世而猶為宗記文略唯云繼髙祖者其實是繼髙祖者之子也大司徒職註云凡諸侯為牧正帥長及有徳者乃有附庸為其有禄者當取焉然則牧正帥長皆是諸侯有功者得有附庸為禄又諸侯有徳者雖不為牧正帥長亦得取閒田為附庸以為禄也又註云公無附庸侯附庸九同伯附庸七同子附庸五同男附庸三同進則取焉退則歸焉以天子畿方千里上公方五百里地極大故公無附庸侯附庸九同者謂侯有功進受公地但公五百里開方之百里者五五二十五侯四百里開方之四四十, SBCK: ''}
