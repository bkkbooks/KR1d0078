  - {type: variant, offset: 421, length: 247, content: 牀同則天子畫轅為龍加赤雲氣龍輴其制似輁軸亦長丈二尺廣四尺取稱於柩前一轅畫龍於轅加赤雲氣君殯以輴車備火之虞上有四周熬者以火熬榖使香以筐盛之將塗設於棺傍所以惑蚍蜉使不至棺也喪大記曰熬君四種八筐大夫三種六筐士二種四筐加魚腊焉鄭引士喪禮曰熬黍稷各二筐又曰設熬傍各一筐大夫三種加以粱君四種加以稻四筐則手足各一餘設於左右加魚腊者案特牲士腊用兎少牢大夫腊用麋天子諸侯無文當用六獸之屬耒耜象生時田器既夕禮耒耜在用器之中案周禮車人職云車人為耒庛長尺有一寸中直者三尺有三寸上句者二尺有二寸自其庛緣其外以至於首以弦其, SBCK: 􅇃}
