  - {type: variant, offset: 188, length: 355, content: 之侯也諸侯麋侯赤質謂以赤塗之使赤為地正面畫其麋之頭狀必知然者案貍首者射不來者之首也明熊麋以下皆正面畫其頭也王燕勞之時諸侯射此五十弓麋首之侯也亦畫雲氣飾其側卿大夫布侯畫以虎豹言布侯者謂不采其地直於布上正面畫虎豹頭狀亦畫雲氣飾其側王燕射則卿大夫射此五十弓虎豹首之侯也燕射必射此熊虎豹之首者不忘上下相犯也言此三獸皆猛不苟相下若君臣之道獻可者替否者不苟相從輒當犯顔而諫似此獸也故用之王燕射士射五十弓鹿豕之布侯者亦謂不采其地直於布上面畫鹿豕頭狀及畫雲氣以飾其側諸侯必射麋士必射鹿豕者志在君臣相養也案内則云麋鹿豕皆有軒並是可食之物故知相養也天子諸侯特射熊麋之首卿大夫士兼射虎豹鹿豕之首所謂君畫一臣畫二陽竒隂偶之數也此燕射自天子已下尊卑皆用一侯其侯道又皆五十弓弓二寸以為侯中同方一丈者降尊就卑之義以燕禮主於歡心故也夏后氏謂之, SBCK: 雷}
