  - {type: variant, offset: 76, length: 110, content: 則王以息燕註云獸侯畫獸為侯鄉射記曰凡侯天子熊侯白質諸侯麋侯赤質白質者謂以蜃灰塗之使白為地正面畫其熊之頭狀亦象正鵠三分其侯而處其一亦各畫雲氣飾其側燕謂王勞使臣與羣臣飲酒而射也息謂王休農息老物之後亦行此燕射之禮王自射此五十弓, SBCK: ''}
