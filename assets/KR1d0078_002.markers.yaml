  - {type: variant, offset: 1574, length: 384, content: 純白屨黒絇繶純黒屨青絇繶純此三者鞠衣已下之屨也然則屨舄王有三等后有六等也上公以下夫人得服褘衣者亦𤣥舄也後鄭讀揄狄為摇翟雉名青質五采故刻繒為揄翟之形而五采畫之綴於衣上以為文章然則揄翟之衣其色青后從王祭先公則服之首飾佩綬與褘衣同青舄白絇繶純侯伯夫人助君祭宗廟亦服之首飾亦副案褘揄二翟皆刻繒為雉形又以五采畫之綴於衣此亦刻繒為雉形不以五色畫之故云闕翟其衣色赤俱刻赤色之繒為雉形間以文綴於衣上後鄭云今世有圭衣蓋三翟之遺俗也鄭君見漢時有圭衣刻為圭形綴於衣上是由周禮有三翟別刻繒為雉形綴於衣上漢俗尚有故云三翟之遺俗也首飾佩綬一如二翟赤舄黒絇繶純其子男夫人從君祭宗廟亦皆服之鞠衣者后告桑之服也案後鄭云鞠衣黄桑之服色如鞠塵象桑葉始生月令三月薦鞠衣於先帝告桑事又彼注云先帝太昊之屬知非天帝者以其言先不言上故知非天春時唯祭太昊之屬薦鞠衣於神坐為蠶求福也以蠶功既大總祭五方帝於明堂故云之屬以該, SBCK: ''}
