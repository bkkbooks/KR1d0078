  - {type: variant, offset: 3399, length: 308, content: 古駕四馬輈上曲句衡輈轅也衡軛也轅從軫已前稍曲而上至衡輈居衡上向下句之衡居輈下如屋之梁然詩所謂梁輈也先以驂馬内轡繫於軾又有㳺環貫驂馬之外轡㳺移前郤在服馬之背以止驂馬之外出又服馬之外各以一條皮上繫於衡後繫於軫在服馬脇謂之脇驅以止驂馬之内入二服夾轅其頸負軛兩驂在旁施靷助之是於隂版之前隂版揜軌也以皮為靷前約驂馬之胷内繫於隂版外繫於軸以引之然則此車衡長六尺六寸止容二服而已兩驂頸不當衡故別為一靷以約馬胷引車軸也又以韅在馬背拘持二靷案士昬禮壻乘墨車士棧車大夫墨車壻是士子得乘墨車者攝盛故也大夫已上革鞔而漆之士棧車亦漆之但無革鞔與大夫為異耳鞔音莫干反考工記曰棧車欲弇音掩飾車欲侈然則大夫以上皆革鞔以飾其輿又有漆飾故得飾車之名士卑, SBCK: ''}
