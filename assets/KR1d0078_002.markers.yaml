  - {type: variant, offset: 2747, length: 281, content: 房亦云爵弁服皮弁服褖衣此褖衣當𤣥端處所以變言之者冠時𤣥端衣裳別及死而襲𤣥端連衣裳與婦人褖衣同故雖男子𤣥端亦名褖衣也又見子羔襲用褖衣纁衻鄭注士昬禮云衻亦縁也褖衣纁縁是婦人嫁時之服亦非常衣也今子羔襲之故譏用婦服但纁衻與𤣥衣相對之物則男子褖衣黒矣男子褖衣既黒則婦人褖衣黒可知矣纁衻當嫁之女所服也士昬禮云女次純衣纁衻立于房中南面注云次首飾今之髲也周禮追師掌為副編次純衣絲衣也此衣亦𤣥色衻縁也衻之為言任也以纁縁其絲衣象隂氣上任於陽也取交接有依之義凡婦人不常施衻之衣盛昬禮為此服耳喪大記曰復不以衻明非常衣也詩武王女下嫁齊侯之子車服不繫其夫下王后一等乗厭翟服褕翟加纁衻首飾亦副, SBCK: ''}
