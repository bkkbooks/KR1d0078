  - {type: line-break, offset: 4406, content: '', id: KR1d0078_WYG_002-22a07}
  - {type: variant, offset: 4422, length: 360, content: 岀太子詹事尹拙議云今新圖不以金飾諸末乃引通典云自兩漢晉宋齊皇后唯乗重翟金塗五末轅一轂二箱二至後魏始說厭翟亦金飾諸末又云不畫八轡者工部尚書竇儀議云臣儀今詳新圖繢總鞶帶車未之飾皆已正矣其帷裳所畫翟雉但云以類求之臣亦檢尋未見本義所闕八轡請令畫之士昬禮質明賛見婦于舅姑婦執笲棗栗自門入升自西階進拜奠于舅席又降階受笲腶脩升進北面拜奠于姑席下記云笲緇被纁裏注云被表也笲有表者婦見舅姑以飾為敬賈又釋上注云笲竹器而衣者以字從竹故知是竹器也其形蓋如今之筥􅹫蘆矣音墟盧漢時有筥􅠚蘆故舉之以況笲也但漢法去今逺其狀無以知之或見圖中如筥狀其口微弇而稍淺今取以為法笲音煩又舊圖讀如皮弁之弁以繒衣之容一斗昬禮記云笲緇被纁裏加于橋注云橋所以庪笲其制未聞庪居委反舊圖云讀如橋舉之橋以木為之似今之步案髙五尺下跗午貫舉笲處亦午為之此則漢法也既周制無聞今亦依用, SBCK: 校}
