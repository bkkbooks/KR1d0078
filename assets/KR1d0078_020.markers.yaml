  - {type: variant, offset: 11634, length: 0, content: '', SBCK: 三禮圖記銀靑光禄大夫行尚書左丞兼太子賔客判國子監上柱國李至撰首在唐虞降及三代因商革夏莫盛於周雖復中庸曰威儀三千禮器曰經禮三百而黜其繁縟考彼㑹歸則周儀二書洎先儒作記通而爲三吉凶軍賔嘉舉而有五五禮之制三禮備焉三禮圖者國子司業聶崇義之所纂也國初太祖皇帝雖經營四方右武戡難而制禮作樂􅀹所寘懷建隆中詔儒臣深於禮者俾加詳定崇義實膺選焉由是得唐相張鎰洎諸家所撰凡六夲以其詳畧不􅀋靡所適從魚魯或差將疑後學乃手自校定達禮者無譏焉書成奏御天子嘉之詔國學圖于宣聖殿後北軒之屋壁歳月滋乆風雨浸淫畫闇泥落無復完堵聖上聦明睿哲首冠百王留連周孔之文憲章堯舜之道凡曰墜典罔不修明矧玆盛事豈容曠闕乃命改作取諸大壯即於論堂之上以版代壁成之不日丹青爛然至􅀂圎丘方澤之規明堂璧雝之制車服旂常之象籩豆簠簋之數管磬笙竽之器琮璜珪瓉之質隨其義􅀋咸以註解所謂遽數則不終悉數則更僕烏戲安上治民莫善於禮移風昜俗莫善於樂故曰禮云禮云豈玉帛云乎哉樂云樂云豈鐘鼔云乎哉然則不僭不偪上下有序非玉帛不能成其禮或風或雅聲詩所播非鐘鼔不能考其樂蓋先哲之立言也微顯闡幽以爲禮樂之大不獨玉帛鐘鼔而巳是知安上治民移風昜俗者禮樂之夲也玉帛鐘鼔者禮樂之末也其或專於夲則玉帛鐘鼔之義廢矣泥於末則安上治民移風昜俗之道逺矣惟聖人務其夲以求理存其末以致用故能通天下之變而至於道也不其然乎新圖旣成孰不改觀與夫畫洛神之賦事或馮虚尚列女之屏誠非好德豈同年而語哉至以末學獲在庠序輙書梗槩願示將來于時至道二年歳次丙申月日記三禮圖記三禮圖余襲藏乆矣嘗欲刋之梓與同志共之家貧未之能也中間遼東唐括師皐為置書版矣工費猶無從岀也丙午夏余以涪翁昜文定公春秋傳授諸生於􅁑廬時潞城王貢文舉曁濮陽聶君天佐耒過聽講畢偶及是圖文舉曰無它求鄭侯歸當為先生成之余應曰諾然亦未必其言之讎也未幾文舉不幸不起余哭之館中後數月鄭侯北還次日過余衡茅共話文舉憫悼乆之又次日乃遣其客于寅子隹來曰君所欲刋之書何在請命工計之余曰余與文舉語時鄭侯在北也鄭侯歸文舉巳矣此言何以逹鄭侯也子日文舉病中嘗以此見属鄭侯歸問文舉臨殁何所道余以是告故特遣某來余聞不覺為之長嘆焉何則文舉布衣士也鄭侯國家大將軍也寒士臨終之語且傳聞之辭何足介􅅐次乃拳拳如是則文舉平日所以取信於人鄭侯平日􅀁以不忘乎舊是可以觀其故矣漢翟公曰一死一生乃見交情一貧一冨乃知交態一貴一賤交情乃見世人親戚故舊􅀔利相交未必不以管鮑自許而當靣輸誠背靣􅀏有不待臨死生利害而相傾䧟者滔㴞矣孰謂伐木不歌谷風變雅後尚有如我鄭侯之於文舉乎此天理民彞之未盡泯真可以勵薄俗也雖然鄭侯武緯文經勲名乆當書史􅁽此固不足多道而吾文舉垂殁切切斯文之意子隹道舊能成故交之心則不可使之泯没於後丗也故特書是圖後使二人姓名與是圖相為不朽云次年季春朔旦長􅀯陽山昌元王履書于楚梓堂}
