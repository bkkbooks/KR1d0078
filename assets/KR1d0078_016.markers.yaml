  - {type: variant, offset: 5012, length: 287, content: 僕死於宫中者三月不舉祭不舉謂廢也故庶子因是為母緦也有死即廢祭者不欲聞凶人故也貴臣貴妾貴臣室老也貴妾姪娣也以貴皆服緦乳母以名服也慈己者從祖兄弟之子曾孫𤣥孫也父之姑謂己為姪孫從母昆弟以名服甥舅相報壻及妻之父母相報姑之子外兄弟報舅之子内兄弟與舅皆從服夫之姑姊妹之長殤夫之諸祖父母報夫之從父昆弟之妻同堂娣妹降於親娣姒故緦昆弟之孫長殤從父昆弟之子長殤齊衰之殤中從上大功之殤中從下改葬緦註云謂墳墓以他故崩壊將亡失屍柩者也他故謂水潦漂蕩故須别處改葬服緦者臣為君子為父妻為夫據此三等痛極者服之以其君親喪亡已久可以無服但親見君父之屍柩暫時之痛不可制服故皆服緦亦三月而除法天道也三禮圖集注卷十六, SBCK: ''}
