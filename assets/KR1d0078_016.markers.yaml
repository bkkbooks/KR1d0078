  - {type: variant, offset: 4483, length: 317, content: 命婦相弔以錫衰亦云十五升抽其半無事其縷有事其布曰錫註云錫者不治其縷哀在内也緦者不治其布哀在外也然則二衰升數雖同但錫衰重故治其布不治其縷哀在内也此緦麻衰治縷不治布哀在外故也八十縷為升十五升千二百縷抽其半六百縷縷麤細如朝服數則半之可謂細而䟽服最輕故也緦冠雜記曰緦冠澡纓斬衰冠繩纓纓重於冠齊衰已下布纓纓與冠等上傳曰齊衰大功冠其受緦麻小功冠其衰則此云緦麻冠者冠與衰同用緦布但澡纓者以其灰澡治布為纓與冠别以其冠與衰皆不治纓則澡治之以其輕故特圖冠纓相連者以異於上敘服族曽祖父母己之曾祖親兄弟也族祖父母亦髙祖之孫己之祖父從父昆弟上至髙祖四世族父母己之父從祖昆弟也族昆弟己之三從兄弟皆名為族然自三族上至族曽祖父母傍四出同出髙祖謂之四緦麻庶孫之婦緦以適, SBCK: 國}
