  - {type: variant, offset: 2446, length: 509, content: 姑姊妹女子子適人者世父叔父之子從父兄弟也從父姊妹在室者亦如之為人後者為其昆弟為人後者降兄弟服大功庶孫男女同適婦重適女子子適人者為衆昆弟父在則同父没而為父後者服朞也姪丈夫婦人姪男姪女夫之祖父母世父母叔父母夫之昆弟之女適人者女子子嫁者未嫁者為世父母叔父母姑姊妹妾為女君之黨已上皆服正大功者繐衰裳牡麻絰既葬除之者諸侯之大夫為天子服也傳曰繐衰者何以小功之繐也記曰繐衰四升有半其冠八升賈釋云諸侯之大夫天子之陪臣以時㑹見於天子而服之以天子七月而葬既葬而除故降在大功九月下其縷雖如小功升數又少故在小功上也此不言帶屨者以其傳云小功繐衰則帶屨亦同於小功也治其縷如小功而成布四升半細其縷者以其陪臣服此繐衰恩輕故也諸侯為天子服至尊義服斬縷如三升半今陪臣降君改服至尊加一升為四升半精麤升數在齊衰之中者不敢以兄弟服服至尊也凡布細而䟽者謂之繐漢時南陽鄉鄧氏造布有名繐者謂之鄧繐連衣裳婦人服特圖此者明斬衰至緦麻婦人衰裳皆然殤小功布衰裳澡麻帶絰五月註云澡者治去莩垢不絶其本也小記曰下殤小功帶澡麻不絶本詘而反以報之賈釋云此殤小功章本齊衰大功之親為殤死降在小功者故在成人小功之上言小功者對大功是用功麤大則小功是用功細小精密者也自上已來皆帶在絰下此章帶在絰, SBCK: ''}
