  - {type: variant, offset: 1421, length: 686, content: 為無祭主故也為君之父母妾為女君婦為舅姑夫之昆弟之子君女皆是公妾大夫之妾為其子女子子為祖父母公妾及士妾為其父母此皆齊衰期不杖麻屨者也此齊衰不用草寄公為所寄之國君服齊衰三月凡男女為大宗子及宗子母妻女謂女子子在室及嫁歸宗者也皆齊衰三月尊祖之義也致仕者畿内之民庶人在官者為君皆三月君之母妻繼父本同居今不同者及曾祖父母與髙祖同冝服小功而服齊衰三月者重其衰麻尊尊也減其日月恩殺也女子子嫁於大夫者二十成人而未嫁者為曽祖父母皆齊衰三月自寄公已下皆義服三月者日月既少故在不杖之下而書寄公在上者此章既論義服故以踈者為首大功布衰裳牡麻絰無受者此直言絰不言纓絰者以其本服齊斬今為殤死降在大功者故次在正大功之上義齊衰之下凡喪既葬變麻服葛若成人則以此輕服受之此云無受以殤文不縟故不以此輕服受之也又傳云不樛垂者謂不絞帶之垂者也大功已上於小歛前皆散帶之垂者至成服乃絞之小功已下初便絞之今殤在大功者於小歛前及成服後皆散垂不絞以示未成人故與成人殊傳曰年十九至十六為長殤十五至十二為中殤十一至八歳為下殤不滿八歳已下皆為無服之殤無服之殤以日易月以日易月之殤殤而無服故子生三月則父名之死則哭之未名則不哭以日易月者謂生一月者哭之一日也殤而無服者哭之而已叙服子女子子之長殤中殤殤者男女未冠笄而死可哀傷者也叔父姑姊妹適孫庶子為適昆弟夫之昆弟之子公之適子大夫之適子而在長殤中殤者其長殤皆九月纓絰其中殤皆七月不纓絰公君也通五等及大夫為適子皆是正統成人斬衰今為殤死不得著代故入大功絰有纓者為其情重也自大功已上絰有纓以一條繩為之小功已下絰無纓也絰之有纓所以固絰猶如冠之有纓以固冠亦結於頤下也大功中殤七月絰無纓五服之正無七月之服唯, SBCK: 爲无}
