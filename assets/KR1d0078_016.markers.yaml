  - {type: variant, offset: 860, length: 276, content: 牡麻絰右本在上者也斬衰絰不言麻此齊衰絰見麻者彼有杖杖亦苴故不得言麻此絰文孤不兼杖故得言麻也牡麻枲麻也冠布纓如斬衰繩纓亦通屈一條布為武垂下為纓著之於冠斬衰冠繩纓退在絞帶下使不象垂也齊衰冠布纓無此義故進之使與絰同處削杖桐也為母杖桐者桐之言同也欲取内心悲痛同之於父也以桐外無節象家無二尊故外屈於父為之齊衰經時而有變也又按變除云削之使下方者取母象於地也上苴杖此削杖雖不言杖之麤細案喪服小記云絰殺五分而去一杖大如絰註云如腰絰也腰絰五寸二十五分寸之十九必知如腰絰者以杖從心已下與腰同處故也又云杖者皆下本者從木性也本根也各齊其心者杖以扶病病從心起故杖之髙下以心為斷也, SBCK: ''}
