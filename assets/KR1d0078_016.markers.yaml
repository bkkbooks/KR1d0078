  - {type: variant, offset: 4801, length: 210, content: 之婦大功庶子之婦小功適孫之婦亦小功明庶孫之婦緦麻是其差也從祖姑姊妹適人者報從祖父從祖昆弟之長殤從祖父長殤者謂叔父者也外孫以女外出適而生故曰外孫從父昆弟姪之下殤成人大功長殤小功今下殤故緦夫之叔父之中殤下殤成人大功長殤小功中殤從下故在此章從母之長殤報庶子為父後者為母緦傳問何以緦也與尊者為一體不敢服其私親也父子一體如首與足妾非正故云私親又問既云不敢服其私親即應全不服何又服緦也荅有死於宫中者則為之三月不舉祭因是以服緦也云假有, SBCK: 司業兼太常博士柱國賜紫金魚袋}
