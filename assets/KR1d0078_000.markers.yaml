  - {type: variant, offset: 93, length: 12, content: 等謹案三禮圖集注二十卷宋, SBCK: ''}
  - {type: variant, offset: 108, length: 682, content: 撰崇義洛陽人周顯徳中累官國子監司業世宗詔崇義參定郊廟祭玉因取三禮圖凡得六本重加考訂宋初上於朝太祖覽而嘉之詔頒行考禮圖始於後漢侍中阮諶其後有梁正者題諶圖云陳留阮士信受學於潁川綦母君取其說為圖三卷多不按禮文而引漢事與鄭君之文違錯正稱隋書經籍志列鄭元及阮諶等三禮圖九卷唐書藝文志有夏侯伏朗三禮圖十二卷張鎰三禮圖九卷崇文總目有梁正三禮圖九卷宋史載吏部尚書張昭等奏云四部書目内有三禮圖十二卷是開皇中勅禮部修撰其圖第一第二題云梁氏第十後題云鄭氏今書府有三禮圖亦題梁氏鄭氏則所謂六本者鄭元一阮諶二夏侯伏朗三張鎰四梁正五開皇所撰六也然勘驗鄭志元實未嘗為圖殆習鄭氏學者作圖歸之鄭氏歟今考書中宫室車服等圖與鄭注多相違異即如少牢饋食敦皆南首鄭注云敦有首者尊者器飾也飾葢象龜周之制飾器必以其類龜有上下甲此言敦之上下象龜上下甲葢者意擬之辭而是書敦與簠簋皆作小龜以為葢頂是一器之㣲亦失鄭意沈括夢溪筆談譏其犧象尊黄目尊之誤歐陽修集古録譏其簋圖與劉原父所得真古簋不同趙彦衛雲麓漫鈔譏其爵為雀背承一器犧象尊作一器繪牛象林光朝亦譏之曰聶氏三禮圖全無來厯榖璧則畫榖蒲璧則畫蒲皆以意為之不知榖璧止如今腰帶上胯上粟文耳是宋代諸儒亦不以所圖為然然其書抄撮諸家亦頗承舊式不盡出於杜撰淳熈中陳伯廣嘗為重刻題其後云其圖度未必盡如古昔苟得而考之不猶愈於求諸野乎斯言允矣今姑仍其舊帙録之以備一家之學此書世所行者為通志堂刋本或一頁一圖或一頁數圖而以說附載圖四隙行欵參差尋覽未便惟内府所藏錢曽也是園影宋抄本每頁自為一圖而說附於後較為清整易觀今依仿繕録焉乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀三禮圖, SBCK: ''}
