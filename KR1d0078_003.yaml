body:
  text: 三禮圖集注卷三宋聶崇義撰童子服將冠者緇布冠三制太古冠新增緇布冠新增頍項上音丘委反青組纓纚皮辨爵辨笄紘篋簞匴委貌如進賢冠委貌如皮辨者委貌張鎰圖制委貌梁正法毋追音牟堆章甫周辨通天冠逺遊冠髙山冠長冠一名齊冠法冠建華冠武辨大冠術氏冠方山冠巧士冠卻非冠樊噲冠卻敵冠章甫冠別一法四冕叔孫通稽周法三冠皆進賢冠梁正修阮鄭等圖以童子之服繫冕辨之末不連緇布皮辨等服張鎰圖以童子服連緇布冠下盡殷冔夏收以通天逺遊已下為不出三禮經義別編於下卷今案士冠禮云將冠者采衣紒其將冠者即童子二十者也將行冠禮始加緇布次加皮辨次加爵辨若本其行事敘將冠之服列於緇布之上於理為當今依而次之仍升童子之服為卷首下梁之古冠庶得兩從知禮之自也童子采衣紒故士冠禮云將冠者采衣紒注云采衣未冠者所服玉藻云童子之飾也緇布衣錦緣錦紳并紐錦束髮皆朱錦也紒結髮也賈疏云將冠者即童子二十者也以其冠事未至故言將冠童子既不帛襦袴不裘裳故以錦為緇布衣緣飾又以錦為大帶及結紳之紐故云錦紳并紐也紐長與紳齊又以錦為之束髮總此紒紒謂結髮也詩云總角丱兮是也皆用朱錦飾者以童子尚華示將成人有文德故皆用錦示一文一質之義衣襦袴并緇布是質也黑屨無絇青繶純又盧植云童子紒似刀環舊圖云始冠緇布今武士冠則其遺象也大小之制未聞梁正又云師説不同今傳疏二冠之象又下有進賢皆云古之緇布冠之遺象其張鎰重修亦云舊圖有此三象其本狀及制之大小未聞此皆不本經義務在相沿疾速就事今別圖於左庶典法不墜緇布冠始冠之冠也記曰太古冠布齊則緇之其緌也孔子曰吾未之聞也此主謂大夫士無緌耳諸侯始加緇布冠繢緌其頍項青組纓則與士同其士以青組纓結於頤下無緌自士已上冠訖則弊去之不復著也然庶人猶著之故詩云彼都人士臺笠緇撮謂彼都邑人有士行者以緇布為冠撮持其髮檀弓曰古者冠縮縫今也衡縫注云縮從也衡讀為橫孔疏云縮直也古謂殷已上質吉凶冠皆直縫直縫者辟積少故一一前後直縫之其冠廣三寸落頂前後兩頭皆在武下向外出反屈之縫於武辟積三皆厭伏今即周也周尚文多辟積不復一一直縫但多作􅙭音輒并橫縫之故周吉冠多辟􅙭而橫縫又以冠兩頭皆在武上向內反屈縫之既吉凶相變其喪冠質猶疏辟􅙭而右直縫之以兩頭皆在武下向外反屈縫於武故得厭伏之名其吉冠則左辟􅙭而橫縫之詳此文義法式顯然梁正言大小之制未聞一何固也張鎰棄古今之順説斯焉舍諸今依經疏述而圖之頍經作缺注讀如有頍者辨之頍緇布冠無笄著頍圍髮際結項中隅為四綴以固冠也項中有􅕒亦由固頍為之賈釋曰頍項者謂於頍兩頭皆有􅕒別以繩穿於􅕒中於項上結之因名頍項既結頍於項則頍上四綴當首之四隅以四綴上屬於冠武然後得冠頍之安穩謂別以繩穿項中之􅕒結之因得頍之牢固故云亦由固頍為之士冠禮云青組纓屬於頍此謂緇布冠無笄乃以二條之組兩相屬於頍既屬訖則以所垂絛者於頤下結之故注云無笄者纓而結其絛也士冠禮曰緇纚廣終幅長六尺注云纚一幅長六尺足以韜髮而結之此謂用纚韜髮訖乃為紒矣士冠禮注云皮辨以白鹿皮為之象太古又舊圖云以鹿皮淺毛黃白者為之髙尺二寸周禮王及諸侯孤卿大夫之皮辨會上有五采三采二采玉璂象邸唯不言士之皮辨有此等之飾凡於圖中重見者以其本旨不同也此解士冠禮三加次加皮辨是以重出他皆類此爵辨鄭云冕之次也其色赤而微黑如爵頭然用三十升布為之亦長尺六寸廣八寸前圓後方無旒而前後平士冠禮云皮辨笄爵辨笄注云笄今之簪也梁正阮氏圖云士以骨大夫以象士冠禮云緇組紘纁邊此謂皮辨爵辨皆有笄故設此紘也先以組一頭於左笄上繫定乃繞頤下右相向上屬於笄屈繫之垂餘為飾纁邊者以緇為中以纁為邊側而織之也舊圖紘兩頭別出細帶甚誤士冠禮注云隋方曰篋謂方而殺其角也又經云同篋鄭以緇布冠已下凡六物同篋故賈釋云緇布冠屬於頍共為一物緇纚長六尺二物也皮辨笄三物也爵辨笄四物也其緇組紘纁邊皮辨爵辨各有一則為二物通四為六物也士冠禮云櫛實于簞注云簞笥也又曲禮注云圓曰簞方曰笥笥與簞方圓有異此云簞笥也共為一物者鄭舉其類也士冠禮云爵辨皮辨緇布冠各一匴執以待于西坫南注云匴竹器名今之冠箱也舊圖畫而圓梁正改而方舊匴在爵辨之下今依經次於簞後委貌一名玄冠故士冠禮云主人玄冠朝服注云玄冠委貌也舊圖云委貌進賢冠其遺象也漢志云委貌與皮辨冠同制案張鎰圖諸侯朝服之玄冠士之玄端之玄冠諸侯之冠辨此三冠與周天子委貌形制相同則與進賢之遺象皮辨之同制者逺相異也其梁正因阮氏之本而圖委貌與前三法形制又殊臣崇義詳此委貌之四狀蓋後代變亂法度隨時造作古今之制或見乎文張氏僅得之矣今並圖之於右兾來哲所擇舊圖云毋追音牟堆殷曰章甫周曰委貌委貌制已見上後代轉以巧意改新而易其名耳其制相比皆以漆布為殼以緇縫其上前廣四寸髙五寸後廣四寸髙三寸章甫委大章其身也毋追制與周委貌同殷冠委大臨前夏冠委前小損臣崇義案郊特牲曰委貌周道也章甫殷道也毋追夏后氏之道也孔疏云三代恆服行道之冠俱用緇布其形自別既言俱用緇布為之則緇布冠是委貌等矣蓋布有粗縟各為一名又漢志云長七寸髙四寸制如覆杯前髙廣後卑鋭所謂夏之毋追殷之章甫者也毋追有覆杯之狀但古法難識依文觀象備圖於右庶合遺制他皆類此案王制疏與舊圖云周曰辨殷曰冔夏曰收三冠之制相似而微異俱以三十升漆布為之皆廣八寸長尺六寸前圓後方無旒色赤而微黑如爵頭然前大後小殷冔黑而微白前小後大收純黑亦前小後大三冠下皆有收如東道笠下收矣又後漢志云爵辨一名冕廣八寸長尺二寸如爵形前小後大繪其上似爵頭色有收持笄所謂夏收殷冔者也祠天地五郊明堂雲翹舞樂人服之禮曰朱干玉戚冕而舞大夏此之謂也又案士冠禮云周辨殷冔夏收注云其制之異未聞謂夏殷禮亡其制與周異同未聞故下不圖夏殷二冠之象張鎰亦略而不取後漢志云通天冠髙九寸正竪頂少斜郤乃直下為鐵卷梁前有山有展筒乘輿常服服深衣制如袍隨五時五色漢受於秦禮無文或曰周公抱成王燕居故施袍兩存者圖制或殊更存一法他皆類此逺遊冠後漢志云如通天冠有展筒無山題又案唐典云逺遊三梁冠黑介幘青緌諸王服之若太子及親王即加金附蟬九首施珠翠纓翠緌犀簪導漢志曰髙山冠一曰側注冠制如通天頂不斜郤直竪無山題展筒蔡雍獨斷曰鐵為卷梁髙九寸胡廣曰髙山冠蓋齊王冠也秦滅齊以其君冠賜近臣謁者服之又史記酈生謁髙祖其冠側注漢舊儀曰乘輿冠髙山冠幘耳赤丹紈裏丹色之纓後漢志云長冠一曰齊冠前髙七寸廣三寸而後促漆纚為之制如版以竹為裏初髙帝微時以竹皮為之謂之劉氏冠楚冠制也祀宗廟諸祀則冠之皆袀玄袀居勻反獨斷曰紺繒也吳都賦注云袀皂服也法冠後漢志一曰柱後冠髙五寸以纚為之展筒以鐵為卷柱取其直而不橈也又唐志云法冠一名獬豸冠以鐵為柱上施珠二枚或曰獬豸神羊取別曲直楚王獲之故以為冠秦滅楚以其君服賜執法者侍御史廷尉正監平皆服之建華冠後漢志云以鐵為柱卷貫大銅珠九枚前圓又飾以鷸羽於頂祀天地五郊八佾舞人服之武冠後漢志云一曰武辨大冠武官冠之其制古緇布之象也侍中中常侍加黃金璫附蟬為文貂尾為飾胡廣曰趙武靈王效胡服以金璫飾首前歃貂尾為貴職秦滅趙以其冠賜近臣以金蟬貂尾飾者金取堅剛百鍊而不耗蟬取居髙飲露而不食貂取內徑捍而外溫潤毛采紫蔚而不彰灼術氏冠即鷸冠也前漢書五行志注云鷸知天將雨之鳥也故司天文者冠鷸冠吳制差池四重髙下有行畫鷸羽為飾紺色又注云此術氏冠即鷸冠也新圖誤題為術士冠太子詹事尹拙議云舊圖皆為術氏冠仍案顔師古刊謬正俗云鄭子華之弟子臧出奔宋好聚鷸冠刊字本與御名同不欲斥之故改焉又云鷸水鳥天將雨則鳴古人以知天時乃為冠象此鳥形使掌天文者冠之故逸禮記曰知天文者冠鷸冠此其證也鷸音聿亦音術蔡雍獨斷謂為術氏冠亦因鷸音轉為術耳非道術之謂也今謂於術士冠下添云亦謂之術士冠工部尚書竇儀議曰臣儀今詳術士冠已依舊圖改為術氏冠方山冠後漢志云制似進賢前髙七寸後髙三寸纓長八寸似進賢冠五采縠為之祠宗廟天子八佾四時五行樂人服之冠衣各如其行方之色又景帝紀云髙廟奏武德文始五行之舞禮樂志曰武德髙帝所作也文始舜舞也五行周舞也武德者舞人執干戚舞也文始者舞人執羽籥舞也五行舞者舞人冠冕衣服法五行色也巧士冠後漢志云前髙七寸本或作五寸繞後相通直竪不常服唯郊天黃門從官四人冠之在鹵簿中次乘輿前以備宦者四星也郤非冠後漢志云制似長冠下促宫殿門吏僕射冠之舊圖云髙五寸樊噲冠後漢志云樊噲造次所冠以入項羽軍廣九寸髙七寸前後各出四寸制似冕司馬殿門衛士服之或曰樊噲常持鐵楯聞項羽有意殺漢王噲裂裳裹楯冠之入羽軍立漢王側視項羽舊圖如巧士冠既違漢志不敢依從卻敵冠後漢志云前髙四寸後髙三寸通長四寸注舊圖通作纓制似進賢衛士服之禮無明文舊圖云章甫殷冠亦名冔紵中冒上黑屋十月行禮服之臣崇義案王制云夏后氏收而祭殷人冔而祭周人冕而祭又郊特牲云委貌周道也章甫殷道也毋追夏后氏之道也然則章甫是殷之行道之冠冔是殷之祭冕朝祭異服顯有明文而梁正等皆云章甫亦名冔誤之甚也言行道及朝皆冠章甫不可更名為冔也今依紵中冒上以黑屋之制別存章甫之一法不可更有冔名兼諸狀雜亂亦不重出世本云黃帝造冕王制云有虞氏皇冕論語云禹致美乎黻冕孔子曰服周之冕此明至周冕始加旒藻玉皆五采前後各十二叔孫通制禮多依周法又漢制度古今之冕略等俱廣八寸長尺六寸前圓後方漢用白玉珠各十二三公九旒青珠中二千石七旒黑珠然冕服之飾周最為備故孔子有服周之冕云舊圖云古三冠梁數雖異俱曰進賢前髙七寸纓長八寸後髙三寸一梁下大夫一命所服兩梁再命大夫二千石所服三梁三命上大夫公侯所服禮不記今案唐典三品已上三梁五品已上兩梁九品已上一梁臣崇義案漢明帝永平二年春正月辛未宗祀光武皇帝於明堂帝及公卿列侯始服冠冕衣裳玉佩絇屨以行事又漢官儀曰天子冠通天諸王冠逺遊三公諸侯冠進賢三梁卿大夫尚書二千石博士冠兩梁千石以下至小吏冠一梁天子公卿特進諸侯祀天地明堂皆冠平冕天子十二旒三公九旒卿大夫諸侯七旒其纓各如綬色玄衣纁裳董巴輿服志曰顯宗初服冕旒衣裳以祀天地上玄下纁乘輿備文日月星辰十二章三公諸侯用山龍已下九章卿已下用華蟲七章皆五采乘輿刺繡公卿已下皆織成陳留襄邑獻之徐廣車服注云漢明帝案古禮備其服章天子郊廟衣皂上絳下前三幅後四幅衣畫而裳繡三禮圖集注卷三
