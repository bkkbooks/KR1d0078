body:
  text: 三禮圖集注卷十九宋聶崇義撰黼翣黻翣畫翣龍翣栁車鄉師方相氏兆域喪大記云君飾棺黼翣二黻翣二畫翣二皆戴圭大夫士皆戴緌禮器曰天子八翣諸侯六翣大夫四翣又鄭注喪大記引漢禮翣以木為筐廣三尺髙二尺四寸方兩頭髙衣以白布畫者畫雲氣其餘各如其象柄長五尺車行使人持之而從以障車既窆樹於壙中障柩天子八翣加龍翣二其戴皆加璧垂羽栁車名有四殯謂之輤車葬謂之栁車以其迫地而行則曰蜃車以其無輤則曰軫車案周禮縫人掌縫棺飾衣翣栁之材後鄭以必先纒衣其材乃以張飾也栁之言聚也謂諸飾所聚也又上注云孝子既啓見棺猶見親之身既載飾而行遂以葬若存時居於帷幕而加文繡其帷荒畫火龍等是加文繡也其生時帷幕則無此畫飾故云加也今柩入壙還以帷荒等加於柩上同葬之故云遂葬喪大記曰飾棺君龍帷三池振容黼荒火三列黻二列素錦禇加帷荒纁紐六齊五采五貝魚躍拂池君纁戴六纁披六此諸侯禮也披皮義反漢禮器制度飾棺天子龍火黼黻皆五列又喪大記注云荒蒙也在旁曰帷在上曰荒然則荒栁車上覆謂鱉甲也天子之荒緣荒邊畫龍又畫雲氣次畫白黑之黼文又畫火形如半環又畫兩己相背之黻文於其間素錦白錦也禇即屋也於荒下又用白錦為屋以葬車在道象宫室也褚外乃加帷荒帷是邊牆荒是上蓋禇覆竟而加帷荒於禇外也池者織竹為之狀如小車笭衣以青布挂著於栁上荒之爪端象平生宫室承霤然天子四注屋四面各有承霤今池亦四面象之也諸侯屋雖四注而栁降一池闕於後故三池振容者振動也容容飾也謂以絞繒為之長丈餘如幡其上畫青質五采之揄翟又懸銅魚於池下車動為容飾魚躍拂池也纁紐六者以上蓋與邊牆相離故又以纁帛為紐連之相著傍各三凡共用六紐也齊者謂在荒之上當栁之中央形圜如車蓋上蕤矣蓋之中央故舉以為説漢時小車蓋上有三采以其當中如人之齊故謂之齊髙三尺徑二尺餘又案既夕禮注云以三采繒為之上朱中白下蒼著以絮則人君以五采繒為之亦著以絮蒼下有黃玄二色則五等相次故云齊五采也五貝者又連貝為五行交絡齊上纁戴六纁披六者戴披皆用纁帛為之戴值也於車輿兩廂各豎三隻軨子各當棺束用此纁戴貫棺束之皮紐出兩頭皆絆結其軨子各使相值堅固方用纁披於棺上橫絡過各貫穿戴之連結棺束者乃於戴餘投出之於外使人持制之又棺橫束有三每束有二紐各屈皮為之三束兩旁共有六紐故有六戴六披也持披者若車登髙則前引以防軒車適下則後引以防翻車欹左則引右欹右則引左使車不傾覆也案阮氏圖云栁車四輪一轅車長丈二尺廣四尺髙五尺周禮謂之蜃車故遂師云大喪使帥其屬以幄帟先及蜃車之役注云幄帟先者為於葬窆之間先張神座蜃車柩輅也柩輅載栁四輪迫地而行有似於蜃因取名焉又鄭注既夕禮記云其車之輿狀如牀中央有轅前後出設前後輅輿上有四周下則前後有軸以輇為輪許慎説文有幅曰輪無幅曰輇孔竇義云觀此注其輿與輴車同亦一轅為之設前後輅者正經唯云前輅言前以對後明有後輅也此輅謂以木縛於柩車轅上屬引而挽之故名此轅縛為輅也輿上有四周者此亦與輴車同云下則前後有軸以輇為輪此與輴車異也以其輴無輪直有轉轔此則有輇輪而無輻地官鄉師及葬執纛以與匠師御匶古柩字而治役注云匠師事官之屬其於司空若鄉師之於司徒也鄉師主役匠師主衆匠共主葬引纛翳也即羽葆也執以指麾挽柩之役正其行列進退也夏官方相氏掌蒙熊皮黃金四目玄衣朱裳執戈揚盾大喪先匶謂葬使之前導以郤凶惡也及墓入壙以戈擊四隅驅罔兩也春官冡人掌公墓之地辨其兆域而為之圖先王之葬居中以昭穆為左右賈釋注云公君也訓公為君者言公則諸侯之通稱言君則上通天子此既王之墓域故訓為君也圖謂未有死者之時先畫其地之形勢預圖出其丘壠之處既為之圖明藏掌之後須葬者依圖置之也云先王造塋者但王之都有遷徙之法若文王居豐武王居鎬平王居洛邑即所都而葬則造塋者也若文王在豐葬於畢子孫皆就而葬之即以文王居中文王次第當穆文王雖次第居穆以所遷居豐葬於畢地子孫既昭穆夾處文王合居中央則以武王為昭居左成王為穆居右康王為昭居左昭王為穆居右穆王為昭居左恭王為穆居右已下子孫皆然據昭穆夾處東西若然兄死弟及俱為君則以兄弟為昭穆以其弟已為臣臣子一列則如父子故别昭穆也必知義當然者案文二年秋八月大事於太廟躋僖公謂以惠公當昭隱公為穆桓公為昭莊公為穆閔公為昭僖公為穆今升僖公於閔公上為昭以閔為穆故云逆祀知不以兄弟同居昭位升僖公於閔公上為逆祀者案定八年經云從祀先公傳曰始順祀先公而祈禱焉若本同倫以僖公升於閔公之上則以後諸公昭穆不亂何得至定八年始云順祀乎明本以僖閔昭穆别故於後皆亂也若然兄弟相事兄為君則昭穆易可知但置塋以昭穆夾處與置廟同也又下文云以爵等為丘封之度則天子亦是爵號也尊者丘髙而樹多卑者封下而樹少以别尊卑也鄭知王公曰丘諸臣曰封者此無正文案爾雅云土之髙者曰丘髙阜曰丘以丘是自然之物故屬之王公也聚土曰封人力所造故屬之諸臣若然公中可兼五等鄭又引漢律列侯封髙四丈者以周禮丘封髙下樹木之數無文故以漢法況之案春秋緯云天子墳髙三仞樹以松諸侯半之樹以柏大夫八尺樹以藥草士四尺樹以槐庶人無墳樹以楊栁鄭不引者春秋緯或説異代多與周禮相乖或者鄭所不見故不引也又王制云庶人不封不樹而春秋緯云庶人樹以楊栁者以庶人禮所不制故容楊栁也三禮圖集注卷十九
