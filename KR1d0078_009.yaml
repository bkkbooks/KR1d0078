body:
  text: 三禮圖集注卷九宋聶崇義撰太常旗旜物如旜素飾其側旟熊旗旐龜蛇合體龍旃翿旗又作翿旌玉輅節服氏節服氏車蓋戈㦸案巾車王乘玉路建太常十有二斿以祀又覲禮注云王建太常縿首畫日月其下及斿交畫升龍降龍縿皆正幅用絳帛為質斿則屬焉又用弧張縿之幅又畫枉矢於縿之上故輈人云弧旌枉矢是也凡旌旗之杠皆注旄與羽於竿首故夏采注云緌以旄牛尾為之綴於橦上其杠長九仞其斿曳地又左傳云三辰旗旗昭其明也據杜鄭二注皆以三辰為日月星蓋太常之上又畫星也阮氏梁正等圖旗首為金龍頭案唐志云金龍頭銜結綬及鈴緌則古注旄及羽於竿首之遺制也司常云交龍為旗注云一象其升朝一象其下復亦謂交畫升龍降龍也此諸侯所建杠長七仞而上公九斿以象大火故輈人注云大火蒼龍宿之心其屬有尾尾九星若侯伯則七斿子男五斿上得兼下下不得僭上其斿長短諸侯齊軫卿大夫齊較士齊肩若天王所建其斿與杠長短一如太常司常云通帛為旜注云通帛謂大赤從周正色無飾長尋正幅賈釋云以周建子為正物萌色赤今旌旗通體盡用絳之赤帛是用周之正色無他物之飾也然仍注旄羽於杠首亦繫斾於末若燕尾也司常云雜帛為物大夫士之所建注云雜帛以帛素飾其側白殷之正色以先王正道佐職也賈釋云雜帛者謂中央赤傍邊白白者殷之正色而在傍故云以先王正道佐職也輈人云鳥旟七斿以象鶉火注云鳥隼為旟鶉火朱鳥宿之栁其屬有星星七星故七斿此亦王者所建又案司常云州里建旟且鄉之州長是中大夫四命遂之里宰是下士一命皆不得建此七斿之旟又後鄭云鳥隼象其勇捷也賈釋云以熊虎龜蛇既各為兩物則隼當謂鷹隼是勇者也鳥謂鳥之捷疾者也輈人云熊旗六斿以象伐注云熊虎為旗伐屬白虎宿與參連體而六星故六斿此王者所建也其斿與杠長短亦如太常若臣下則各依命數然則遂大夫四命四斿鄉大夫六命則為六斿斿之與杠長短則不得如王者之數司常云龜蛇為旐又輈人云龜蛇四斿以象營室注云營室𤣥武宿與東壁連體而四星故四斿此亦王者所建也又鄙師是上士三命雖得建旐而三斿其縣正是下大夫四命旐雖四斿其斿與杠長短亦不得與王者同又案司常九旗之數又有全羽為旞析羽為旌注云全羽析羽皆五采繫之於旞旌之上所謂注旄於竿首也凡九旗之帛皆用絳賈釋云全羽析羽直有羽而無帛鄭云九旗之帛者據衆有者而言也又左傳襄十四年范宣子假羽毛於齊定四年晉人假羽旄於鄭雖毛旄二字不同杜注皆以析羽為旌孔義以全羽析羽之下皆有其帛鄉射記曰君射於境則虎中龍旃注云於境謂與鄰國君射也畫龍旃尚文章也此亦通用絳帛為之翿旌者雜用白羽朱羽以為之案鄉射記國君行燕射於城中命獲者執旌於乏南東面偃旌而立候射中者則舉旌而大聲言獲獲得也射者講武田之類是以中為獲也又上文云旌各以其物無物則以白羽與朱羽糅杠長三仭以鴻脰韜上二尋注云雜帛為物大夫士之所建也不命之士無物此旌即翿旌也糅雜也杠橦也鴻鳥之長脰者且國君自有其旌而用不命之士旌者以其燕主歡心故用之也必以翿為旌者尚文德也賈釋云以文德者舞文舞羽舞也以武德者舞武舞干舞也此翿旌既用羽為之故取尚文德也玉輅序巾車掌王之五輅玉金象革四輅其飾雖異其制則同今特圖玉輅之一兼太常之旗以備祭祀所乘其餘車式皆具考工記別録於下則輪軹之崇轛輢之狀輻內輻外之制大穿小穿之殊蓋之所居釳之所在若誠心觀之則諸輅皆可知矣釳音乞考工記云乘車之輪六尺有六寸注云乘車玉輅金輅象輅也軹崇三尺有三寸加軫與轐七寸共四尺人長八尺登下之以為節也轐輿下伏兔也牙圍一尺一寸不漆其踐地者轂長三尺二寸圍徑一尺三分寸之二車藪空徑三寸九分寸之五大穿空徑四寸五分寸之二小穿空徑二寸十五分寸之四輻廣三寸半轂輻內九寸半輻外一尺九寸輻近罔處廣二寸六分寸之二轂鑿受輻深三寸半又輿人云輪崇車廣衡長俱六尺六寸輿長四尺四寸式深一尺四寸參分寸之二式之髙三尺三寸較髙五尺五寸賈疏云較今之平鬲也孔疏云式上二尺二寸別橫一木謂之較輿後橫木謂之軫圍尺一寸式圍七寸參分寸之一較圍四寸九分寸之八軹圍參寸二十七分寸之七轛圍二寸八十一分寸之十四轂輿皆以革鞔漆之玉輅以玉飾諸末輈深四尺有七寸輈之長丈四尺四寸輈圍一尺四寸五分寸之二輈之頸圍九寸十五分寸之九頸當持衡之處輈之踵圍七寸七十五分寸之五十一踵承輿橫軫者衡任圍一尺三寸五分寸之一任正圍尺四寸五分寸之二任正者輿下三面材也節服氏郊祀裘冕二人執戈送逆尸從車今圖一以曉之又太馭掌馭玉路以祀凡馭路儀以鸞和為節注云鸞在衡和在軾又齊右有祭祀之事兼玉路之右王乘則持馬行則陪乘凡有牲事則前馬注云此謂王見牲則拱而式齊右居馬前却行備驚奔也曲禮曰國君下宗廟式齊牛輪人為蓋蓋斗曰部部徑六寸厚一寸上隆一分斗下達常長二尺徑一寸達常下入杠杠長八尺徑二寸足以含達常也用弓二十有八每弓長六尺廣四分先鑿部為二十八空乃置弓於其空內端即大一分其弓近部二尺稍平外四尺即撓之漸漸下曲而爪末低二尺所以低二尺者謂杠與達常共髙一丈人髙八尺故四面宇曲下低二尺也蓋之寬狹唯可覆軹不及於轄戈廣二寸內倍之胡三之援四之注云戈今之句孑㦸或謂之雞鳴或謂之擁頸內謂胡以內接柲者也長四寸胡六寸援八寸援直刃也胡其孑也廣二寸謂胡也其實援亦廣二寸疏云胡孑橫歃微邪向上不倨不句似磬之折殺也重三鋝鋝重六兩大半兩三鋝重一斤四兩柲長六尺六寸㦸廣寸半內三之胡四之援五之倨句中矩與刺重三鋝注云㦸今三鋒㦸也內長四寸半胡長六寸援長七寸半三鋒者胡直中矩言正方也刺者著柲直前如鐏者也㦸胡橫貫之胡中矩則援之外句磬折與柲長一丈六尺三禮圖集注卷九
