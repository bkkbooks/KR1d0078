body:
  text: 三禮圖集注卷十三宋聶崇義撰斛量名釡牛鼎羊鼎豕鼎鼎幂牛鼎扃羊鼎扃豕鼎扃朼疏匕挑匕上吐雕反又音由畢鉶鼎有蓋鉶柶洗洗罍洗勺盥盤上音管匜簋有蓋簠有蓋敦音對有蓋豆有蓋籩登有蓋籩巾梡俎嶡俎椇俎房俎斛者量名也依法制曰嘉量案漢書律厯志云本起於黃鍾之籥音籥以秬黍中者千有二百實其籥十籥為合十合為升十升為斗十斗為斛五量嘉矣其法用銅欲取同名所以同天下齊風俗也深尺六寸二分內方尺而圜其外旁有庣時雕反量耳其上為斛其下為斗其上謂仰斛也其下謂覆斛謂斛底受一斗左耳為升右耳為合其狀似爵以縻爵祿縻散也圜而函方左一右二隂陽之象也函音含其圜象規其重二鈞三十斤為鈞聲中黃鍾始於黃鍾而反覆焉君制器之象也此與周禮栗氏為釜法制頗同而容受各別釜量名容六斗四升曰釜故以所容為名案周禮栗氏為釜賈疏云謂量金汁入模以為六斗四升之釜又晏子曰齊舊四量豆區釜鍾四升為豆而四豆為區四區為釡釜十則鍾然則釜即釜也以金錫為之與鐘鼎同齊謂四分其金而錫居其一深尺內方尺積千寸於今粟米法少二升八十一分升之二十二圜其外謂繞其口而圜之又厚之以為脣耳在旁者而可舉也舊圗釜在畢洗之間都不言所設之由又無尺寸之法但云釜制度受三斛或云五斛既圖之失處而容受不定未詳據何制度有三五或説今據經傳明文賈鄭義注庶遵往式有補將來又案舊圖有釜而無斛但以二量之法互有異同原始要終相兼乃備故並圗之於前以為諸器之凖案聘禮云飪一牢鼎九設于西階前九鼎者牛一羊二豕三魚四臘五腸胃同鼎六膚七鮮魚八鮮臘九設扃幂今謂牛羊豕三鼎有圖各自象其形自魚臘已下並無其制以其物之細雜無所象故也蓋所用者常鼎而已又舊圖瑚璉及牟形制容受與簠簋相同且瑚璉夏殷之禮器其牟在禮記內則是人之用器圖制既同今略而不出牛鼎受一斛天子飾以黃金諸侯飾以白金今以黍寸之尺計之口徑底徑及深俱一尺三寸三足如牛每足上以牛首飾之羊豕二鼎亦如之此所謂周之禮飾器各以其類之義也羊鼎受五斗大夫亦以銅為之無飾今謂大夫祭用少牢故無牛鼎今以黍寸之尺計之口徑底徑俱一尺深一尺一寸豕鼎受三斗口徑底徑皆八寸深九寸強士以鐡為之無飾今謂士祭用特牲故無羊鼎或説三牲之鼎俱受一斛案下有牛羊豕鼎扃長短不同鼎宜各異或説非也案公食大夫禮云幂者若束若編注云凡鼎幂蓋以茅為之長則束本短則編其中央此蓋令其緻密不泄氣也扃以舉鼎鄭注匠人云牛鼎之扃長三尺羊鼎之扃長二尺五寸豕鼎之扃長二尺漆丹兩端各三寸天子以玉飾兩端諸侯以黃金飾兩端亦各三寸丹飾雜記云朼以桑長三尺注云朼所以載牲體者也喪祭用桑吉則用棘孔疏引特牲記曰匕也舊圖下別有刻匕是其重也既非法制今亦略而不圖有司云雍人合執二俎陳于羊俎西並皆西縮覆二疏匕于其上皆縮俎西枋音柄注云疏匕匕柄有刻飾賈疏云以其言疏是疏通刻之若疏屏之類鄭注疏屏以為刻畫雲氣蟲獸此唯刻畫雲氣通飾其柄舊圖疏匕亦形如飯音鍬以棘為之長二尺四寸葉長八寸博三寸其柄葉通疏皆丹漆之案挑匕注云此亦淺升為之通疏其葉似失之矣亦丹淺升并雲氣為是有司云司馬在羊鼎之東二手執挑匕枋音柄以挹湆注于疏匕注云挑謂之敮讀如或舂或抌之抌音由字或作挑者秦人語也注寫也鄭意以疏匕挑匕皆有淺升狀如飯音鍬挑長柄可以抒物於器中者也抒直吕反取也挹也又引詩或舂或抌今詩抌作揄音由箋云舂而抒出之彼箋此注以抒為取挹兩義無差舊圖挑匕漆柄末及淺升中皆朱柄葉長短廣狹與疏匕同雜記云畢用桑長三尺刊其柄與末孔疏云主人舉肉之時以畢助主人舉肉也用桑者亦謂喪祭也吉時亦用棘末謂畢叉末頭亦刊削之也又特牲禮云宗人執畢先入鄭云畢狀如叉蓋為形似畢星故名焉舊圖云葉博三寸中鏤去一寸柄長二尺四寸漆其柄末及兩葉皆朱臣崇義案畢朼二制禮有明文喪祭用桑取其同名表有哀素吉祭用棘取其赤心盡其至敬蓋聖人制禮有以故興物者如此之深也今若以畢朼二物桑之與棘皆漆而丹之則亡哀素之情遐棄赤心之敬既無所法實謂不經今亦並圖於右兾擇而用之鉶以盛羮受一升口徑六寸有三足足髙一寸有兩耳有蓋士以鐡大夫以銅諸侯以白金飾天子以黃金飾舊本無此已上文舊圖云鉶受一斗兩耳三足髙二寸有蓋士以鐵為之大夫已上以銅為之諸侯飾以白金天子飾以黃金臣崇義案鉶是羮器即鉶鼎也故周禮亨人祭祀則供鉶羮而掌客注云不殺則無鉶鼎又公食大夫禮注云鉶者菜羮和之器故疏引下記牛以藿羊以苦豕以薇是菜和羮也以鉶盛此羮故云之器然則據羮在鉶則曰鉶羮據器言之則曰鉶鼎據在正鼎之後設之則謂之陪鼎據入庶羞言之則謂之羞鼎其實一也今以黍寸之尺計之其口徑底徑并深皆六寸乃受一斗之數今見祭器中有以木為之者平底無足紅油畫之銅字恐相傳為誤故廣引經文注義鉶鼎施用所在圖之於右凡鉶有柶醴有柶用角為之鉶有柶用木為之舊圗云柶長尺㯿博三寸㯿音葉本又作二寸其醴柶宜為二寸曲柄長六寸漆赤中及柄端臣崇義案聘禮云以柶祭醴尚㯿少牢禮云以柶祭羊鉶遂以祭豕鉶又士冠禮注云柶狀如匕以角為之滑也今祭鉶之柶既用木亦冝如疏匕淺升為之方得挹鉶芼之湆以祭之也醴柶葉又淺於鉶柶今案梁阮二氏不辨醴鉶二柶唯云柶圖為勺形無淺深之語恐失之矣又公食大夫禮云設四鉶于豆西又曰扱上鉶以柶辨音遍擩之上鉶之間祭注云扱以柶扱其鉶菜也賈疏云此經有四鉶而扱上鉶辨擩則有一柶優賔故用一柶而已少牢羞兩鉶皆有柶尸扱以柶祭羊鉶豕鉶彼為祭神故冝各有柶也舊圖云洗髙三尺口徑一尺五寸足徑三尺中身小疏中士以鐵為之大夫已上銅為之諸侯白金飾天子黃金飾案士冠禮云設洗直于東榮注直當也洗承盥洗者棄水之器也賈疏云謂盥手洗爵之時恐水穢地以洗承盥水而棄之也今俗有言洗鼓者臣崇義案禮文君臣饗燕冠昏喪祭鄉飲鄉射大射賔射之禮臣下設洗而就洗尸與君尊設洗而不就洗特設盤匜皆無洗鼓之文蓋見當時之洗有身中甚細者狀如腰鼓因相傳為洗鼓又鄭注少牢禮云周之禮飾器各以其類今既用木為洗以金飾口緣朱中其外油畫水文菱花及魚以飾之是其類也案舊圖亦謂之洗壺受一斛口徑一尺脰髙五寸侈旁一寸大中身鋭下漆赤中元士加青雲氣諸説壺與罍形制相似今以壺言之下不可小謹以黍寸之尺計之口空徑一尺一寸脰髙五寸脰中橫徑一尺脰下橫徑一尺腹中橫徑一尺四寸底徑一尺足髙三寸下橫徑一尺二寸自脰下至底中央直徑一尺四寸半乃容一石之數又案鄭注儀禮云水器尊卑皆用金罍及大小異賈疏云此亦據漢禮器制度云尊卑皆用金罍及其大小皆異凡罍洗及酌水之枓音注同時而設今案儀禮諸篇士冠士昏禮鄉飲酒與鄉射及特牲禮皆直言水不言罍燕禮與大射雖言罍水並不枓少牢司宫設罍水於洗東有枓鄭注云凡設水用罍沃盥用枓禮在此欲見罍洗枓三器唯少牢禮俱有餘文不具之意也案舊圖云勺五升口徑六寸曲中博三寸長三寸柄長二尺四寸漆赤中柄末亦丹臣崇義案鄭注士冠禮云勺尊升所以㪺酒音俱挹酌也賈疏引少牢禮云罍枓音注彼枓與此勺為一物但彼枓所以㪺水此勺所以㪺酒又案周禮梓人為勺受一升酌之人情依梓人職受一升為是亦冝畫勺頭為龍頭柄依舊圖長二尺四寸自餘制並同鬱勺盥謂用匜沃盥洗手也盤謂承盥洗者棄水之器也故謂之盥盤舊圖云口徑二尺一寸受二斗漆赤中並不言深淺之數今以黍寸之尺依此二尺二寸口徑計之其底徑八寸深二寸乃容二斗之數足髙二寸下徑一尺匜者盥手澆水之器故孔義云匜似羮魁柄中有道可以沃盥洗手也又公食大夫禮云小臣具盤匜注云君尊不就洗故設盤匜賈疏云知此盤匜為君設者案特牲禮云尸尊不就洗而盥用匜故知此設盤匜亦為君也今開元禮皇帝皇后太子行事皆有盤匜亞獻已下及攝事者皆無盤匜亦君尊設洗而不就洗之義也案梁正張鎰修阮氏等圖云匜受一斗流長六寸漆赤中諸侯以象飾天子以黃金飾皆畫赤雲氣今以黍寸之尺計之口徑八寸深四寸五分底徑六寸微殺乃容一斗之數流口徑可一寸然圖本又有作流長三寸者案鄭注既夕禮云流匜口也又士虞禮注云流匜吐水口也並不言流口寸數揆之人情流長三寸於義為近但周監二代損益可知當國家沿革之初庶為永式舊圖云內方外圎曰簋足髙二寸漆赤中臣崇義案鄭注地官舍人秋官掌客及禮器云圎曰簋盛黍稷之器有蓋象龜形外圎函方以中規矩天子飾以玉諸侯飾以象又案考工記旊人為簋受一斗二升髙一尺厚半寸脣寸又以黍寸之尺較之口徑五寸二分深七寸二分底徑亦五寸二分厚八分足底徑六寸又案賈疏解舍人注云方曰簠圎曰簋皆據外而言也舊圖云外方內圎曰簠足髙二寸挫其四角漆赤中臣崇義案掌客注云簠稻粱器又考工記旊人為簋及豆皆以瓦為之雖不言簠以簋是相將之器亦應制在旊人亦有蓋疏云據祭天地之神尚質器用陶匏而已故郊特牲云器用陶匏以象天地之性也若祭宗廟則皆用木為之今以黍寸之尺計之口圎徑六寸深七寸二分底徑亦五寸二分厚八分足底徑六寸厚半寸脣寸所盛之數及蓋之形制並與簋同舊圖云敦受一斗二升漆赤中大夫飾口以白金臣崇義案九嬪職云凡祭祀贊玉齍音咨注云玉齍玉敦也受黍稷器然則天子八簋之外兼用敦也又少牢禮曰主婦執一金敦黍有蓋凡設四敦皆南首注云敦有首者尊器飾也飾象龜形周之禮飾器各以其類賈疏云鄭必知飾象龜形者以其經云敦皆南首明象蟲獸之形以龜有上下甲故知敦蓋象之亦取其類也又司尊彞敘雞鳥虎蜼之等梓人職説外骨內骨注鳴旁鳴之類謂之小蟲之屬以為雕琢刻畫祭器以博庶物是周之禮飾器各以其類者也又明堂位曰有虞氏之兩敦夏后氏之四璉殷之六瑚哀十一年傳杜預以瑚為夏之禮器杜既不信禮記未知别有何據周之八簋鄭注云皆黍稷器制之異同未聞其瑚璉與牟案諸圖形制既同於簠簋故略而不取其敦今依孝經緯説與簠簋容受並同上下內外皆圎為異九嬪主婦贊執有儀故特圖之次於簠簋舊圖云豆髙尺二寸漆赤中大夫已上畫赤雲氣諸侯飾以象天子加玉飾皆謂飾口足也臣崇義案考工記旊人為豆髙一尺又鄭注周禮及禮記云豆以木為之受四升口圎徑尺二寸有蓋盛昌本脾析豚拍之韲醓螺兔鴈之醢韭菁芹筍之葅麋臡之屬鄭注鄉射記云豆冝濡物籩冝乾物故也臣崇義案鄭注籩人及士虞禮云籩以竹為之口有縢緣形制如豆亦受四升盛棗栗桃梅菱芡脯修膴鮑糗餌之屬有巾案儀禮鄉射脯長尺二寸橫於籩上梁正阮氏圖云登盛湆以瓦為之受斗二升口徑尺二寸足徑尺八寸髙二尺四寸小身有蓋似豆狀所記制度並非禮文類之於豆則形制全大比之豐坫又髙下相殊既非正經不可依據臣崇義案爾雅云木豆謂之豆竹豆謂之籩瓦豆謂之登大雅生民篇曰于豆于登毛傳云木曰豆瓦曰登其在周禮旊人為瓦豆而實四升髙一尺空徑二寸厚半寸又生民傳云豆薦葅醢登盛大羮以其盛湆故有蓋也然則瓦木竹之三豆隨材造作殊名其制大小無異况此圖以三禮為目梁阮二氏自題又何捨此正經别資他説貴從典故豈好是非今依周禮旊人制度為定籩巾用綌玄被纁裏圜一幅禮記明堂位曰俎有虞氏以梡鄭注云梡斷木為四足而已孔疏云虞俎名梡梡形足四如案以有虞氏尚質未有餘飾故知但四足如案耳臣崇義又案舊圖云爼長二尺四寸廣尺二寸髙一尺漆兩端赤中央黑然則四代之俎其間雖有小異髙下長短尺寸漆飾並同案明堂位曰俎夏后氏以嶡鄭上注云梡始有四足嶡為之距疏云以有虞氏尚質但始有四足以夏時漸文嶡雖似梡而增以橫木為距於足中也故鄭又讀嶡為蹶以俎足不正更於足中央以橫木相距象雞有距以距外物也故少牢禮曰腸三胃三皆及俎距是也臣崇義案有虞氏梡俎四足如案自嶡俎已下皆冝有舟今宗廟之俎皆有舟兩端皆圎足為一法案舊圖云椇殷俎也椇讀曰矩曲橈其足臣崇義案明堂位曰殷以椇鄭注云椇之言枳椇也謂曲橈之也孔疏云枳椇之樹其枝多曲橈殷俎足曲橈似之又陸璣草木疏云椇曲來巢殷俎足似之房俎周俎也明堂位曰周以房俎鄭注云房謂足下跗上下兩間有似於房孔疏云如鄭此言則俎頭各有兩足足下各别為跗足間橫者似堂之壁橫下二跗似堂之東西兩頭各有房也臣崇義又案詩魯頌曰籩豆大房箋云大房玉飾俎也其制足間有橫下有跗似乎堂後有房然詩疏云俎大房者以其用玉飾之美大其器故稱大也知用玉飾者以俎豆相類之物明堂位説周公之禮云薦用玉豆豆以玉飾明俎亦用玉飾也云其制足間橫其下有跗以明堂位文差次為然跗上有橫似於堂上有房故謂之房此説稍長竊見祭器內俎兩端皆圎其飾亦異唯跗足與距則似此房俎今雖具四代之俎請擇而用之三禮圖集注卷十三
